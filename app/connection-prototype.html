<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connection setup — limit sliders prototype</title>
<!-- Throwaway prototype of Connection setup with one slider for each pair of limits. Open
     directly. Sample values only; nothing is saved.
     Rules: a pair is the slider's share of the capacity fields, recalculated when its slider moves
     or the capacity changes. Queue limits follow the standard slider. Apply turns limits on only
     when they are off, because a new install starts with No limits; any other choice stays. -->
<style>
*{box-sizing:border-box} :root{color-scheme:dark;--page:#202020;--card:#2b2b2b;--control:#353535;--line:#444;--text:#fff;--muted:#c6c6c6;--accent:#60cdff;--onaccent:#000;--error:#ff99a4}
body.light{color-scheme:light;--page:#f3f3f3;--card:#fbfbfb;--control:#fff;--line:#d4d4d4;--text:#1b1b1b;--muted:#606060;--accent:#005fb8;--onaccent:#fff;--error:#b10e1e}
body{margin:0;background:var(--page);color:var(--text);font:14px/20px 'Segoe UI Variable Text','Segoe UI',sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}h1{font-size:28px;line-height:36px;font-weight:600;margin:0 0 24px}h2{font-size:14px;font-weight:600;line-height:20px;margin:0}p{margin:0}.muted{color:var(--muted)}
.titlebar{height:48px;display:flex;align-items:center;padding:0 16px;gap:24px}.titlebar .search{position:absolute;left:50%;transform:translateX(-50%);width:320px;height:32px;background:var(--control);border-bottom:1px solid var(--muted);border-radius:4px;padding:6px 12px;color:var(--muted)}.titlebar .system{margin-left:auto;display:flex;gap:28px}.titlebar .disabled{opacity:.4}
main{width:calc(100% - 64px);max-width:1000px;margin:28px auto 150px}.split{display:grid;gap:24px;grid-template-columns:320px minmax(0,1fr)}.heading{display:flex;align-items:center;gap:8px;min-height:32px;margin-bottom:12px}.heading h2{flex:1}.btn{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;min-width:90px;background:var(--control);border:1px solid var(--line);border-radius:4px}.btn:hover:not(:disabled){filter:brightness(1.12)}.btn.primary{background:var(--accent);border-color:transparent;color:var(--onaccent)}.icon{min-width:32px;width:32px;padding:0;background:transparent;border-color:transparent}.test{min-width:120px}.test-status{height:44px;margin-bottom:16px}.status{display:flex;align-items:center;gap:8px;height:40px;color:var(--muted);margin:0}
.fields{display:flex;flex-direction:column;gap:16px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field .label{display:flex;justify-content:space-between;gap:8px}.field input:not([type=range]){width:100%;height:32px;padding:5px 10px;background:var(--control);border:1px solid var(--line);border-bottom-color:var(--muted);border-radius:4px;outline:none}.field input:focus{border-bottom:2px solid var(--accent)}.invalid{color:var(--error);font-size:12px;text-align:right}
.slider{margin-top:20px}.slider output{font-weight:600}.slider input{width:100%;margin:6px 0 0;accent-color:var(--accent)}.slider small{color:var(--muted);font-size:12px;line-height:18px}
.preview{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.preview th{font-weight:400;color:var(--muted);height:32px;font-size:12px}.preview th:first-child,.preview td:first-child{text-align:left;width:54%}.preview td,.preview th{text-align:right;padding:8px 10px}.preview td:first-child,.preview th:first-child{padding-left:0}.preview td:last-child,.preview th:last-child{padding-right:0}.preview tr+tr td{border-top:1px solid color-mix(in srgb,var(--line) 40%,transparent)}.preview td:nth-child(2){color:var(--muted)}.changed{font-weight:600}.preview tr.group td{padding-top:18px;padding-bottom:6px;font-weight:600;border-top:0}.preview tr.group td span{display:inline-flex;align-items:center;gap:8px}.preview tr.group small{font-weight:400;color:var(--muted);font-size:14px}.preview tr.indent td:first-child{padding-left:24px}
.footer{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.footer .result{margin-right:auto;color:var(--muted)}
.embedded .titlebar,.embedded .switcher,.embedded .state{display:none}.embedded main{margin-bottom:24px}
.popover{width:320px;max-width:calc(100vw - 24px);padding:20px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px #0006;margin:0;position:fixed;inset:auto}.popover h2{margin-bottom:12px}.popover p{margin-bottom:12px}
.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:calc(100vw - 24px);padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 32px #0005;z-index:5}.switcher select{height:32px;background:var(--control);border:1px solid var(--line);border-radius:4px;padding:0 8px}.switcher label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.switcher .caption{font-size:11px;color:var(--muted);width:100%;text-align:center}.state{font-size:11px;line-height:16px;color:var(--muted);max-width:1000px;margin:0 auto 12px;padding:0 32px}.notice{position:fixed;top:58px;right:20px;background:var(--card);padding:12px 16px;border:1px solid var(--line);border-radius:6px;z-index:8}
@media(max-width:850px){.split{grid-template-columns:1fr}.titlebar .search{display:none}main{width:calc(100% - 32px);margin-top:16px}.switcher .caption{max-width:400px}.preview{font-size:13px}}
</style>
</head>
<body>
<div class="titlebar" aria-hidden="true"><span>←</span><span>File</span><span class="disabled">Torrent</span><span class="disabled">View</span><span>Help</span><span class="search">Search TinyTorrent</span><span class="system"><span>−</span><span>□</span><span>×</span></span></div>
<main id="page"></main>
<div id="readout" class="state" aria-live="polite"></div>
<aside class="switcher" aria-label="Prototype controls">
 <label>Sample settings <select id="sample"><option value="set">Limits already set</option><option value="new">New install</option></select></label>
 <label>Limits to use now <select id="mode"><option value="none">No limits</option><option value="speed">Standard limits</option><option value="alternative">Alternative limits</option><option value="schedule">Weekly schedule</option></select></label>
 <button class="btn" data-action="theme">Light / dark</button>
 <span class="caption">Prototype · sample values · nothing is saved · Test fills in new sample speeds</span>
</aside>
<div id="testInfo" class="popover" popover="auto"><h2>About the speed test</h2><p>Cloudflare · Up to 128 MiB each way</p><p class="muted">Windows proxy settings apply. Cloudflare receives your IP and shares anonymized measurements.</p></div>
<script>
const MIB=1048576;
const paths={gauge:'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/><circle cx="12" cy="14" r="2"/>',arrows:'<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/>',check:'<path d="m5 12 4 4L19 6"/>',x:'<path d="m6 6 12 12M6 18 18 6"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
const modes={none:'No limits',speed:'Standard limits',alternative:'Alternative limits',schedule:'Weekly schedule'};
const embedded=window.parent!==window&&new URLSearchParams(location.search).has('embedded');
document.body.classList.toggle('embedded',embedded);
const pairs={standard:['Standard limits','gauge','Limits for all torrents together, as a share of your connection capacity. At 50% or less, fewer torrents run at once. 100% removes the limits.'],alternative:['Alternative limits','arrows','Limits that apply when you choose Alternative limits in Speed limits, or when a schedule period turns them on. 100% removes the limits.']};
const names={standard:{50:'Reduced',85:'Balanced',100:'Full speed'},alternative:{100:'No limit'}};
const queues={reduced:[2,2,3],balanced:[3,5,8]};
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse=text=>{const t=String(text).trim();if(t==='')return 0;const n=Number(t.replace(',','.'));return Number.isFinite(n)?n:NaN;};
const isCapacity=(value,optional)=>optional&&value===0||Number.isFinite(value)&&value>=0.01&&value<=17179.87;
const same=(a,b)=>!!a&&!!b&&a.download===b.download&&a.upload===b.upload;
const rate=bytes=>bytes===0?'Unlimited':(bytes/MIB).toFixed(1)+' MiB/s';
const fraction=share=>share>=100?0:share/100;
function caps(share,download,upload){if(share>=100)return {download:0,upload:0};if(!isCapacity(download,false)||!isCapacity(upload,false))return null;return {download:Math.round(download*125000*share/100),upload:Math.round(upload*125000*share/100)};}
const samples={
 set:()=>({capacity:{download:409.11,upload:181.57},standard:caps(85,409.11,181.57),alternative:caps(25,409.11,181.57),queue:[3,5,8],mode:'speed'}),
 new:()=>({capacity:{download:0,upload:0},standard:{download:0,upload:0},alternative:{download:0,upload:0},queue:[3,5,8],mode:'none'}),
};
let current=samples.set();
const state={download:'',upload:'',share:{standard:85,alternative:25},moved:{standard:false,alternative:false},tested:false};
// The slider shows the nearest 5% step of the saved limits; 100 means no limit. Before the first
// setup no capacity is saved, so the sliders start at Balanced and 25%.
function initialShare(key){const c=current[key];const capacity=current.capacity.download;if(!(capacity>0))return key==='standard'?85:25;if(c.download===0)return 100;return Math.min(95,Math.max(5,Math.round(c.download/(capacity*125000)*20)*5));}
function open(){const {download,upload}=current.capacity;state.download=download>0?String(download):'';state.upload=upload>0?String(upload):'';for(const key in pairs){state.share[key]=initialShare(key);state.moved[key]=false;}state.tested=false;}
function plan(){const d=parse(state.download),u=parse(state.upload);const capacityChanged=d!==current.capacity.download||u!==current.capacity.upload;const p={recalculated:{}};
 for(const key in pairs){p.recalculated[key]=state.moved[key]||capacityChanged;p[key]=p.recalculated[key]?caps(state.share[key],d,u):{...current[key]};}
 p.needsCapacity=Object.keys(pairs).some(key=>p.recalculated[key]&&state.share[key]<100);
 p.valid=!!(p.standard&&p.alternative);
 // Queue limits follow the standard slider only when the person moves it.
 p.queue=state.moved.standard?[...queues[state.share.standard<=50?'reduced':'balanced']]:[...current.queue];
 p.capacity={download:isCapacity(d,true)?d:current.capacity.download,upload:isCapacity(u,true)?u:current.capacity.upload};
 // A new install starts with No limits, so Apply turns on the standard limits it sets. Any other choice stays.
 p.mode=current.mode==='none'&&p.standard&&!same(p.standard,current.standard)&&p.standard.download+p.standard.upload>0?'speed':current.mode;
 p.changed=!same(p.standard,current.standard)||!same(p.alternative,current.alternative)||p.queue.some((n,i)=>n!==current.queue[i])||p.mode!==current.mode||p.capacity.download!==current.capacity.download||p.capacity.upload!==current.capacity.upload;
 return p;}
// Which pair applies now. In this sample the weekly schedule is outside its periods.
const inUse=key=>({speed:'standard',schedule:'standard',alternative:'alternative'})[current.mode]===key;
function preview(){const p=plan();const count=v=>v===0?'Unlimited':String(v);
 const cell=(label,cur,next,indent=false)=>`<tr class="${indent?'indent':''}"><td>${label}</td><td>${cur}</td><td class="${next!=='—'&&next!==cur?'changed':''}">${next}</td></tr>`;
 const group=key=>`<tr class="group"><td colspan="3"><span>${icon(pairs[key][1])}${pairs[key][0]}${inUse(key)?'<small>· In use</small>':''}</span></td></tr>`+['download','upload'].map(dir=>cell(dir==='download'?'Download limit':'Upload limit',rate(current[key][dir]),p[key]?rate(p[key][dir]):'—',true)).join('');
 const queue=['Maximum active downloads','Maximum active seeds','Maximum active torrents'].map((label,i)=>cell(label,count(current.queue[i]),count(p.queue[i]))).join('');
 const mode=p.mode!==current.mode?cell('Limits to use',modes[current.mode],modes[p.mode]):'';
 return `<table class="preview"><thead><tr><th scope="col">Setting</th><th scope="col">Current</th><th scope="col">Proposed</th></tr></thead><tbody>${group('standard')}${group('alternative')}${queue}${mode}</tbody></table>`;}
function errorFor(key){const value=parse(state[key]);if(isCapacity(value,!plan().needsCapacity))return '';return state[key].trim()===''?'Required':'Enter a number from 0.01 to 17179.87';}
function sliderText(key){const share=state.share[key];const name=names[key][share];return share>=100?name:name?`${name} · ${share}%`:`${share}%`;}
function sliderRates(key){const c=caps(state.share[key],parse(state.download),parse(state.upload));return c?(c.download===0?'No speed limit':`↓ ${rate(c.download)} · ↑ ${rate(c.upload)}`):'Enter your connection speed';}
function slider(key){return `<label class="field slider" title="${escape(pairs[key][2])}"><span class="label">${pairs[key][0]}<output data-output="${key}">${sliderText(key)}</output></span><input type="range" min="5" max="100" step="5" value="${state.share[key]}" data-share="${key}" aria-valuetext="${escape(sliderText(key))}"><small data-rates="${key}">${sliderRates(key)}</small></label>`}
function inputs(){return `<div class="heading"><h2>Connection capacity</h2><button class="btn icon" data-action="info" aria-label="About the speed test" title="About the speed test">${icon('info')}</button><button class="btn test" data-action="test" title="Test pauses torrents temporarily. Apply saves the result.">${icon('gauge')}${state.tested?'Retest':'Test'}</button></div>
 <div class="test-status"><p class="status" role="status">${state.tested?`${icon('check')}Test complete · Transfers restored`:'Not tested'}</p></div>
 <div class="fields">${['download','upload'].map(key=>`<label class="field"><span class="label">${key==='download'?'Download':'Upload'} (Mbps)<span class="invalid" data-error="${key}">${errorFor(key)}</span></span><input data-field="${key}" inputmode="decimal" value="${escape(state[key])}" placeholder="Enter speed"></label>`).join('')}</div>${slider('standard')}${slider('alternative')}`;}
function footer(){const p=plan();return `<footer class="footer"><span class="result">${p.valid?(p.changed?'Changes ready to apply':'No changes'):''}</span><button class="btn primary" data-action="apply" ${p.valid&&p.changed?'':'disabled'}>${icon('check')}Apply</button><button class="btn" data-action="cancel">${icon('x')}Cancel</button></footer>`}
function readout(){const p=plan();const what=key=>p.recalculated[key]?`${state.share[key]}% of capacity`:'kept';document.getElementById('readout').textContent=`Standard ${what('standard')} · alternative ${what('alternative')} · queue ${p.queue.join('/')} · limits to use ${modes[current.mode]} → ${modes[p.mode]}`;}
function render(){document.getElementById('page').innerHTML=`<h1>Connection setup</h1><div class="split"><section>${inputs()}</section><section><div class="heading"><h2>Settings preview</h2></div>${preview()}</section></div>${footer()}`;document.getElementById('mode').value=current.mode;readout();}
function refresh(){document.querySelector('.preview').outerHTML=preview();document.querySelector('.footer').outerHTML=footer();document.querySelectorAll('[data-error]').forEach(node=>node.textContent=errorFor(node.dataset.error));
 document.querySelectorAll('[data-output]').forEach(node=>node.textContent=sliderText(node.dataset.output));document.querySelectorAll('[data-rates]').forEach(node=>node.textContent=sliderRates(node.dataset.rates));document.querySelectorAll('[data-share]').forEach(node=>node.setAttribute('aria-valuetext',sliderText(node.dataset.share)));readout();}
function notice(text){document.querySelector('.notice')?.remove();const node=document.createElement('div');node.className='notice';node.setAttribute('role','status');node.textContent=text;document.body.append(node);setTimeout(()=>node.remove(),3200);}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;switch(button.dataset.action){
 case 'theme':document.body.classList.toggle('light');break;
 case 'info':{const panel=document.getElementById('testInfo'),rect=button.getBoundingClientRect();panel.togglePopover();if(panel.matches(':popover-open')){panel.style.left=Math.max(12,Math.min(innerWidth-panel.offsetWidth-12,rect.left))+'px';panel.style.top=Math.max(12,Math.min(innerHeight-panel.offsetHeight-110,rect.bottom+8))+'px';}break;}
 case 'test':{const speeds=[['387.4','176.2'],['409.11','181.57']];const next=speeds[state.download==='387.4'?1:0];state.download=next[0];state.upload=next[1];state.tested=true;render();break;}
 case 'apply':{const p=plan();current={capacity:p.capacity,standard:p.standard,alternative:p.alternative,queue:p.queue,mode:p.mode};if(embedded){parent.postMessage({action:'apply',current},'*');break;}open();render();notice('Sample changes applied · the Current column now holds them');break;}
 case 'cancel':if(embedded){parent.postMessage({action:'cancel'},'*');break;}open();render();notice('Sample changes discarded');break;
}});
document.addEventListener('input',event=>{const t=event.target;if(t.dataset.field){state[t.dataset.field]=t.value;refresh();}else if(t.dataset.share){state.share[t.dataset.share]=Number(t.value);state.moved[t.dataset.share]=true;refresh();}});
document.addEventListener('change',event=>{const t=event.target;if(t.id==='mode'){current.mode=t.value;render();}else if(t.id==='sample'){current=samples[t.value]();open();render();}});
open();render();
if(embedded){
 window.addEventListener('message',event=>{if(event.source!==parent||event.data?.action!=='open')return;current=event.data.current;document.body.classList.toggle('light',event.data.light);open();render();});
 parent.postMessage({action:'ready'},'*');
 document.addEventListener('keydown',event=>{if(event.key==='Escape')parent.postMessage({action:'cancel'},'*');});
}
</script>
</body>
</html>
