<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page switch feedback — design prototype</title>
<!-- PROTOTYPE, throw away. The Torrents/Library switch as a plain caption button, after the title bar in
     app/src/MainWindow.xaml and the switch in app/src/MainWindow/Library.cs. Sample data in memory only.
     A to G use the same button and differ only in the feedback after the press. H replaces the button with the
     WinUI SelectorBar. I to L are G with feedback while the button is held. Variants: ?variant=A through L. -->
<style>
@font-face { font-family:Lucide; src:url('../lib/Lucide/src/Fonts/lucide.ttf') format('truetype'); }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
:root { color-scheme:light; --page:#f3f3f3; --card:#fbfbfb; --ctl:#fdfdfd; --ctlBorder:#e5e5e5; --text:#1a1a1a; --muted:#5f5f5f;
  --accent:#005fb8; --hover:rgb(0 0 0 / .037); --pressed:rgb(0 0 0 / .024); --sel:rgb(0 0 0 / .055);
  --line:rgb(0 0 0 / .08); --stroke:rgb(117 117 117 / .35); --head:#ebebeb; --bar:#e6e6e6; }
body.dark { color-scheme:dark; --page:#202020; --card:#2b2b2b; --ctl:#2d2d2d; --ctlBorder:rgb(255 255 255 / .07); --text:#fff; --muted:#c8c8c8;
  --accent:#60cdff; --hover:rgb(255 255 255 / .06); --pressed:rgb(255 255 255 / .04); --sel:rgb(255 255 255 / .08);
  --line:rgb(255 255 255 / .082); --stroke:rgb(117 117 117 / .4); --head:#272727; --bar:#3a3a3a; }
body { margin:0; padding:0 12px 120px; background:#d9d9d9; color:var(--text); font:14px/20px 'Segoe UI Variable Text','Segoe UI',sans-serif; }
body.dark { background:#161616; }
button, input { font:inherit; color:inherit; }
.i { display:inline-block; width:16px; height:16px; flex:none; font:16px/1 Lucide; text-align:center; }
.trim { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
:focus-visible { outline:2px solid var(--text); outline-offset:-2px; border-radius:4px; }

/* prototype marker and controls: deliberately not Fluent, so they never read as part of the design */
.proto-top { max-width:1240px; margin:0 auto 8px; padding:6px 12px; background:#0b0b0b; border-radius:0 0 8px 8px; font:12px/16px Consolas,monospace; color:#ffd479; text-align:center; }
.proto { position:fixed; bottom:8px; left:50%; transform:translateX(-50%); z-index:50; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; align-items:center;
  padding:6px 10px; max-width:calc(100vw - 16px); border-radius:16px; background:#0b0b0b; color:#fff; border:1px solid #ffd479; box-shadow:0 8px 24px rgb(0 0 0 / .5); font:12px/16px Consolas,monospace; }
.proto button { background:#262626; color:#fff; border:1px solid #555; border-radius:999px; padding:3px 10px; font:inherit; cursor:pointer; }
.proto button.on { background:#ffd479; color:#000; border-color:#ffd479; }
.proto .sep { width:1px; height:18px; background:#555; }
.proto label { display:flex; gap:4px; align-items:center; }
#readout { max-width:1240px; margin:8px auto 0; padding:10px 12px; background:#0b0b0b; color:#d8f0c8;
  border:1px solid #ffd479; border-radius:8px; font:11px/15px Consolas,monospace; white-space:pre-wrap; }
#idea { max-width:1240px; margin:8px auto 0; padding:8px 12px; background:#0b0b0b; color:#fff; border-radius:8px; font:12px/17px Consolas,monospace; }
#idea b { color:#ffd479; }
body.mark .pg { outline:2px dashed #ffb000; outline-offset:-2px; }

/* window and title bar, after MainWindow.xaml; every caption button, the page switch included, shares these states */
.window { max-width:1240px; height:520px; margin:0 auto; background:var(--page); border:1px solid #555; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
.tbar { height:48px; flex:none; display:flex; align-items:center; }
.cap { position:relative; height:48px; min-width:46px; flex:none; display:flex; align-items:center; justify-content:center; gap:8px; border:0; padding:0 11px; background:transparent; }
.cap:hover { background:var(--hover); }
.cap:active, .cap.down { background:var(--pressed); }
.cap.close:hover { background:#c42b1c; color:#fff; }
.cap.lang { font-size:12px; }
.cap img { width:24px; height:24px; display:block; }
#swb { margin-left:8px; }
#swb .nm { width:60px; text-align:left; }
#swb .flash { position:absolute; left:50%; bottom:6px; width:16px; height:3px; margin-left:-8px; border-radius:2px; background:var(--accent); opacity:0; }
/* Press feedback while the switch is held: the press shows at once (no transition in), the release eases back */
body[data-press~="dim"] #swb.down img, body[data-press~="dim"] #swb.down .nm { opacity:.55; }
body[data-press~="squish"] #swb img, body[data-press~="nudge"] #swb img { transition:transform 250ms cubic-bezier(.3,1.6,.5,1); }
body[data-press~="squish"] #swb.down img { transform:scale(.8); transition:none; }
body[data-press~="nudge"] #swb.down img { transform:translateX(var(--nudge)); transition:none; }
body.still #swb img { transition:none !important; transform:none !important; }
/* SelectorBar, after the WinUI control: secondary text, primary when selected, accent pill under the selected item */
.logo { width:24px; height:24px; flex:none; margin:0 12px 0 19px; }
.sbar { display:flex; gap:2px; margin-right:4px; }
.sbi { position:relative; height:36px; display:flex; align-items:center; gap:8px; padding:0 12px; border:0; border-radius:4px; background:transparent; color:var(--muted); }
.sbi img { width:16px; height:16px; }
.sbi:hover { background:var(--hover); color:var(--text); }
.sbi:active, .sbi.down { background:var(--pressed); }
.sbi[aria-selected="true"] { color:var(--text); }
.sbi[aria-selected="true"]::after { content:''; position:absolute; left:50%; bottom:0; width:16px; height:3px; margin-left:-8px; border-radius:2px; background:var(--accent); }
.menus { display:flex; margin-left:4px; }
.menu { height:32px; padding:0 10px; border:0; border-radius:4px; background:transparent; }
.menu:hover { background:var(--hover); }
.searchArea { flex:1; min-width:0; display:flex; justify-content:center; padding:0 24px; }
.gbox { position:relative; width:320px; min-width:120px; }
.gbox input { width:100%; height:32px; padding:0 32px 0 11px; border:1px solid var(--ctlBorder); border-bottom-color:var(--stroke); border-radius:4px; background:var(--ctl); }
.gbox .i { position:absolute; right:9px; top:8px; color:var(--muted); }
.tb-end { display:flex; align-items:center; }

/* page content */
.toolbar { height:44px; flex:none; display:flex; align-items:center; gap:4px; }
.tool { height:32px; display:flex; align-items:center; gap:8px; padding:0 10px; border:0; border-radius:4px; background:transparent; }
.tool:hover { background:var(--hover); }
.tsep { width:1px; height:20px; background:var(--line); margin:0 4px; }
.body { flex:1; min-height:0; display:flex; gap:8px; padding:0 8px 8px; }
.pane { flex:none; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 4px; overflow:hidden; }
.pane h4 { margin:4px 12px 8px; font-size:14px; font-weight:600; }
.layers { position:relative; overflow:hidden; }
.layer { position:absolute; inset:0; }
.pane .layers { flex:1; }
.opt { display:flex; align-items:center; gap:12px; height:36px; padding:0 12px; border-radius:4px; position:relative; }
.opt.on { background:var(--sel); }
.opt.on::before { content:''; position:absolute; left:0; top:10px; width:3px; height:16px; border-radius:2px; background:var(--accent); }
.opt .n { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
.stage { flex:1; min-width:0; }
.page { display:flex; flex-direction:column; }
.tw { flex:1; min-height:0; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:8px; }
table { width:100%; border-collapse:collapse; table-layout:fixed; }
th { height:32px; text-align:left; font-weight:400; color:var(--muted); background:var(--head); padding:0 12px; border-bottom:1px solid var(--line); }
td { height:32px; padding:0 12px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
td.r, th.r { text-align:right; font-variant-numeric:tabular-nums; }
tr.sel td { background:var(--sel); }
.bar { height:4px; border-radius:2px; background:var(--bar); }
.bar span { display:block; height:4px; border-radius:2px; background:var(--accent); }
.status { height:32px; flex:none; display:flex; align-items:center; gap:16px; padding:0 16px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="proto-top">THROWAWAY PROTOTYPE · Torrents ⇄ Library switch feedback · sample data · not the product · Ctrl+1 / Ctrl+2 (or Alt+1 / Alt+2 when the browser takes Ctrl)</div>

<div class="window" id="win">
  <header class="tbar">
    <button class="cap pg" id="swb"></button>
    <img class="logo" id="logo" src="../resources/tinyTorrent.svg" alt="TinyTorrent" hidden>
    <div class="sbar pg" id="sb" role="tablist" aria-label="Pages" hidden></div>
    <nav class="menus"><button class="menu">File</button><button class="menu pg" id="m2">Torrent</button><button class="menu">View</button><button class="menu">Help</button></nav>
    <div class="searchArea"><div class="gbox pg"><input id="gq" aria-label="Search" placeholder="Search TinyTorrent"><span class="i" aria-hidden="true">&#xE151;</span></div></div>
    <div class="tb-end">
      <button class="cap" title="Settings · Ctrl+,"><span class="i">&#xE154;</span></button>
      <button class="cap lang" title="Language">EN</button>
      <button class="cap" id="themeCap" title="Switch to dark theme"><span class="i">&#xE208;</span></button>
      <button class="cap" tabindex="-1"><span class="i">&#xE11C;</span></button>
      <button class="cap" tabindex="-1"><span class="i">&#xE167;</span></button>
      <button class="cap close" tabindex="-1"><span class="i">&#xE1B2;</span></button>
    </div>
  </header>
  <div class="body">
    <aside class="pane pg" id="pane">
      <h4>Filters</h4>
      <div class="layers"><div class="layer" data-page="torrents" id="f-torrents"></div><div class="layer" data-page="library" id="f-library" hidden></div></div>
    </aside>
    <main class="stage layers pg">
      <section class="page layer" data-page="torrents" id="p-torrents"><div class="toolbar"></div><div class="tw"></div></section>
      <section class="page layer" data-page="library" id="p-library" hidden><div class="toolbar"></div><div class="tw"></div></section>
    </main>
  </div>
  <footer class="status pg" id="status"></footer>
</div>
<div id="idea"></div>

<nav class="proto" aria-label="Prototype controls">
  <span>variant</span><span id="vbtns"></span>
  <span class="sep"></span>
  <span>commit on</span><button data-commit="press">press</button><button data-commit="release">release</button>
  <span class="sep"></span>
  <label title="The page arrives 400 ms after the click, as when the switch has work to do first"><input type="checkbox" id="late"> slow page</label>
  <label><input type="checkbox" id="slow"> slow ×5</label>
  <label><input type="checkbox" id="reduce"> reduced motion</label>
  <label><input type="checkbox" id="mark"> mark changes</label>
  <button id="dark">dark</button>
</nav>
<pre id="readout"></pre>

<script>
const $ = id => document.getElementById(id);
const PAGES = {
  torrents:{ name:'Torrents', icon:'../resources/tinyTorrent.svg', key:'Ctrl+1', menu:'Torrent', search:'Search TinyTorrent' },
  library:{ name:'Library', icon:'src/Assets/Settings/library.svg', key:'Ctrl+2', menu:'Library', search:'Search library' },
};
// content: how the button bar, table and filter content change. button: extra feedback on the switch itself.
const VARIANTS = {
  A:{ title:'No extra feedback', content:'none', button:'none', label:false,
    idea:'<b>A · plain button, no extra feedback.</b> Hover and press shade it like every other caption button. The icon and the whole page change in the same frame. Nothing moves.' },
  B:{ title:'Slide', content:'slide', button:'none', label:false,
    idea:'<b>B · plain button, page slides.</b> The button bar, table and filter content slide 250 ms with cubic ease-out, left into Library and right back to Torrents. This is the app\'s slide, now also used by the filters and the inspector.' },
  C:{ title:'Settle', content:'settle', button:'none', label:false,
    idea:'<b>C · plain button, page settles.</b> The new page is in place and fully visible in the press frame, then rises the last 12 px in 167 ms. Less travel than a slide, so it reads as a refresh of the same place.' },
  D:{ title:'Icon pop', content:'none', button:'pop', label:false,
    idea:'<b>D · feedback on the button only.</b> The new page\'s icon grows from 60% to full size in 150 ms, so the eye at the pointer sees the change. The page itself changes instantly.' },
  E:{ title:'Icon pop and slide', content:'slide', button:'pop', label:false,
    idea:'<b>E · feedback at both places.</b> D\'s icon pop at the pointer and B\'s page slide.' },
  F:{ title:'Accent mark', content:'none', button:'flash', label:false,
    idea:'<b>F · a short accent mark.</b> An accent pill appears under the icon on the press and fades out over 600 ms, the same pill Windows uses for a selected navigation item. The page changes instantly.' },
  G:{ title:'Icon and page name', content:'slide', button:'none', label:true,
    idea:'<b>G · the button names the current page</b> in words beside its icon, like a labelled caption button. The page slides as in B. Costs about 70 px of title bar and a translated label.' },
  I:{ title:'G + Fluent pressed foreground', content:'slide', button:'none', label:true, commit:'release', press:'dim',
    idea:'<b>I · G with the full Fluent pressed state.</b> Fluent\'s pressed fill is lighter than its hover fill, so the fill alone reads as the hover going away. WinUI buttons also change their foreground while pressed; here the icon and name dim while the button is held. The page changes on release.' },
  J:{ title:'G + taskbar squish', content:'slide', button:'none', label:true, commit:'release', press:'squish',
    idea:'<b>J · G with the Windows 11 taskbar press.</b> The icon shrinks to 80% the moment it is pressed and springs back on release, as taskbar and Start icons do. The page changes on release.' },
  K:{ title:'G + direction nudge', content:'slide', button:'none', label:true, commit:'release', press:'nudge',
    idea:'<b>K · G with a WinUI animated-icon press.</b> While pressed, the icon moves 3 px toward the destination page, as WinUI\'s animated Back arrow moves on press. It points the way the page will slide: right towards Library, left towards Torrents. The page changes on release.' },
  L:{ title:'G + dim and squish', content:'slide', button:'none', label:true, commit:'release', press:'dim squish',
    idea:'<b>L · I and J together.</b> The icon shrinks and the icon and name dim while pressed; both spring back on release, when the page changes.' },
  H:{ title:'Fluent SelectorBar', content:'slide', button:'none', label:false, selector:true, commit:'release',
    idea:'<b>H · the WinUI SelectorBar,</b> the control Microsoft prescribes for switching between a small number of views. Both pages are always visible. The item shades on press, and on click the accent pill moves to it in the same frame, before the page has arrived (try "slow page"). The page slides in from the chosen item\'s side, as in Microsoft\'s own SelectorBar example. Clicking the selected item again does nothing, so extra clicks never send you back. The app logo becomes a plain logo. Costs about 200 px of title bar.' },
};
const S = { variant:'A', page:'torrents', shown:'torrents', commit:'press', downAt:0, swallowClick:false, last:null, ignored:0, dark:false };

const ROWS_T = [
  ['ubuntu-24.04.3-desktop-amd64.iso','6.1 GB',100,'Seeding','—','812 KB/s'],
  ['Sintel (2010) 2160p','4.3 GB',64,'Downloading','3.2 MB/s','140 KB/s'],
  ['debian-13.1.0-amd64-netinst.iso','754 MB',100,'Seeding','—','96 KB/s'],
  ['Tears of Steel (2012) 1080p','1.2 GB',31,'Downloading','1.1 MB/s','22 KB/s'],
  ['Fedora-Workstation-Live-43.iso','2.4 GB',8,'Downloading','640 KB/s','—'],
  ['archlinux-2026.10.01-x86_64.iso','1.3 GB',100,'Paused','—','—'],
  ['Big Buck Bunny (2008) 1080p','887 MB',100,'Seeding','—','4 KB/s'],
  ['LibreOffice_25.8_Win_x86-64.msi','352 MB',100,'Seeding','—','—'],
  ['Elephants Dream (2006) 1080p','815 MB',47,'Paused','—','—'],
  ['Cosmos Laundromat (2015) 2K','1.9 GB',100,'Seeding','—','31 KB/s'],
];
const ROWS_L = [
  ['Sintel','2010','Movie','14 min','7.4'],['Tears of Steel','2012','Movie','12 min','6.2'],['Big Buck Bunny','2008','Movie','10 min','6.4'],
  ['Elephants Dream','2006','Movie','11 min','6.0'],['Cosmos Laundromat','2015','Movie','12 min','7.1'],['Spring','2019','Short','8 min','7.5'],
  ['Agent 327: Operation Barbershop','2017','Short','4 min','7.6'],['Coffee Run','2020','Short','3 min','7.0'],['Sprite Fright','2021','Short','10 min','7.3'],['Charge','2022','Short','4 min','6.9'],
];
$('p-torrents').querySelector('.tw').innerHTML = `<table><colgroup><col><col style="width:90px"><col style="width:140px"><col style="width:120px"><col style="width:100px"><col style="width:100px"></colgroup>
  <thead><tr><th>Name</th><th class="r">Size</th><th>Progress</th><th>Status</th><th class="r">Down</th><th class="r">Up</th></tr></thead><tbody>${
  ROWS_T.map((r,i) => `<tr class="${i===1?'sel':''}"><td>${r[0]}</td><td class="r">${r[1]}</td><td><div class="bar"><span style="width:${r[2]}%"></span></div></td><td>${r[3]}</td><td class="r">${r[4]}</td><td class="r">${r[5]}</td></tr>`).join('')}</tbody></table>`;
$('p-library').querySelector('.tw').innerHTML = `<table><colgroup><col><col style="width:80px"><col style="width:100px"><col style="width:100px"><col style="width:80px"></colgroup>
  <thead><tr><th>Title</th><th class="r">Year</th><th>Kind</th><th class="r">Length</th><th class="r">Rating</th></tr></thead><tbody>${
  ROWS_L.map((r,i) => `<tr class="${i===0?'sel':''}"><td>${r[0]}</td><td class="r">${r[1]}</td><td>${r[2]}</td><td class="r">${r[3]}</td><td class="r">${r[4]}</td></tr>`).join('')}</tbody></table>`;

const ic = code => `<span class="i" aria-hidden="true">${code}</span>`;
const tool = (code, label) => `<button class="tool">${ic(code)}<span>${label}</span></button>`;
const filters = list => list.map(([n,c,on]) => `<div class="opt ${on?'on':''}"><span class="trim">${n}</span><span class="n">${c}</span></div>`).join('');
const CHROME = {
  torrents:{
    tool: tool('&#xE0C9;','Add') + '<span class="tsep"></span>' + tool('&#xE13C;','Resume') + tool('&#xE12E;','Pause') + '<span class="tsep"></span>' + tool('&#xE18E;','Remove'),
    filters: filters([['All',10,1],['Downloading',3],['Seeding',5],['Paused',2],['Errors',0]]),
    width:196, status:'<span>↓ 4.9 MB/s</span><span>↑ 1.1 MB/s</span><span>10 torrents</span>' },
  library:{
    tool: tool('&#xE537;','Fetch') + tool('&#xE3A4;','Subtitles') + '<span class="tsep"></span>' + tool('&#xE13C;','Play') + tool('&#xE0D7;','Folder'),
    filters: filters([['All videos',10,1],['Movies',5],['Shorts',5],['Unidentified',0],['Watched',3]]),
    width:280, status:'<span>10 videos</span><span>34 GB</span>' },
};

const other = p => p === 'torrents' ? 'library' : 'torrents';
const reduced = () => $('reduce').checked || matchMedia('(prefers-reduced-motion: reduce)').matches;
const speed = () => $('slow').checked ? 5 : 1;
const variant = () => VARIANTS[S.variant];

function renderSwitch() {
  const b = $('swb'), dest = other(S.page), tip = `Switch to ${PAGES[dest].name} (${PAGES[dest].key})`;
  // Keep the same icon element, so a press transform eases back after the page changes.
  if (!b.querySelector('img') || !!b.querySelector('.nm') !== variant().label)
    b.innerHTML = `<img alt="">${variant().label ? '<span class="nm trim"></span>' : ''}<span class="flash"></span>`;
  b.querySelector('img').src = PAGES[S.page].icon;
  if (variant().label) b.querySelector('.nm').textContent = PAGES[S.page].name;
  b.title = tip;
  b.setAttribute('aria-label', tip);
  b.style.setProperty('--nudge', dest === 'library' ? '3px' : '-3px');
  $('sb').innerHTML = ['torrents', 'library'].map(p => `<button class="sbi" role="tab" data-dest="${p}" aria-selected="${p === S.page}" title="${PAGES[p].name} (${PAGES[p].key})"><img src="${PAGES[p].icon}" alt="">${PAGES[p].name}</button>`).join('');
}

function buttonFeedback() {
  if (reduced()) return;
  const b = $('swb');
  if (variant().button === 'pop')
    b.querySelector('img').animate([{ transform:'scale(.6)' }, { transform:'scale(1)' }], { duration:150 * speed(), easing:'cubic-bezier(.1,.9,.2,1)' });
  if (variant().button === 'flash')
    b.querySelector('.flash').animate([{ opacity:1 }, { opacity:1, offset:.3 }, { opacity:0 }], { duration:600 * speed(), easing:'ease-out' });
}

$('swb').addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  S.downAt = e.timeStamp;
  $('swb').classList.add('down');
  if (S.commit === 'press') { S.swallowClick = true; commit(other(S.page), e.timeStamp, 'pointer press'); }
});
for (const type of ['pointerup', 'pointerleave', 'pointercancel']) $('swb').addEventListener(type, () => $('swb').classList.remove('down'));
$('swb').addEventListener('click', e => {
  if (S.swallowClick && e.detail !== 0) { S.swallowClick = false; return; }
  S.swallowClick = false;
  const keyboard = e.detail === 0;
  commit(other(S.page), keyboard ? e.timeStamp : S.downAt, keyboard ? 'keyboard' : 'pointer release');
});

// The SelectorBar selects a page instead of toggling, so clicking the selected item does nothing.
$('sb').addEventListener('pointerdown', e => {
  const item = e.target.closest('.sbi');
  if (!item || e.button !== 0) return;
  S.downAt = e.timeStamp;
  item.classList.add('down');
  if (S.commit === 'press') { S.swallowClick = true; select(item.dataset.dest, e.timeStamp, 'pointer press'); }
});
for (const type of ['pointerup', 'pointerout', 'pointercancel'])
  $('sb').addEventListener(type, e => e.target.closest('.sbi')?.classList.remove('down'));
$('sb').addEventListener('click', e => {
  const item = e.target.closest('.sbi');
  if (!item) return;
  if (S.swallowClick && e.detail !== 0) { S.swallowClick = false; return; }
  S.swallowClick = false;
  const keyboard = e.detail === 0;
  select(item.dataset.dest, keyboard ? e.timeStamp : S.downAt, keyboard ? 'keyboard' : 'pointer release');
});

function select(dest, t0, via) {
  if (dest === S.page) { S.ignored++; readout(); return; }
  commit(dest, t0, via);
}

// The switch and its feedback change at once; the page itself can arrive later when "slow page" is on.
function commit(dest, t0, via) {
  const from = S.page;
  S.page = dest;
  renderSwitch();
  buttonFeedback();
  if ($('late').checked) setTimeout(() => showPage(dest), 400 * speed());
  else showPage(dest);
  requestAnimationFrame(frame => {
    S.last = { via, from, to:dest, pressToFirstFrameMs:Math.max(0, Math.round(frame - t0)),
      note: via === 'pointer release' ? 'includes how long the button was held' : 'press and change share one frame' };
    readout();
  });
}

function showPage(dest) {
  const from = S.shown;
  if (from === dest) return;
  S.shown = dest;
  $('m2').textContent = PAGES[dest].menu;
  $('gq').placeholder = PAGES[dest].search;
  $('status').innerHTML = CHROME[dest].status;
  $('pane').style.width = CHROME[dest].width + 'px';
  const forward = dest === 'library';
  move($('p-' + dest), $('p-' + from), forward);
  move($('f-' + dest), $('f-' + from), forward);
}

// One motion for the page and the filter content, so they always move together.
function move(incoming, outgoing, forward) {
  const kind = variant().content;
  for (const layer of incoming.parentElement.children) {
    layer.getAnimations().forEach(a => a.cancel());
    layer.hidden = layer !== incoming && layer !== outgoing;
  }
  incoming.hidden = false;
  if (kind !== 'slide' || reduced()) outgoing.hidden = true;
  if (reduced() || kind === 'none') return;
  if (kind === 'settle') {
    incoming.animate([{ transform:'translateY(12px)' }, { transform:'translateY(0)' }], { duration:167 * speed(), easing:'cubic-bezier(.1,.9,.2,1)' });
    return;
  }
  const w = incoming.parentElement.clientWidth * (forward ? 1 : -1);
  const timing = { duration:250 * speed(), easing:'cubic-bezier(.215,.61,.355,1)' };
  outgoing.animate([{ transform:'translateX(0)' }, { transform:`translateX(${-w}px)` }], timing).onfinish = () => {
    if (S.page !== outgoing.dataset.page) outgoing.hidden = true;
  };
  incoming.animate([{ transform:`translateX(${w}px)` }, { transform:'translateX(0)' }], timing);
}

function setVariant(v) {
  S.variant = v;
  S.commit = variant().commit ?? 'press';
  document.body.dataset.press = variant().press ?? '';
  $('swb').hidden = !!variant().selector;
  $('logo').hidden = $('sb').hidden = !variant().selector;
  renderSwitch();
  $('idea').innerHTML = variant().idea;
  const url = new URL(location.href);
  url.searchParams.set('variant', v);
  history.replaceState(null, '', url);
  syncProto();
  readout();
}

function syncProto() {
  for (const b of document.querySelectorAll('[data-v]')) b.classList.toggle('on', b.dataset.v === S.variant);
  for (const b of document.querySelectorAll('[data-commit]')) b.classList.toggle('on', b.dataset.commit === S.commit);
  $('dark').classList.toggle('on', S.dark);
}

function readout() {
  $('readout').textContent = JSON.stringify({
    variant:`${S.variant} · ${variant().title}`, page:S.page, commitOn:S.commit,
    contentMotion:variant().content, buttonFeedback:variant().button, pressFeedback:variant().press ?? 'fill only', label:variant().label,
    slowPage:$('late').checked, slowMotion:$('slow').checked, reducedMotion:reduced(),
    clicksOnSelectedItemIgnored:S.ignored,
    changesOnSwitch:['switch icon','second menu (Torrent / Library)','search placeholder','button bar','filter content and width','table','status bar'],
    lastSwitch:S.last ?? 'none yet',
  }, null, 2);
}

$('vbtns').innerHTML = Object.keys(VARIANTS).map(k => `<button data-v="${k}" title="${VARIANTS[k].title}">${k}</button>`).join(' ');
document.querySelector('.proto').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.v) setVariant(b.dataset.v);
  if (b.dataset.commit) { S.commit = b.dataset.commit; syncProto(); readout(); }
});
const toggleDark = () => { S.dark = !S.dark; document.body.classList.toggle('dark', S.dark); $('themeCap').title = S.dark ? 'Switch to light theme' : 'Switch to dark theme'; $('themeCap').firstElementChild.innerHTML = S.dark ? '&#xE1C2;' : '&#xE208;'; syncProto(); };
$('dark').onclick = toggleDark;
$('themeCap').onclick = toggleDark;
$('mark').onchange = () => document.body.classList.toggle('mark', $('mark').checked);
$('slow').onchange = readout;
$('reduce').onchange = () => { document.body.classList.toggle('still', reduced()); readout(); };
document.body.classList.toggle('still', reduced());
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.altKey) || !['1','2'].includes(e.key)) return;
  e.preventDefault();
  const dest = e.key === '1' ? 'torrents' : 'library';
  if (dest !== S.page) commit(dest, e.timeStamp, 'shortcut');
});

for (const page of ['torrents', 'library']) {
  $('p-' + page).querySelector('.toolbar').innerHTML = CHROME[page].tool;
  $('f-' + page).innerHTML = CHROME[page].filters;
}
$('pane').style.width = CHROME[S.page].width + 'px';
$('status').innerHTML = CHROME[S.page].status;
const start = new URLSearchParams(location.search).get('variant');
setVariant(Object.hasOwn(VARIANTS, start) ? start : 'A');
</script>
</body>
</html>
