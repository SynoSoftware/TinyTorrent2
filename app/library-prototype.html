<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library layout prototype</title>
<!-- PROTOTYPE, throw away. The Library page inside the real product window (title bar, menus, global search,
     status bar and InfoBars from app/src/MainWindow.xaml). Open this file directly; every file, title and outcome is
     sample data in memory, and nothing reaches a network or the disk. -->
<style>
* { box-sizing:border-box; }
:root { color-scheme:light; --page:#f3f3f3; --card:#fbfbfb; --ctl:#fdfdfd; --ctlBorder:#e5e5e5; --ctlLine:#868686; --text:#1a1a1a; --muted:#5f5f5f;
  --accent:#005fb8; --accentText:#003e92; --onAccent:#fff; --hover:rgb(0 0 0 / .037); --pressed:rgb(0 0 0 / .024); --sel:rgb(0 0 0 / .055);
  --head:#ebebeb; --headCard:#f1f1f1; --line:rgb(0 0 0 / .08); --stroke:rgb(117 117 117 / .35); --critical:#c42b1c; --caution:#9d5d00; --success:#0f7b0f;
  --infoBg:#f6f6f6; --critBg:#fde7e9; --cautBg:#fff4ce; --flyout:#f9f9f9; --scrim:rgb(0 0 0 / .3); }
body.dark { color-scheme:dark; --page:#273035; --card:#323b40; --ctl:#3c4448; --ctlBorder:rgb(255 255 255 / .07); --ctlLine:#a1a3a5; --text:#fff; --muted:#c8c8c8;
  --accent:#60cdff; --accentText:#99ebff; --onAccent:#000; --hover:rgb(255 255 255 / .045); --pressed:rgb(255 255 255 / .03); --sel:rgb(255 255 255 / .08);
  --head:#2f383d; --headCard:#394247; --line:rgb(255 255 255 / .082); --stroke:rgb(117 117 117 / .4); --critical:#ff99a4; --caution:#fce100; --success:#6ccb5f;
  --infoBg:#2e353a; --critBg:#442726; --cautBg:#433519; --flyout:#2c2c2c; --scrim:rgb(0 0 0 / .45); }
body { margin:0; background:#161616; color:var(--text); font:14px/20px 'Segoe UI Variable Text','Segoe UI',sans-serif; }
body:not(.dark) { background:#d9d9d9; }
button, input, select { font:inherit; color:inherit; }
svg.i { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.muted { color:var(--muted); } .crit { color:var(--critical); } .caut { color:var(--caution); } .ok { color:var(--success); }
.trim { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
:focus-visible { outline:2px solid var(--text); outline-offset:1px; border-radius:4px; }

/* prototype marker and controls: deliberately not Fluent, so they never read as part of the design */
.proto-top { max-width:1600px; margin:0 auto 4px; padding:6px 12px; background:#0b0b0b; border-radius:0 0 8px 8px; font:12px/16px Consolas,monospace; color:#ffd479; text-align:center; }
.proto { position:fixed; left:50%; bottom:10px; transform:translateX(-50%); z-index:50; display:flex; gap:8px; align-items:center; padding:6px 10px;
  border-radius:999px; background:#0b0b0b; color:#fff; border:1px solid #ffd479; box-shadow:0 8px 24px rgb(0 0 0 / .5); font:12px/16px Consolas,monospace; white-space:nowrap; width:max-content; max-width:calc(100vw - 16px); flex-wrap:wrap; justify-content:center; border-radius:16px; }
.proto button, .proto select { background:#262626; color:#fff; border:1px solid #555; border-radius:999px; padding:3px 10px; font:inherit; }
.proto .sep { width:1px; height:18px; background:#555; flex:none; }
.proto input[type=range] { width:90px; vertical-align:middle; }
#menus { position:fixed; left:12px; right:12px; top:40px; z-index:48; max-height:calc(100vh - 110px); overflow:auto; padding:12px 16px; background:var(--page); color:var(--text);
  border:1px solid #ffd479; border-radius:8px; box-shadow:0 8px 24px rgb(0 0 0 / .4); }
#menus h3 { margin:8px 0; font:600 14px/20px 'Segoe UI',sans-serif; }
#menus .set { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; margin-bottom:12px; }
#menus .fly { position:static; }
#menus .fly .cap2 { padding:4px 12px; font-weight:600; }
#readout { position:fixed; right:12px; bottom:56px; z-index:49; width:380px; max-height:60vh; overflow:auto; margin:0; padding:12px; background:#0b0b0b; color:#d8f0c8;
  border:1px solid #ffd479; border-radius:8px; font:11px/15px Consolas,monospace; white-space:pre-wrap; }

/* window and title bar, after MainWindow.xaml */
.window { position:relative; margin:0 auto; background:var(--page); border:1px solid #555; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
.tbar { height:48px; flex:none; display:flex; align-items:center; }
.cap { width:46px; height:48px; flex:none; display:grid; place-items:center; border:0; background:transparent; border-radius:0; }
.cap:hover { background:var(--hover); } .cap.close:hover { background:#c42b1c; color:#fff; }
.cap svg { width:16px; height:16px; } .cap.win svg { width:12px; height:12px; stroke-width:1.4; }
.appicon { width:24px; height:24px; margin:0 8px 0 16px; flex:none; border-radius:5px; background:linear-gradient(160deg,#00e5ff,#0075ff 55%,#0000b4); }
.menubar { display:flex; gap:0; flex:none; }
.menubar button { height:32px; padding:0 10px; border:0; border-radius:4px; background:transparent; }
.menubar button:hover:not(:disabled), .menubar button.on { background:var(--hover); }
.menubar button:disabled { color:var(--muted); opacity:.55; }
/* The real box keeps 200px; here it may shrink so an overflowing title bar stays visible at 800px in Spanish. */
.gsearch { flex:1; min-width:48px; margin:0 24px; display:flex; }
.gbox { position:relative; width:100%; max-width:320px; min-width:0; display:flex; align-items:center; height:32px; border-radius:4px; background:var(--ctl);
  border:1px solid var(--ctlBorder); border-bottom-color:var(--ctlLine); }
.gbox:focus-within { background:var(--card); border-bottom:2px solid var(--accent); }
.gbox input { flex:1; min-width:0; height:30px; border:0; outline:0; background:transparent; padding:0 6px 0 10px; }
.gbox input::placeholder { color:var(--muted); }
.gbox .qi { width:32px; display:grid; place-items:center; color:var(--muted); flex:none; }
.gbox .clear { width:28px; height:24px; border:0; padding:0; display:grid; place-items:center; background:transparent; border-radius:4px; flex:none; }
.gbox .clear:hover { background:var(--hover); } .gbox .clear svg { width:12px; height:12px; }
.vdiv { width:1px; height:16px; background:var(--line); margin:0 8px; flex:none; }
.tb-end { display:flex; align-items:center; margin-left:auto; flex:none; }

/* controls */
.btn { display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 11px; border-radius:4px; background:var(--ctl); border:1px solid var(--ctlBorder);
  white-space:nowrap; cursor:default; flex:none; }
.btn:hover:not(:disabled) { background:var(--card); } .btn:disabled { opacity:.45; }
.btn.accent { background:var(--accent); border-color:var(--accent); color:var(--onAccent); } .btn.accent:hover:not(:disabled) { filter:brightness(1.08); background:var(--accent); }
.btn.subtle { background:transparent; border-color:transparent; } .btn.subtle:hover:not(:disabled) { background:var(--hover); }
.btn.icon { width:32px; padding:0; justify-content:center; }
.btn.on { background:var(--sel); }
.btn .chev { width:12px; height:12px; color:var(--muted); }
select.combo, input.tx { height:32px; border-radius:4px; background:var(--ctl); border:1px solid var(--ctlBorder); border-bottom-color:var(--ctlLine); padding:0 8px; min-width:0; }
input.tx:focus { outline:0; border-bottom:2px solid var(--accent); background:var(--card); }
.seg { display:inline-flex; gap:2px; padding:2px; border-radius:6px; background:var(--sel); }
.seg button { height:28px; padding:0 12px; border:0; border-radius:4px; background:transparent; white-space:nowrap; }
.seg button[aria-checked=true] { background:var(--card); box-shadow:0 1px 2px rgb(0 0 0 / .15); font-weight:600; }
.selbar { display:flex; gap:4px; flex:none; }
.selbar button { position:relative; height:36px; padding:0 12px; border:0; border-radius:4px; background:transparent; white-space:nowrap; color:var(--text); display:inline-flex; align-items:center; gap:6px; }
.selbar button:hover:not(:disabled) { background:var(--hover); }
.selbar button[aria-selected=true]::after { content:''; position:absolute; left:calc(50% - 8px); bottom:1px; width:16px; height:3px; border-radius:2px; background:var(--accent); }
.selbar.pages button { height:32px; }
.selbar.pages svg { width:16px; height:16px; }
.selbar.pages.narrow button { padding:0 10px; }
.selbar.pages.narrow .lbl { display:none; }
.selbar .n { color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums; }
.link { color:var(--accentText); cursor:default; border:0; background:transparent; padding:0; text-decoration:none; }
.link:hover { text-decoration:underline; }
.ring { width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:spin .8s linear infinite; flex:none; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion:reduce) { .ring { animation-duration:2.4s; } }

/* page bodies */
.main { flex:1; min-height:0; position:relative; display:flex; flex-direction:column; }
.row-h { display:flex; align-items:center; gap:8px; flex:none; min-width:0; }
.card { background:var(--card); border:1px solid var(--stroke); border-radius:8px; }
.split { flex:none; display:flex; align-items:center; justify-content:center; border:0; background:transparent; padding:0; border-radius:0; }
.split.h { height:8px; cursor:ns-resize; } .split.h::after { content:''; width:24px; height:3px; border-radius:2px; background:var(--ctlLine); opacity:.6; }
.split.v { width:8px; cursor:ew-resize; } .split.v::after { content:''; width:3px; height:24px; border-radius:2px; background:var(--ctlLine); opacity:.6; }

/* TableView: header band, one vertical scroll owner, never scrolls sideways (columns past the edge are cut off) */
.tv { flex:1; min-height:110px; min-width:0; overflow-y:auto; overflow-x:hidden; position:relative; scrollbar-width:thin; }
.tv table { border-collapse:separate; border-spacing:0; table-layout:fixed; }
.tv th { position:sticky; top:0; z-index:1; height:32px; padding:0; background:var(--head); text-align:left; font-weight:400; color:var(--muted); border-bottom:1px solid var(--line); }
.tv th button { width:100%; height:32px; border:0; background:transparent; text-align:inherit; padding:0 12px; display:flex; align-items:center; gap:4px; color:inherit; justify-content:inherit; border-radius:0; }
.tv th button:hover { background:var(--hover); color:var(--text); }
.tv th.r { text-align:right; } .tv th.r button { justify-content:flex-end; }
.tv th svg { width:12px; height:12px; }
.tv td { height:36px; padding:0 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tv td.r { text-align:right; font-variant-numeric:tabular-nums; }
.tv tr.row { cursor:default; }
.tv tr.row:hover td { background:var(--hover); }
.tv tr.row.sel td { background:var(--sel); }
.tv tr.row.sel td:first-child { box-shadow:inset 3px 0 0 -0px transparent; position:relative; }
.tv tr.row.sel td:first-child::before { content:''; position:absolute; left:2px; top:10px; bottom:10px; width:3px; border-radius:2px; background:var(--accent); }
.tv tr.row:focus-visible { outline:2px solid var(--text); outline-offset:-2px; border-radius:0; }
.tv.stale td { color:var(--muted); }
.fn { display:flex; align-items:center; gap:8px; min-width:0; } .fn svg { color:var(--muted); }
.fn span { overflow:hidden; text-overflow:ellipsis; }
.two { display:flex; flex-direction:column; justify-content:center; line-height:18px; min-width:0; }
.two small { color:var(--muted); font-size:12px; line-height:16px; overflow:hidden; text-overflow:ellipsis; }
.two b { font-weight:400; overflow:hidden; text-overflow:ellipsis; }
.stw { display:inline-flex; align-items:center; gap:6px; } .stw svg { width:14px; height:14px; }
.ph { position:absolute; inset:40px 0 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center; }
.ph h3 { margin:0; font:600 20px/28px 'Segoe UI Variable Display','Segoe UI',sans-serif; }

.note { display:flex; align-items:flex-start; gap:12px; padding:12px 16px; border-radius:4px; border:1px solid var(--line); background:var(--infoBg); }
.note.warn { background:var(--cautBg); }
.note > svg { margin-top:2px; } .note.warn > svg { color:var(--caution); }
.note .msg { flex:1; min-width:0; } .note .msg b { font-weight:600; margin-right:6px; }
.note .act { display:flex; gap:8px; flex:none; align-self:center; }
.cands { display:flex; flex-direction:column; gap:2px; margin:0; padding:0; list-style:none; }
.cand { display:flex; gap:12px; align-items:flex-start; padding:8px 12px; border-radius:4px; cursor:default; }
.cand:hover { background:var(--hover); } .cand[aria-checked=true] { background:var(--sel); }
.cand .dot { width:20px; height:20px; border-radius:10px; border:1px solid var(--muted); flex:none; margin-top:1px; }
.cand[aria-checked=true] .dot { border:6px solid var(--accent); background:var(--onAccent); }
.cand .two small { white-space:normal; }
.idform { display:flex; flex-direction:column; gap:12px; }
.idform .fields { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
.idform label.f { display:flex; flex-direction:column; gap:4px; min-width:0; }
.idform .eps { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
.result-status { display:flex; align-items:center; gap:8px; color:var(--muted); min-height:32px; }

/* the details card: the torrent Inspector's card, title row and Field rows */
.work { flex:1; min-height:0; min-width:0; display:flex; flex-direction:column; }
.insp { margin:0 8px; display:flex; flex-direction:column; min-height:155px; overflow:hidden; flex:none; }
.ih { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto; column-gap:12px; align-items:center; padding:0 16px; min-height:48px; border-bottom:1px solid var(--line); flex:none; }
.ih .hn { display:flex; align-items:center; gap:12px; min-width:0; }
.ih .gi { width:20px; height:20px; color:var(--accentText); flex:none; }
.ih .gi.crit, .fn .crit { color:var(--critical); }
.ih .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.ih .det { color:var(--muted); white-space:nowrap; }
.ih .hacts { justify-self:end; display:flex; gap:4px; }
.dtabs button { height:44px; } .dtabs button:disabled { opacity:.45; }
.ib { flex:1; min-height:0; position:relative; padding:8px 16px 12px; display:flex; }
.ibs { flex:1; min-height:0; overflow:auto; container-type:inline-size; scrollbar-width:thin; }
.ib > .infobar { position:absolute; left:16px; right:16px; bottom:12px; }
.iempty { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--muted); text-align:center; }
.iempty svg { width:32px; height:32px; opacity:.6; }
.gen { display:flex; flex-direction:column; gap:16px; margin-top:4px; }
.grph { display:flex; align-items:center; gap:8px; }
.grph svg { width:20px; height:20px; color:var(--accentText); flex:none; }
.grph .gt { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.strip { display:grid; row-gap:12px; justify-content:space-between; }
.stat { display:flex; gap:12px; align-items:flex-start; }
.stat > svg { width:20px; height:20px; color:var(--muted); margin-top:10px; flex:none; }
.stat .scap { font-size:12px; line-height:16px; color:var(--muted); white-space:nowrap; }
.stat .sv { font-size:18px; line-height:24px; white-space:nowrap; min-width:112px; user-select:text; }
.hr { height:1px; background:var(--line); flex:none; }
.details { display:grid; grid-template-columns:3fr 2fr; column-gap:48px; }
@container (max-width:760px) { .details { grid-template-columns:minmax(0,1fr); column-gap:0; } }
.fld { display:grid; grid-template-columns:16px 120px minmax(0,1fr); column-gap:8px; align-items:center; min-height:32px; }
.fld > svg { color:var(--muted); }
.fld .fl { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fld .fv { display:grid; grid-template-columns:minmax(0,auto) auto; column-gap:4px; justify-content:start; align-items:center; min-width:0; }
.fld .v { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; user-select:text; }
.fld .v .appic { width:16px; height:16px; vertical-align:-3px; margin-right:8px; }
.fld .v.id { font:13px/20px 'Cascadia Mono',Consolas,monospace; color:var(--muted); }
.fld.wrap { align-items:start; } .fld.wrap > svg, .fld.wrap .fl { margin-top:8px; } .fld.wrap .v { white-space:normal; padding:6px 0; }
.infobar.err { background:var(--critBg); box-shadow:none; } .infobar.err > svg { color:var(--critical); }

/* InfoBar over the bottom of the workspace, above the status bar, overlaying every page */
.infobars { position:absolute; left:16px; right:16px; bottom:8px; display:flex; flex-direction:column; gap:8px; z-index:5; pointer-events:none; }
.infobar { pointer-events:auto; display:flex; align-items:center; gap:12px; padding:10px 12px 10px 16px; border-radius:4px; border:1px solid var(--line); background:var(--cautBg); box-shadow:0 4px 12px rgb(0 0 0 / .14); }
.infobar > svg { color:var(--caution); }
.infobar .msg { flex:1; min-width:0; } .infobar .msg b { font-weight:600; margin-right:8px; }

/* status bar, after MainWindow.xaml: one line, status only, labels shorten to icons when narrow */
.sb { flex:none; display:flex; align-items:center; min-height:20px; margin:8px 16px 12px; white-space:nowrap; overflow:hidden; font-size:12px; line-height:16px; }
.sb .grp { display:flex; align-items:center; gap:20px; min-width:0; } .sb .grp + .grp { margin-left:auto; padding-left:24px; }
.si { display:inline-flex; align-items:center; gap:6px; flex:none; } .si svg { width:14px; height:14px; }
.si.icon .t { display:none; }

/* flyouts, menus and dialogs */
.fly { position:absolute; z-index:20; min-width:200px; max-width:360px; padding:4px; border-radius:8px; background:var(--flyout); border:1px solid var(--stroke); box-shadow:0 8px 16px rgb(0 0 0 / .2); }
.fly .mi { display:flex; align-items:center; gap:12px; width:100%; height:32px; padding:0 12px; border:0; border-radius:4px; background:transparent; text-align:left; white-space:nowrap; }
.fly .mi:hover:not(:disabled), .fly .mi:focus-visible { background:var(--hover); outline-offset:-2px; }
.fly .mi:disabled { opacity:.45; }
.fly .mi .k { margin-left:auto; padding-left:24px; color:var(--muted); font-size:12px; }
.fly .mi .n { margin-left:auto; padding-left:16px; color:var(--muted); font-variant-numeric:tabular-nums; }
.fly .mi .mark { width:16px; display:grid; place-items:center; }
.fly hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
.fly .fh { padding:8px 12px 4px; color:var(--muted); font-size:12px; }
.fly .pad { padding:8px 12px; display:flex; flex-direction:column; gap:8px; }
.fly.search { padding:4px; min-width:320px; max-width:440px; }
.fly.search .mi { height:auto; min-height:36px; padding:6px 12px; }
.scrim { position:absolute; inset:0; z-index:30; background:var(--scrim); display:grid; place-items:center; padding:16px; }
.dlg { width:560px; max-width:100%; max-height:calc(100% - 32px); display:flex; flex-direction:column; background:var(--card); border:1px solid var(--stroke); border-radius:8px; box-shadow:0 16px 48px rgb(0 0 0 / .35); overflow:hidden; }
.dlg .body { padding:24px; overflow:auto; display:flex; flex-direction:column; gap:12px; min-height:0; }
.dlg h2 { margin:0; display:flex; gap:12px; align-items:center; font:600 20px/28px 'Segoe UI Variable Display','Segoe UI',sans-serif; }
.dlg h2 svg { width:20px; height:20px; color:var(--accentText); }
.dlg p { margin:0; }
.dlg .foot { display:flex; justify-content:flex-end; gap:8px; padding:24px; background:var(--page); border-top:1px solid var(--line); flex:none; }
.dlg .foot .btn { min-width:120px; justify-content:center; }
.tip { position:fixed; z-index:60; max-width:340px; padding:6px 8px 8px; border-radius:4px; background:var(--flyout); color:var(--text); border:1px solid var(--stroke);
  box-shadow:0 4px 8px rgb(0 0 0 / .2); font-size:12px; line-height:16px; pointer-events:none; white-space:pre-line; }

/* Library page: filters drawer */
.a-head { display:flex; align-items:center; gap:16px; padding:4px 16px 12px; flex:none; flex-wrap:nowrap; min-width:0; }
.a-head h1 { margin:0; font:600 28px/36px 'Segoe UI Variable Display','Segoe UI',sans-serif; flex:none; }
.a-body { flex:1; min-height:0; display:flex; }
.a-pane { width:220px; flex:none; overflow-y:auto; padding:0 8px 8px; display:flex; flex-direction:column; gap:4px; scrollbar-width:thin; }
.a-pane .ph2 { display:flex; align-items:center; justify-content:space-between; height:36px; padding-left:8px; font-weight:600; }
.a-pane .gh { padding:12px 8px 4px; color:var(--muted); font-size:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.a-pane .opt { position:relative; display:flex; align-items:center; gap:8px; width:100%; height:32px; padding:0 8px 0 12px; border:0; border-radius:4px; background:transparent; text-align:left; }
.a-pane .opt:hover { background:var(--hover); }
.a-pane .opt[aria-checked=true] { background:var(--sel); }

  const se = base.match(/S(\d{1,2})E(\d{1,3})(?:-?E(\d{1,3}))?/i);
  const yr = base.match(/(?:^|[.\s_(])((?:19|20)\d\d)(?:[.\s_)]|$)/);
  let title = base.split(/[.\s_](?:S\d{1,2}E\d|(?:19|20)\d\d[.\s_)]|\d{3,4}p)/i)[0].replace(/[._]/g, ' ').trim();
  if (/^(VTS|GOPR|IMG|DSC)/i.test(title)) title = '';
  return {title, year:se ? '' : (yr?.[1] || ''), kind:se ? 'series' : 'movie', season:se ? +se[1] : 1, from:se ? +se[2] : 1, to:se ? +(se[3] || se[2]) : 1};
}

/* The details card is the torrent Inspector (app/src/Views/InspectorPane.xaml) with Library's two sections. Same card and
   splitter, same title row (group icon, name, size detail, centred SelectorBar, Close), same Field rows (icon, 120px label,
   value, optional action), same error InfoBar over the bottom of the body, same empty state. */
const FAIL = {missing:['Missing', () => 'Windows found no file at the recorded location. It may have been moved or deleted outside TinyTorrent.'],
  unavailable:['Unavailable', () => 'The location could not be reached. The drive or network share may be disconnected; this does not mean the file was deleted.'],
  noapp:["Couldn't open", e => `Windows has no app that opens .${ext(e).toUpperCase()} files. The file itself is still there.`]};
/* One row of the Inspector's Field template: 16px icon, 120px label with tooltip, then the value and its icon action. */
const field = (icon, label, text, action = '', cls = '', tip = text, lead = '') => `<div class="fld ${cls === 'wrap' ? 'wrap' : ''}">${ic(icon)}<span class="fl" title="${esc(label)}">${esc(label)}</span><span class="fv"><span class="v ${cls}" title="${esc(tip)}">${lead}${esc(text)}</span>${action}</span></div>`;
const fieldAct = (act, label, icon, dis = false) => `<button class="btn icon subtle" data-act="${act}" aria-label="${esc(label)}" title="${esc(label)}" ${dis ? 'disabled' : ''}>${ic(icon)}</button>`;
/* InspectorStatisticStyle: a 20px icon beside the caption, the value below it. */
const stat = (icon, label, value, tip = '') => `<div class="stat">${ic(icon)}<div><div class="scap">${esc(label)}</div><div class="sv" ${tip ? `title="${esc(tip)}"` : ''}>${esc(value)}</div></div></div>`;
const strip = items => `<div class="strip">${items.join('')}</div>`;
const groupHead = (icon, text, gap) => `<div class="grph" style="margin-bottom:${gap}px">${ic(icon)}<span class="gt" role="heading" aria-level="2" title="${esc(text)}">${esc(text)}</span></div>`;
const details = (left, right) => `<div class="details"><div>${left}</div><div>${right}</div></div>`;
/* A short label for the card, and the explanation for its tooltip. */
function idStatus(e) {
  const s = e.ident.s;
  if (!S.enrichment) return ['Off', 'Movie and TV information is off. File names are still searchable.'];
  if (s === 'ambiguous') return [`${e.ident.c.length} possible titles`, `Several titles match the file name: ${e.ident.c.map(c => `${CATALOG[c].title} (${CATALOG[c].year})`).join(', ')}.`];
  if (s === 'pending') return S.provider === 'fail' ? ['Waiting for TMDB', 'TMDB cannot be reached. TinyTorrent tries again later; searching by file name still works.'] : ['Identifying…', 'Looking up the file name on TMDB.'];
  return {auto:['Identified', 'Identified automatically from the file name.'], manual:['Identified', 'Identified by you.'],
    cleared:['Cleared', 'You cleared the identification, so TinyTorrent does not identify this file automatically again.'], none:['Not identified', 'No title matched the file name.']}[s];
}
const moreBtn = e => `<button class="btn icon subtle" data-act="fly" data-fly="more" id="more-btn" aria-label="${T('more')}" title="${T('more')}" aria-haspopup="menu">${ic('more')}</button>`;
const epCode = (season, n) => `S${String(season).padStart(2, '0')}E${String(n).padStart(2, '0')}`;
/* Video information in the General tab's structure: statistics, divider, heading, two-column Field grid. */
function videoPage(e) {
  const i = info(e);
  if (!i) {
    const [label, tip] = idStatus(e), dis = !canWrite();
    const act = !S.enrichment ? fieldAct('enable', T('turnOn'), 'identify', dis) : e.ident.s === 'pending' ? '' : fieldAct('identify', T('identify'), 'identify', dis);
    return `<div class="gen"><div>${groupHead('video', shownTitle(e), 6)}${details(field(e.ident.s === 'pending' && S.provider === 'fail' ? 'cloudoff' : 'identify', T('identification'), label, act, '', tip), '')}</div></div>`;
  }
  const stats = i.kind === 'movie' ? [stat('film', T('cType'), T('movie')), stat('cal', T('released'), String(i.v.year))]
    : [stat('tv', T('cType'), T('episode')), stat('list', i.eps.length > 1 ? T('episodesL') : T('episodeL'), code(i)), stat('cal', T('aired'), fmtDate(i.eps[0].air)), stat('cal', T('premiered'), String(i.v.year))];
  const left = (i.eps ? field('list', i.eps.length > 1 ? T('episodesL') : T('episodeL'), i.eps.map(x => `${epCode(i.season, x.n)} · ${x.t}`).join(', ')) : '')
    + field('tag', T('genres'), i.v.genres.join(', ')) + field('users', T('cast'), i.v.cast.join(', ')) + field('alignLeft', T('synopsis'), i.v.synopsis, '', 'wrap');
  const right = i.v.original ? field('languages', T('original'), i.v.original) : '';
  return `<div class="gen"><div>${strip(stats)}</div><div class="hr"></div><div>${groupHead(i.kind === 'movie' ? 'film' : 'tv', i.v.title, 6)}${details(left, right)}</div></div>`;
}
/* Music information from the tags read when the download finished, in the same structure. */
function musicPage(e) {
  const t = tags(e);
  if (!t) return `<div class="gen"><div>${groupHead('music', shownTitle(e), 6)}${details(field('music', T('tagsL'), 'None', '', '', 'This file has no tags'), '')}</div></div>`;
  return `<div class="gen"><div>${strip([stat('list', T('cTrack'), String(t.track)), stat('clock', T('cDuration'), fmtDur(t.secs)), stat('cal', T('year'), String(t.year))])}</div><div class="hr"></div>
    <div>${groupHead('music', t.title, 6)}${details(field('users', T('cArtist'), t.artist) + field('disc', T('cAlbum'), t.album), field('tag', T('genre'), t.genre))}</div></div>`;
}
/* The File page: facts about this one finished file, in the General tab's Field rows and Details grid. */
function filePage(e) {
  const left = field('file', T('cName'), e.file) + field('folder', T('folderL'), e.dir, fieldAct('open-folder', T('openFolder'), 'folderOpen'))
    + field('torrents', T('torrent'), e.torrent, fieldAct('show-torrent', T('showT'), 'torrents'));
  const right = field('hdd', T('cSize'), fmtSize(e.size), '', '', `${e.size.toLocaleString()} bytes`) + field(typeIcon(e), T('typeOfFile'), typeName(e))
    + (app => field('open', T('opensWith'), app ? app[0] : T('noApp'), '', '', app ? app[0] : T('noApp'), app ? appIcon(app) : ''))(openApp(e))
    + field('cal', T('createdL'), fmtStamp(e.created)) + field('clock', T('modifiedL'), fmtStamp(e.mod));
  return `<div class="gen"><div>${groupHead('info', T('propertiesH'), 6)}${details(left, right)}</div></div>`;
}
/* Video or Music information first. Another file shows File without changing the chosen section. */
const hasInfoPage = e => isAudio(e) || e.ident.s !== 'other';
const detPage = e => hasInfoPage(e) ? S.dtab : 'file';
function detailsCard() {
  if (!S.detailsOpen) return '';
  const e = sel(), page = e ? detPage(e) : S.dtab;
  const audio = e ? isAudio(e) : S.cfg === 'music';
  const tabs = `<div class="selbar dtabs" role="tablist" aria-label="${T('details')}">${[['video', audio ? T('gMusic') : T('gVideo')], ['file', T('gFile')]].map(([k, l]) => {
    const off = !e || (k === 'video' && !hasInfoPage(e));
    const tip = off ? (e ? 'Not a video or audio file' : '') : k !== 'video' ? '' : audio ? 'From the tags in the file' : `${info(e) ? 'From TMDB. ' : ''}${idStatus(e)[1]}`;
    return `<button role="tab" aria-selected="${!!e && page === k}" data-act="dtab" data-k="${k}" data-fid="dtab-${k}" tabindex="${page === k ? 0 : -1}" ${off ? 'disabled' : ''} ${tip ? `title="${esc(tip)}"` : ''}>${l}</button>`; }).join('')}</div>`;
  /* As in the Inspector title row: a glyph, the name and its size. The file name appears only here. */
  const name = e ? `<span class="hn">${entryIcon(e, 'gi')}<span class="name" title="${esc(e.file)}" role="heading" aria-level="1">${esc(e.file)}</span><span class="det">${fmtSize(e.size)}</span></span>` : '<span class="hn"></span>';
  /* Icon buttons with tooltips, like the Inspector's Close, so the row still fits beside the centred sections at 800px. */
  const dis = canWrite() ? '' : 'disabled';
  const acts = e ? `<span class="hacts"><button class="btn icon subtle" data-act="open" data-fid="open" ${dis} aria-label="${T('open')}" title="${openApp(e) ? `${T('open')} with ${openApp(e)[0]} (Enter)` : `${T('open')} (Enter)`}">${ic('open')}</button>
    ${info(e) ? `<button class="btn icon subtle" data-act="correct" ${dis} aria-label="${T('edit')}" title="${T('edit')} · Change which movie or episode this file is">${ic('pencil')}</button>` : ''}${moreBtn(e)}</span>` : '<span></span>';
  const body = e ? (page === 'file' ? filePage(e) : audio ? musicPage(e) : videoPage(e))
    : `<div class="iempty">${ic('pointer')}<span>No file selected</span></div>`;
  const fail = e && e.fail ? `<div class="infobar err" role="status">${ic('alert')}<div class="msg" title="${esc(FAIL[e.fail.kind][1](e))}"><b>${FAIL[e.fail.kind][0]}</b><span class="muted">${e.fail.at}</span></div>
    <button class="btn" data-act="open" ${canWrite() ? '' : 'disabled'}>${ic('retry')}${T('retry')}</button></div>` : '';
  return `<button class="split h" data-split="card" role="separator" aria-orientation="horizontal" aria-label="Resize details" aria-valuenow="${S.split}" tabindex="0"></button>
    <section class="card insp" style="height:${S.split}px" aria-label="${T('details')}"><div class="ih">${name}${tabs}${acts}
      <button class="btn icon subtle" data-act="close-details" aria-label="${T('close')}" title="${T('close')}">${ic('x')}</button></div>
    <div class="ib"><div class="ibs" data-region="details">${body}</div>${fail}</div></section>`;
}

/* Identify: search the provider, choose a title, then the season and episodes for a series */
function identifyForm() {
  const d = S.idf, e = entries.find(x => x.id === d.id);
  if (!e) return '';
  let list;
  if (d.results === 'busy') list = `<div class="result-status"><span class="ring"></span>Searching TMDB…</div>`;
  else if (d.results === 'error') list = `<div class="note warn" role="status">${ic('cloudoff')}<div class="msg" title="Nothing was changed"><b>TMDB did not respond</b></div><div class="act"><button class="btn" data-act="id-search">${ic('retry')}${T('retry')}</button></div></div>`;
  else if (d.results === 'empty') list = `<div class="result-status">No title in the file name</div>`;
  else if (!d.results.length) list = `<div class="result-status" title="Check the spelling or leave the year empty">No titles found</div>`;
  else list = `<ul class="cands" role="radiogroup" aria-label="Titles found">${d.results.map((k, n) => { const c = CATALOG[k];
    return `<li class="cand" role="radio" tabindex="${d.pick === k || (!d.pick && n === 0) ? 0 : -1}" aria-checked="${d.pick === k}" data-act="id-pick" data-k="${k}" data-fid="cand-${k}"><span class="dot"></span>
      <span class="two"><b>${esc(c.title)} <span class="muted">(${c.year})</span></b><small>${c.kind === 'movie' ? T('movie') : T('kindSeries') + ', premiered'} ${c.year} · ${c.genres.join(', ')} · ${esc(c.synopsis)}</small></span></li>`; }).join('')}</ul>`;
  const pick = d.pick && CATALOG[d.pick];
  let eps = '';
  if (pick && pick.kind === 'series') {
    const seasons = Object.keys(EPISODES[d.pick] || {1:[]});
    const n = ((EPISODES[d.pick] || {})[d.season] || []).length || 24;
    const opts = v => [...Array(n)].map((_, i) => `<option ${i + 1 === v ? 'selected' : ''}>${i + 1}</option>`).join('');
    const epT = ((EPISODES[d.pick] || {})[d.season] || [])[d.from - 1]?.[0] || '';
    eps = `<div class="eps"><label class="f">${T('season')}<select class="combo" data-in="season">${seasons.map(s => `<option ${+s === d.season ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
      <label class="f">${T('epFrom')}<select class="combo" data-in="from">${opts(d.from)}</select></label><label class="f">${T('epTo')}<select class="combo" data-in="to">${opts(d.to)}</select></label>
      <span class="muted" style="align-self:center">${esc(epT)}${d.to > d.from ? ' and following' : ''}</span></div>`;
  }
  return `<div class="idform">
    <div class="seg" role="radiogroup" aria-label="What the file contains">${[['movie', T('kindMovie')], ['series', T('kindSeries')]].map(([k, l]) => `<button role="radio" aria-checked="${d.kind === k}" data-act="id-kind" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="fields"><label class="f" style="flex:1 1 200px">${T('titleF')}<input class="tx" data-in="title" data-fid="id-title" value="${esc(d.title)}" placeholder="Title as TMDB lists it"></label>
      <label class="f" style="width:88px">${T('yearF')}<input class="tx" data-in="year" data-fid="id-year" value="${esc(d.year)}" inputmode="numeric"></label>
      <button class="btn" data-act="id-search">${ic('search')}${T('searchBtn')}</button></div>
    ${list}${eps}</div>`;
}
const idButtons = () => `<button class="btn accent" data-act="id-confirm" ${S.idf?.pick && canWrite() ? '' : 'disabled'}>${ic('check')}${S.idf?.mode === 'correct' ? T('save') : T('identifyBtn')}</button><button class="btn" data-act="id-cancel">${T('cancel')}</button>`;

/* the table: one TableView; each configuration declares its columns */
const COLS = {file:[T => T('cName'), 320], title:[T => T('cTitle'), 340], type:[T => T(S.cfg === 'files' ? 'kind' : 'cType'), 150], year:[T => T(S.cfg === 'music' ? 'year' : 'cYear'), 84, 'r'],
  genres:[T => T(S.cfg === 'music' ? 'genre' : 'genres'), 200], cast:[T => T('cast'), 240], size:[T => T('cSize'), 92, 'r'], loc:[T => T('cLoc'), 320], modified:[T => T('date'), 170],
  artist:[T => T('cArtist'), 240], album:[T => T('cAlbum'), 240], track:[T => T('cTrack'), 64, 'r'], duration:[T => T('cDuration'), 84, 'r']};
function cell(e, k) {
  if (k === 'file') return `<div class="fn">${ic(typeIcon(e))}<span>${esc(e.file)}</span></div>`;
  if (k === 'title') return `<div class="fn" ${e.fail ? `title="${esc(FAIL[e.fail.kind][0])}"` : ''}>${entryIcon(e)}<span>${esc(shownTitle(e))}</span></div>`;
  if (k === 'type') return typeLabel(e);
  if (k === 'genres') return esc(genresOf(e).join(', '));
  if (k === 'artist' || k === 'album') return esc(tags(e)?.[k] || '');
  if (k === 'track') return tags(e)?.track ?? '';
  if (k === 'duration') return tags(e) ? fmtDur(tags(e).secs) : '';
  if (k === 'cast') return esc(info(e)?.v.cast.slice(0, 3).join(', ') || '');
  if (k === 'year') return yearOf(e) ?? '';
  if (k === 'size') return fmtSize(e.size);
  if (k === 'modified') return fmtStamp(e.mod);
  return esc(e.dir);
}
/* Empty and no-match states name the current configuration, and offer the others that hold matches, with their counts. */
function placeholder(list) {
  if (!entries.length) return `<div class="ph"><h3>No files yet</h3>
    <button class="btn" data-act="page" data-k="torrents">${ic('torrents')}${T('torrents')}</button></div>`;
  if (list.length) return '';
  const noun = T(cfg().noun), others = Object.keys(CONFIGS).filter(k => k !== S.cfg).map(k => [k, entries.filter(e => CONFIGS[k].has(e) && matches(e, S.layout[k].f)).length]).filter(([, n]) => n);
  const go = others.map(([k, n]) => `<button class="btn" data-act="cfg" data-k="${k}">${T(CONFIGS[k].label)} · ${n}</button>`).join('');
  if (!entries.some(e => cfg().has(e))) return `<div class="ph"><h3>No ${noun} yet</h3><span class="row-h">${go}</span></div>`;
  return `<div class="ph"><h3>No ${noun} match${S.q ? ` “${esc(S.q)}”` : ''}</h3>
    <span class="row-h">${go}${S.q ? `<button class="btn" data-act="clear-q">${ic('x')}${T('clearSearch')}</button>` : ''}${anyFilter() ? `<button class="btn" data-act="clear-filters" title="${T('clearFiltersTip')}">${ic('funnelX')}${T('clearFilters')}</button>` : ''}</span></div>`;
}
function table() {
  const keys = cfg().cols.filter(k => lay().shown.includes(k)), list = rows(), width = keys.reduce((w, k) => w + COLS[k][1], 0), sort = lay().sort;
  const head = keys.map(k => { const [label, w, al] = COLS[k], on = sort.key === k;
    return `<th class="${al || ''}" data-col="${k}" style="width:${w}px" aria-sort="${on ? (sort.desc ? 'descending' : 'ascending') : 'none'}"${k === 'year' && S.cfg !== 'music' ? ' title="Release year for a movie, air year for an episode. A series premiere year is in the details."' : ''}><button data-act="sort" data-k="${k}" tabindex="-1">${label(T)}${on ? ic(sort.desc ? 'down' : 'up') : ''}</button></th>`; }).join('');
  const focusId = list.some(e => e.id === S.sel) ? S.sel : list[0]?.id;
  const body = list.map(e => `<tr class="row ${e.id === S.sel ? 'sel' : ''}" data-row="${e.id}" data-fid="row-${e.id}" tabindex="${e.id === focusId ? 0 : -1}" aria-selected="${e.id === S.sel}" aria-label="${esc(e.file)}">
    ${keys.map(k => `<td class="${COLS[k][2] || ''}" ${['file', 'loc', 'title', 'genres', 'cast', 'type'].includes(k) ? `title="${esc(k === 'loc' ? e.dir : k === 'file' || k === 'title' ? e.file : k === 'type' ? typeLabel(e) : cell(e, k))}"` : ''}>${cell(e, k)}</td>`).join('')}</tr>`).join('');
  return `<div class="tv ${S.disconnected ? 'stale' : ''}" id="tv" data-region="table"><table role="grid" aria-label="${T('library')}" aria-rowcount="${list.length}" style="width:max(100%, ${width}px)"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>${placeholder(list)}</div>`;
}

/* status bar: rates at the left; the list, Library's movie-information state and the connection at the right */
function statusBar() {
  const item = (icon, text, tip, extra = '', pri = 5) => `<span class="si ${extra}" data-pri="${pri}" data-tip="${esc(tip)}">${icon === 'ring' ? '<span class="ring" style="width:12px;height:12px"></span>' : ic(icon)}<span class="t">${esc(text)}</span></span>`;
  const rates = S.disconnected ? ['—', '—'] : ['8.4 MB/s', '312 KB/s'];
  const left = item('down', rates[0], 'Download speed, no limit applies', '', 9) + item('up', rates[1], 'Upload speed, no limit applies', '', 9);
  const right = [];
  if (S.page === 'library') {
    const pending = entries.filter(e => e.ident.s === 'pending').length;
    if (!S.enrichment) right.push(item('info', 'Movie information off', 'Movie and TV information is off. Titles, genres and cast are not looked up. Double-click to open Settings > Library.', '', 2));

}
function confirmIdentify() {
  const d = S.idf, e = entries.find(x => x.id === d.id);
  if (!d.pick || !e) return;
  const c = CATALOG[d.pick];
  e.ident = c.kind === 'movie' ? {s:'manual', v:d.pick} : {s:'manual', v:d.pick, season:d.season, eps:[...Array(Math.max(1, d.to - d.from + 1))].map((_, i) => d.from + i)};
  S.idf = null; S.dialog = null;
  S.focus = '[data-fid=open]';
  say(`Identified ${e.file} as ${titleOf(e)}. Your choice is kept over automatic identification.`);
}
function setCfg(k) {
  if (S.cfg === k) return;
  S.cfg = k;
  S.f = lay().f;
  const list = rows();
  if (!list.some(e => e.id === S.sel)) S.sel = list[0]?.id ?? null;
  S.focus = S.sel ? `[data-fid="row-${S.sel}"]` : '#gq';
  say(`Showing ${T(CONFIGS[k].label)}: the same search, its own columns, sort and filters`);
}
function setSel(id, focus = true) {
  if (S.idf && S.idf.id !== id) S.idf = null;
  S.sel = id;
  if (focus) S.focus = `[data-fid="row-${id}"]`;
  S.reveal = true;
}
function withdraw() {
  const e = sel();
  if (!e) return;
  const list = rows(), at = list.findIndex(x => x.id === e.id), gone = entries.filter(x => x.torrent === e.torrent).map(x => x.id);
  entries = entries.filter(x => !gone.includes(x.id));
  unfinished = unfinished.filter(x => x.torrent !== e.torrent);
  const left = list.filter(x => !gone.includes(x.id));
  const next = left.find((x, n) => list.indexOf(x) > at) || left.at(-1);
  if (S.idf && gone.includes(S.idf.id)) { S.idf = null; S.dialog = null; }
  S.sel = next?.id ?? null;
  if (win.contains(document.activeElement) && next) S.focus = `[data-fid="row-${next.id}"]`;
  say(`Removed torrent “${e.torrent}”: ${gone.length} file${gone.length > 1 ? 's' : ''} left the Library; selection moved to the next file`);
}

win.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  const inFly = ev.target.closest('#fly');
  if (S.fly && !inFly && !(t && t.dataset.act === 'fly' && t.dataset.fly === S.fly.kind) && !ev.target.closest('.gbox')) { S.fly = null; if (!t) return render(); }
  const row = ev.target.closest('[data-row]');
  if (row && !t) { setSel(+row.dataset.row); return render(); }
  const trow = ev.target.closest('[data-trow]');
  if (trow) { S.tsel = trow.dataset.trow; S.focus = `[data-fid="${trow.dataset.fid}"]`; return render(); }
  if (!t || t.disabled) return;
  const a = t.dataset.act, k = t.dataset.k, e = sel();
  if (inFly && !['filter', 'col-toggle'].includes(a)) S.fly = null;
  switch (a) {
    case 'fly': S.fly = S.fly?.kind === t.dataset.fly ? null : {kind:t.dataset.fly, anchor:t.id}; if (S.fly) S.focus = '#fly button:not(:disabled)'; break;
    case 'back': go(S.backTo || S.prev); break;
    case 'page': S.fly = null; go(k); if (t.closest('.pages')) S.focus = `[data-fid=tab-${k}]`; break;
    case 'theme': S.dark = !S.dark; break;
    case 'cmd': S.fly = null; say(`Ran “${k}” (sample, nothing happens)`); break;
    case 'sort': lay().sort = lay().sort.key === k ? {key:k, desc:!lay().sort.desc} : {key:k, desc:false}; say(`Sorted ${S.cfg} by ${k}`); break;
    case 'cfg': setCfg(k); break;
    case 'col-toggle': { const sh = lay().shown; lay().shown = sh.includes(k) ? sh.filter(x => x !== k) : [...sh, k]; say(`${sh.includes(k) ? 'Hid' : 'Showed'} column ${k} in ${S.cfg}`); break; }
    case 'toggle-filters': S.fly = null; S.filtersOpen = !S.filtersOpen; S.focus = S.filtersOpen ? '#a-filters .opt[aria-checked=true]' : '#gq'; say(`View > Filters ${S.filtersOpen ? 'on' : 'off'}`); break;
    case 'filter': S.f[t.dataset.g] = t.dataset.v; S.focus = `[data-act=filter][data-g="${t.dataset.g}"][data-v="${CSS.escape(t.dataset.v)}"]`;
      say(`Filter ${t.dataset.g}: ${t.dataset.v}`); break;
    case 'clear-filters': Object.assign(S.f, FILTERS0); say('Cleared filters'); break;
    case 'clear-q': S.q = ''; S.focus = '#gq'; say('Cleared search'); break;
    case 'open': openEntry(e); break;
    case 'identify': startIdentify(e, 'identify'); break;
    case 'correct': startIdentify(e, 'correct'); break;
    case 'g-torrent': S.fly = null; go('torrents'); S.g = ''; S.tsel = k; S.focus = '[data-trow].sel'; say(`Selected torrent “${k}”`); break;
    case 'clear-id': S.fly = null; if (e && info(e)) { e.ident = {s:'cleared'}; S.idf = null; say(`Cleared the identification of ${e.file}. It will not be identified automatically again.`); } break;
    case 'show-torrent': S.fly = null; if (e) { S.tsel = e.torrent; go('torrents'); S.backTo = 'library'; S.tinsp = true; S.focus = `[data-fid=tsec-${S.tsection}]`;
      say(`Showed torrent “${e.torrent}” with its properties; Back returns to Library`); } break;
    case 'tsec': S.tsection = k; S.focus = `[data-fid=tsec-${k}]`; break;
    case 'close-tinsp': S.tinsp = false; S.focus = '[data-trow].sel'; break;
    case 'enable': S.dialog = {kind:'consent', then:e && e.ident.s !== 'other' ? {id:e.id, mode:'identify', only:true} : null}; break;
    case 'consent-yes': enable(); break;
    case 'dlg-close': S.dialog = null; S.focus = '[data-act=enable]'; say('Movie information stays off'); break;
    case 'reconnect': S.disconnected = false; say('Reconnected; showing the confirmed file list'); break;
    case 'id-kind': S.idf.kind = k; S.idf.pick = null; search(); break;
    case 'id-search': search(); break;
    case 'id-pick': S.idf.pick = k; S.focus = `[data-fid="cand-${k}"]`; if (CATALOG[k].kind === 'series' && !(EPISODES[k] || {})[S.idf.season]) S.idf.season = +Object.keys(EPISODES[k] || {1:0})[0]; break;
    case 'close-details': S.detailsOpen = false; S.focus = `[data-fid="row-${S.sel}"]`; say('Closed the details; Properties (Alt+Enter or the row menu) shows them again'); break;
    case 'properties': S.detailsOpen = true; S.focus = '[data-fid=dtab-video]:not(:disabled), [data-fid=dtab-file]'; say('Showed properties'); break;
    case 'open-folder': say(`Opened the folder of ${e ? e.file : ''} in File Explorer (sample)`); break;
    case 'dtab': S.dtab = k; S.focus = `[data-fid=dtab-${k}]`; break;
    case 'id-confirm': confirmIdentify(); break;
    case 'id-cancel': S.idf = null; S.dialog = null; S.focus = '[data-fid=open]'; say('Identification unchanged'); break;
  }
  render();
});
function enable() {
  const then = S.dialog?.then;
  S.dialog = null; S.enrichment = true;
  const restore = entries.filter(e => e.ident.s === 'none' && ENTRIES.find(o => o.id === e.id)?.ident.s !== 'none');
  for (const e of restore) e.ident = {s:'pending'};
  say(`Turned on movie information; identifying ${restore.length} files`);
  setTimeout(() => { for (const e of restore) { const o = ENTRIES.find(x => x.id === e.id).ident; if (e.ident.s === 'pending') e.ident = structuredClone(o.s === 'manual' || o.s === 'cleared' ? (o.s === 'manual' ? {...o, s:'auto'} : {s:'none'}) : o); } say('Identified the files that matched'); render(); }, 1800);
  if (then && !then.only) startIdentify(entries.find(x => x.id === then.id), then.mode);
}
win.addEventListener('contextmenu', ev => {
  const th = ev.target.closest('th[data-col]');
  if (th) { ev.preventDefault(); const w = win.getBoundingClientRect(); S.fly = {kind:'headmenu', col:th.dataset.col, x:ev.clientX - w.left, y:ev.clientY - w.top}; return render(); }
  const row = ev.target.closest('[data-row]');
  if (!row) return;
  ev.preventDefault();
  setSel(+row.dataset.row);
  const w = win.getBoundingClientRect();
  S.fly = {kind:'rowmenu', x:ev.clientX - w.left, y:ev.clientY - w.top};
  S.focus = '#fly button:not(:disabled)';
  render();
});
win.addEventListener('dblclick', ev => { if (ev.target.closest('.filter-status')) { S.filtersOpen = true; say('Showed the filters'); return render(); } const row = ev.target.closest('[data-row]'); if (row) { setSel(+row.dataset.row); openEntry(sel()); render(); } });
win.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'gq' && libPage()) { S.q = t.value; S.last = `Searching Library for “${S.q}”`; return render(); }
  if (t.id === 'gq') { S.g = t.value; S.fly = t.value ? {kind:'gsearch'} : null; return render(); }
  if (t.dataset.in && S.idf && ['title', 'year'].includes(t.dataset.in)) { S.idf[t.dataset.in] = t.value; return; }
});
win.addEventListener('change', ev => {
  const t = ev.target, k = t.dataset.in;
  if (!k) return;
  if (['season', 'from', 'to'].includes(k)) { S.idf[k] = +t.value; if (k === 'from' && S.idf.to < S.idf.from) S.idf.to = S.idf.from; if (k === 'to' && S.idf.to < S.idf.from) S.idf.from = S.idf.to; }
  render();
});
win.addEventListener('focusin', ev => {
  if (ev.target.id === 'gq' && !libPage() && S.g) { S.fly = {kind:'gsearch'}; render(); }
});

/* keyboard */
const regions = () => S.page === 'torrents' ? ['#gq', '#tv [tabindex="0"]'] : ['#gq', '#tv [tabindex="0"]', '[data-fid=open]'];
document.addEventListener('keydown', ev => {
  const t = ev.target, inField = t.closest?.('input, textarea, select, [contenteditable]');
  const ctrl = ev.ctrlKey && !ev.altKey && !ev.shiftKey;
  if (S.dialog) {
    if (ev.key === 'Escape') { ev.preventDefault(); S.idf = S.dialog.kind === 'identify' ? null : S.idf; S.dialog = null; S.focus = '[data-fid=open], [data-act=enable]'; return render(); }
    if (ev.key === 'Tab') { const f = [...win.querySelectorAll('.dlg button:not(:disabled), .dlg input, .dlg select, .dlg [tabindex="0"]')]; const i = f.indexOf(document.activeElement);
      if (ev.shiftKey && i <= 0) { ev.preventDefault(); f.at(-1).focus(); } else if (!ev.shiftKey && i === f.length - 1) { ev.preventDefault(); f[0].focus(); } }
  }
  if (ev.key === 'Enter' && ['title', 'year'].includes(t.dataset?.in) && S.idf) { ev.preventDefault(); search(); return render(); }
  if (S.dialog) return;
  if (ev.key === 'Escape' && t.closest?.('#a-filters')) { S.filtersOpen = false; S.focus = '#gq'; ev.preventDefault(); say('Closed filters'); return render(); }
  if (S.fly && ev.key === 'Escape') { const {kind, anchor} = S.fly; S.fly = null; S.focus = kind === 'gsearch' ? '#gq' : kind === 'rowmenu' ? `[data-fid="row-${S.sel}"]` : '#' + anchor; ev.preventDefault(); return render(); }
  if (S.fly && ['ArrowDown', 'ArrowUp'].includes(ev.key) && (t.closest('#fly') || (t.id === 'gq' && S.fly.kind === 'gsearch'))) {
    const items = [...document.querySelectorAll('#fly .mi:not(:disabled)')], i = items.indexOf(t);
    items[(i + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus(); ev.preventDefault(); return;
  }
  if (t.id === 'gq' && S.fly?.kind === 'gsearch' && ev.key === 'Enter') { document.querySelector('#fly .mi:not(:disabled)')?.click(); ev.preventDefault(); return; }
  if (['k', 'e', 'f'].includes(ev.key.toLowerCase()) && ctrl) {
    ev.preventDefault();
    S.focus = '#gq';
    return render();
  }
  if (ctrl && ['1', '2'].includes(ev.key)) { ev.preventDefault(); go(ev.key === '1' ? 'torrents' : 'library'); return render(); }
  if (ctrl && ev.key === ',') { ev.preventDefault(); go('settings'); return render(); }
  if (ev.altKey && ev.key === 'Enter' && libPage()) { ev.preventDefault(); S.detailsOpen = true; S.focus = '[data-fid=dtab-video]:not(:disabled), [data-fid=dtab-file]'; say('Showed properties'); return render(); }
  if (ev.altKey && ev.key === 'ArrowLeft' && (S.backTo || !['torrents', 'library'].includes(S.page))) { ev.preventDefault(); go(S.backTo || S.prev); return render(); }
  if (ev.key === 'F6') { ev.preventDefault(); const r = regions(), cur = r.findIndex(s => document.activeElement?.matches(s) || document.activeElement?.closest(s.split(' ')[0]));
    const nx = r[(cur + (ev.shiftKey ? -1 : 1) + r.length) % r.length]; (win.querySelector(nx))?.focus(); return; }
  if (t.id === 'gq' && libPage()) {
    if (ev.key === 'Escape' && S.q) { S.q = ''; ev.preventDefault(); say('Cleared search'); return render(); }
    if (ev.key === 'ArrowDown' || ev.key === 'Enter') { const first = rows()[0]; if (first) { ev.preventDefault(); if (!rows().some(x => x.id === S.sel)) S.sel = first.id; win.querySelector(`#tv tr[data-row="${S.sel}"]`)?.focus(); } return; }
  }
  if (t.id === 'gq' && ev.key === 'Escape') { S.g = ''; S.fly = null; ev.preventDefault(); return render(); }
  const row = t.closest?.('[data-row]');
  if (row) {
    const list = rows(), i = list.findIndex(x => x.id === +row.dataset.row);
    const step = {ArrowDown:1, ArrowUp:-1, PageDown:10, PageUp:-10}[ev.key];
    if (step || ev.key === 'Home' || ev.key === 'End') { ev.preventDefault(); const n = ev.key === 'Home' ? 0 : ev.key === 'End' ? list.length - 1 : Math.max(0, Math.min(list.length - 1, i + step)); setSel(list[n].id); return render(); }
    if (ev.key === 'Enter' && !ev.altKey) { ev.preventDefault(); setSel(+row.dataset.row); openEntry(sel()); return render(); }
    if (ev.key === 'ContextMenu' || (ev.shiftKey && ev.key === 'F10')) { ev.preventDefault(); setSel(+row.dataset.row); const w = win.getBoundingClientRect(), r = row.getBoundingClientRect();
      S.fly = {kind:'rowmenu', x:r.left - w.left + 48, y:r.bottom - w.top}; S.focus = '#fly button:not(:disabled)'; return render(); }
  }
  const tr = t.closest?.('[data-trow]');
  if (tr && ['ArrowDown', 'ArrowUp'].includes(ev.key)) { ev.preventDefault(); const all = [...win.querySelectorAll('[data-trow]')], i = all.indexOf(tr), n = all[Math.max(0, Math.min(all.length - 1, i + (ev.key === 'ArrowDown' ? 1 : -1)))];
    S.tsel = n.dataset.trow; S.focus = `[data-fid="${n.dataset.fid}"]`; return render(); }
  const tab = t.closest?.('[role=tab], [role=radio]');
  if (tab && ['ArrowLeft', 'ArrowRight'].includes(ev.key)) { ev.preventDefault(); const sib = [...tab.parentElement.children].filter(x => x.matches('[role=tab], [role=radio]') && !x.disabled), i = sib.indexOf(tab);
    const n = sib[(i + (ev.key === 'ArrowRight' ? 1 : -1) + sib.length) % sib.length]; n.focus(); if (n.getAttribute('role') === 'tab') n.click(); return; }
  if (t.matches?.('.cand') && (ev.key === ' ' || ev.key === 'Enter')) { ev.preventDefault(); t.click(); return; }
  if (t.matches?.('.cand') && ['ArrowDown', 'ArrowUp'].includes(ev.key)) { ev.preventDefault(); const c = [...win.querySelectorAll('.cand')], i = c.indexOf(t); c[(i + (ev.key === 'ArrowDown' ? 1 : -1) + c.length) % c.length].click(); return; }
  const split = t.closest?.('.split');
  if (split && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(ev.key)) { ev.preventDefault(); const d = ['ArrowUp', 'ArrowLeft'].includes(ev.key) ? 16 : -16;
    S.split = Math.max(155, Math.min(520, S.split + d));
    S.focus = `[data-split=${split.dataset.split}]`; return render(); }
});

/* splitters: drag to resize */
win.addEventListener('pointerdown', ev => {
  const sp = ev.target.closest('.split');
  if (!sp) return;
  ev.preventDefault();
  const start = {y:ev.clientY, h:S.split};
  const move = m => { S.split = Math.max(155, Math.min(win.clientHeight - 260, start.h - (m.clientY - start.y))); render(); };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});

/* tooltips for status items */
const tipEl = document.getElementById('tip');
let tipFor = null, tipTimer;
function hideTip() { clearTimeout(tipTimer); tipEl.hidden = true; tipFor = null; }
document.addEventListener('mouseover', ev => {
  const t = ev.target.closest('[data-tip]');
  if (t === tipFor) return;
  hideTip();
  if (!t) return;
  tipFor = t;
  tipTimer = setTimeout(() => { tipEl.textContent = t.dataset.tip; tipEl.hidden = false; const r = t.getBoundingClientRect();
    tipEl.style.left = Math.max(8, Math.min(r.left, innerWidth - tipEl.offsetWidth - 8)) + 'px'; tipEl.style.top = (r.top - tipEl.offsetHeight - 8) + 'px'; }, 400);
});

/* prototype bar */
const $ = id => document.getElementById(id);
$('scenario').innerHTML = Object.entries(SCENARIOS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
$('outcome').innerHTML = Object.entries(OUTCOMES).map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
$('scenario').onchange = ev => { const keep = {page:S.page}; reset(ev.target.value); render(); };
$('outcome').onchange = ev => { S.outcome = ev.target.value; S.last = OUTCOMES[S.outcome]; render(); };
$('lang').onchange = ev => { S.lang = ev.target.value; document.documentElement.lang = S.lang; render(); };
$('width').oninput = ev => { S.width = +ev.target.value; render(); };
$('theme').onclick = () => { S.dark = !S.dark; render(); };
$('menusBtn').onclick = ev => { S.showMenus = !S.showMenus; ev.target.setAttribute('aria-pressed', S.showMenus); render(); };
$('state').onclick = ev => { S.showState = !S.showState; ev.target.setAttribute('aria-pressed', S.showState); render(); };
$('reset').onclick = () => { reset(S.scenario); render(); };
$('withdraw').onclick = () => { withdraw(); render(); };
addEventListener('resize', render);
reset();
$('width').value = Math.min(1280, innerWidth - 24);
render();
</script>
</body>
