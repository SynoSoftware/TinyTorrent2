function hideTooltip(){clearTimeout(tooltipTimer);if(tooltip.matches(':popover-open'))tooltip.hidePopover();if(tooltip.parentElement!==document.body)document.body.append(tooltip);tooltipTarget=null}
function showTooltip(target){
  if(!target.isConnected)return;
  if(target.classList.contains('result')&&[...target.querySelectorAll('span,small')].every(text=>text.scrollWidth<=text.clientWidth))return hideTooltip();
  let text=target.dataset.tip||target.textContent.trim();
  if(target.classList.contains('row')){const label=target.querySelector('.row-title'),help=target.querySelector('.description')?.textContent||'';text=label.scrollWidth>label.clientWidth?`${label.textContent}${help?'. '+help:''}`:help}
  if(!text||text===target.textContent.trim()&&target.scrollWidth<=target.clientWidth)return hideTooltip();
  clearTimeout(tooltipTimer);tooltipTarget=target;tooltip.textContent=text;
  const host=dialog.open?dialog:document.body;
  if(tooltip.parentElement!==host)host.append(tooltip);
  if(!tooltip.matches(':popover-open'))tooltip.showPopover();
  const bounds=target.getBoundingClientRect(),size=tooltip.getBoundingClientRect();
  tooltip.style.left=`${Math.max(12,Math.min(bounds.left,innerWidth-size.width-12))}px`;
  tooltip.style.top=`${Math.max(12,bounds.bottom+size.height+18<innerHeight?bounds.bottom+6:bounds.top-size.height-6)}px`;
}

function supplierDisclosure(name){

  return `<p>${escape(disclosure)}</p><div class="subtitle-links"><a href="../docs/subtitle-privacy.md" target="_blank" rel="noopener noreferrer" data-tip="TinyTorrent privacy policy draft">Privacy policy draft</a>${subtitleAccount(name)?'':`<a href="https://opensubtitles.tawk.help/article/privacy-policy" target="_blank" rel="noopener noreferrer" data-tip="OpenSubtitles privacy policy">Supplier privacy</a><a href="https://opensubtitles.tawk.help/article/terms-of-service" target="_blank" rel="noopener noreferrer" data-tip="OpenSubtitles terms of service">Supplier terms</a>`}</div>`;
}
function showSupplierInfo(button){
  hideTooltip();
  const flyout=document.getElementById('supplier-info'),name=button.dataset.supplierInfo;
  if(flyout.matches(':popover-open')){flyout.hidePopover();return}
  (dialog.open?dialog:document.body).append(flyout);
  flyout.innerHTML=`<h2 id="supplier-info-title" tabindex="-1">${escape(name)}</h2>${supplierDisclosure(name)}`;
  flyout.showPopover();
  const bounds=button.getBoundingClientRect(),size=flyout.getBoundingClientRect();
  flyout.style.left=`${Math.max(12,Math.min(bounds.left,innerWidth-size.width-12))}px`;
  flyout.style.top=`${Math.max(12,bounds.bottom+size.height+18<innerHeight?bounds.bottom+6:bounds.top-size.height-6)}px`;
  flyout.querySelector('h2').focus({preventScroll:true});
  flyout.ontoggle=()=>{if(!flyout.matches(':popover-open')){if(button.isConnected)button.focus({preventScroll:true});document.body.append(flyout)}};

function subtitleStatus(outcome=document.querySelector('#subtitle-outcome').value,supplier=state.supplier){

function checkSupplier(supplier){
  if((subtitleAccount(supplier.name)||supplier.username||supplier.password)&&(!supplier.username.trim()||!supplier.password))return 'account';

function numberValue(field,text){
  const value=text.trim();
  if(field.unlimited&&(!value||value.toLowerCase()==='unlimited'))return 0;
  return Number(value)*(state.units[field.id]==='hours'?60:1);
}
function validateInput(input){
  const field=fields.find(field=>field.id===input.dataset.field);
  let error='';
  if(field.type==='number'){
    const value=numberValue(field,input.value),step=field.step||1,factor=state.units[field.id]==='hours'?60:1;
    if(!Number.isFinite(value)||value<field.min||value>field.max||!input.value.trim()&&!field.unlimited)error=`Enter a number from ${field.min/factor} to ${field.max/factor}${field.unlimited?', or Unlimited':''}.`;
    else if(Math.abs(value/step-Math.round(value/step))>0.000001)error=field.duration?'Use a duration in whole minutes.':`Use increments of ${step}.`;
  }else if(!input.checkValidity())error=field.type==='path'?'Enter a folder path.':'Choose a value.';
  if(field.type==='path'&&!input.value.trim())error='Enter a folder path.';
  input.setAttribute('aria-invalid',!!error);
  document.getElementById(`error-${field.id}`).textContent=error;
  drafts[field.id]={value:input.value,error};
  return !error;
}
