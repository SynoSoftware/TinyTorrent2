function showDialog(title,body,footer){$('dialog').classList.remove('rule-editor');$('dialog').innerHTML=`<div class="dialog-body"><h1 id="dialog-title">${title}</h1>${body}</div><div class="dialog-footer">${footer}${action('Cancel','Cancel without applying changes','id="cancel-dialog"')}</div>`;$('cancel-dialog').onclick=()=>$('dialog').close();if(!$('dialog').open)$('dialog').showModal();const focus=$('dialog').querySelector('input:not([type=checkbox]):not([disabled]),textarea,[data-primary]');focus?.focus();$('dialog').onkeydown=e=>{if(e.key==='Enter'&&!e.target.closest('textarea,select,button')){const primary=$('dialog').querySelector('[data-primary]:not(:disabled)');if(primary){e.preventDefault();primary.click();}}};}
function openAdd(){
 const torrent=state.target,t=torrents[torrent],files=t.files.map(([path,size],index)=>({torrent,path,size,index}));
 showDialog('Add torrent',`<div class="stack"><div><h2>${escape(t.title)}</h2><small>Source: saved torrent catalogue</small></div><label class="field">Save to<input id="destination" value="${escape(downloadFolder)}"></label><small>126 GiB free</small><div><strong>${files.length} of ${t.files.length} files wanted · ${bytes(files.reduce((n,f)=>n+f.size,0))}</strong><div style="max-height:150px;overflow:auto;margin-top:8px">${files.map(f=>`<div class="row spread"><span class="truncate">${escape(f.path)}</span><small>${bytes(f.size)}</small></div>`).join('')}</div></div><label><input type="checkbox" id="dont-start">Don't start</label><label><input type="checkbox">Add to top of queue</label></div>`,action('Add','Add this torrent with the wanted files',`id="confirm-add" data-primary ${files.length?'':'disabled'}`));
 $('confirm-add').onclick=()=>{const destination=$('destination').value;$('dialog').close();downloadFiles(files,destination);};
}
function openSettings(){
 const budgetUnit=state.budget>=1073741824?'GiB':'MiB',budgetFactor=budgetUnit==='GiB'?1073741824:1048576;
 const ageUnit=state.staleHours%168===0?'Weeks':state.staleHours%24===0?'Days':'Hours',ageFactor={Hours:1,Days:24,Weeks:168}[ageUnit];
 showDialog('Torrent indexing',`<div class="setting-row"><div><strong>Indexing</strong><div class="muted">${indexingDescription}</div></div>${indexingSwitch('setting-indexing')}</div><div class="setting-row"><div><strong>Storage budget</strong><div class="muted">${bytes(state.storageUsed/1048576)} used</div></div><div class="row"><input id="storage-budget" type="number" value="${state.budget/budgetFactor}" min="0.000001" step="any" required aria-label="Storage budget"><select id="storage-unit" aria-label="Storage budget unit"><option ${budgetUnit==='MiB'?'selected':''}>MiB</option><option ${budgetUnit==='GiB'?'selected':''}>GiB</option></select></div></div><div class="setting-row"><strong>Remove torrents not seen for</strong><div class="row"><input id="stale-age" type="number" min="1" step="1" required value="${state.staleHours/ageFactor}" aria-label="Not seen for"><select id="stale-unit" aria-label="Not seen unit">${['Hours','Days','Weeks'].map(unit=>`<option ${unit===ageUnit?'selected':''}>${unit}</option>`).join('')}</select></div></div><div class="row spread" style="margin-top:20px"><h2>Exclusion rules</h2>${action('Add','Add an exclusion rule','id="add-rule"')}</div><p><strong>${excludedCount(state.rules).toLocaleString()} torrents excluded</strong></p>${state.rules.length?state.rules.map(rule=>`<div class="setting-row"><span>${escape(ruleText(rule))}</span><div class="row">${action('Edit','Edit this exclusion rule',`data-edit-rule="${rule.key}"`)}${action('Remove','Preview removing this exclusion rule',`data-remove-rule="${rule.key}"`)}</div></div>`).join(''):'<p class="muted">No exclusion rules</p>'}<div class="settings-actions">${action('Review','Review retained torrents under the saved rules','id="review-removal"')}${action('Rebuild','Rebuild search from retained metadata','id="rebuild"')}${action('Clear','Review clearing the torrent catalogue','id="clear-catalogue"')}</div>`, action('Done','Close indexing settings','id="close-settings"'));
 $('close-settings').onclick=()=>$('dialog').close();$('setting-indexing').onchange=e=>setIndexing(e.target.checked);$('add-rule').onclick=()=>editRule(null);
 const saveBudget=()=>{if(!$('storage-budget').checkValidity())return;state.budget=Math.round(Number($('storage-budget').value)*($('storage-unit').value==='GiB'?1073741824:1048576));render();};$('storage-budget').onchange=saveBudget;$('storage-unit').onchange=saveBudget;
 const saveAge=()=>{if(!$('stale-age').checkValidity())return;state.staleHours=Number($('stale-age').value)*({Hours:1,Days:24,Weeks:168}[$('stale-unit').value]);readout();};$('stale-age').onchange=saveAge;$('stale-unit').onchange=saveAge;
 document.querySelectorAll('[data-edit-rule]').forEach(button=>button.onclick=()=>editRule(state.rules.find(rule=>rule.key===Number(button.dataset.editRule))));
 document.querySelectorAll('[data-remove-rule]').forEach(button=>button.onclick=()=>{const rule=state.rules.find(rule=>rule.key===Number(button.dataset.removeRule));previewRules(state.rules.filter(r=>r.key!==rule.key),'Remove: '+ruleText(rule));});
 $('review-removal').onclick=()=>reviewRemoval(false);$('clear-catalogue').onclick=()=>reviewRemoval(true);$('rebuild').onclick=()=>{$('dialog').close();state.scenario='rebuild';render();};
}
function textEditor(id,label,condition){return `<div class="rule-row"><label for="${id}-text">${label}</label><div class="rule-controls"><select id="${id}-op" aria-label="${label} condition"><option value="matches" ${condition?.negate?'':'selected'}>Matches</option><option value="not" ${condition?.negate?'selected':''}>Does not match</option></select><input id="${id}-text" value="${escape(condition?.pattern||'')}" placeholder="Any ${label.toLowerCase()}" title="Text or wildcard pattern (* and ?)"></div></div>`;}
function rangeEditor(id,label,condition,size){
 const value=Math.max(condition?.a||0,condition?.b||0),[unit,factor]=size?([...sizeUnits].reverse().find(([,factor])=>value>=factor)||sizeUnits[2]):['files',1];
 return `<div class="rule-row" data-range="${id}"><label for="${id}-op">${label}</label><div class="rule-controls"><select id="${id}-op" aria-label="${label} condition">${operators.map(([op,title])=>`<option value="${op}" ${(condition?.op||'any')===op?'selected':''}>${title}</option>`).join('')}</select><input class="rule-number" id="${id}-a" type="number" min="0" step="${size?'any':'1'}" aria-label="${label} value" value="${condition?condition.a/factor:''}"><span class="rule-between" id="${id}-between"><span>to</span><input class="rule-number" id="${id}-b" type="number" min="0" step="${size?'any':'1'}" aria-label="${label} upper value" value="${condition?.b==null?'':condition.b/factor}"></span>${size?`<select class="rule-unit" id="${id}-unit" aria-label="${label} unit">${sizeUnits.map(([name])=>`<option ${name===unit?'selected':''}>${name}</option>`).join('')}</select>`:`<span class="muted" id="${id}-unit">files</span>`}</div></div>`;
}
function readText(id){const pattern=$(id+'-text').value.trim();return pattern?{pattern,negate:$(id+'-op').value==='not'}:null;}
function readRange(id,size){const op=$(id+'-op').value;if(op==='any')return null;const factor=size?sizeUnits.find(([unit])=>unit===$(id+'-unit').value)[1]:1;return {op,a:Math.round(Number($(id+'-a').value)*factor),b:op==='between'?Math.round(Number($(id+'-b').value)*factor):null};}
function editRule(rule){
 const f=rule?.files;
 showDialog(rule?'Edit exclusion rule':'Add exclusion rule',`<p class="rule-intro">Exclude torrents when all the conditions match.</p><section class="rule-section"><h3>Torrent</h3>${textEditor('rule-title','Title',rule?.title)}${rangeEditor('rule-total','Total size',rule?.size,true)}${rangeEditor('rule-count','File count',rule?.count,false)}</section><section class="rule-section"><div class="row spread"><h3>Files</h3><select id="rule-file-mode" aria-label="File matching"><option value="any">Any file matches</option><option value="all">Every file matches</option><option value="none">No file matches</option></select></div>${textEditor('rule-name','Name',f?.name)}${textEditor('rule-path','Path',f?.path)}<div class="rule-row"><label for="rule-extensions">Extensions</label><div class="rule-controls"><select id="rule-extension-mode" aria-label="Extension condition"><option value="matches">Is one of</option><option value="not">Is not one of</option></select><input id="rule-extensions" placeholder="e.g. mp3, wav" value="${escape(f?.extensions?.values.join(', ')||'')}"></div></div>${rangeEditor('rule-size','File size',f?.size,true)}</section><small id="rule-validation" class="warning" role="status"></small>`,action('Review','Preview this rule change','id="save-rule" data-primary'));
 $('dialog').classList.add('rule-editor');$('rule-file-mode').value=f?.mode||'any';$('rule-extension-mode').value=f?.extensions?.negate?'not':'matches';
 const draft=()=>{
 const values=[...new Set($('rule-extensions').value.split(/[,;\s]+/).filter(Boolean).map(value=>value.replace(/^\./,'').toLowerCase()))].sort();
 const files={mode:$('rule-file-mode').value,name:readText('rule-name'),path:readText('rule-path'),extensions:values.length?{values,negate:$('rule-extension-mode').value==='not'}:null,size:readRange('rule-size',true)};
 const value={key:rule?.key??state.nextRule,version:rule?.version||1,title:readText('rule-title'),size:readRange('rule-total',true),count:readRange('rule-count',false),files:files.name||files.path||files.extensions||files.size?files:null};
 const definition=value=>JSON.stringify([value.title,value.size,value.count,value.files]).toLowerCase();
 if(rule&&definition(rule)!==definition(value))value.version++;
 return value;
 };
 const validate=()=>{
 document.querySelectorAll('[data-range]').forEach(row=>{const id=row.dataset.range,op=$(id+'-op').value,active=op!=='any',between=op==='between';$(id+'-a').disabled=!active;$(id+'-a').required=active;$(id+'-a').hidden=!active;$(id+'-b').disabled=!between;$(id+'-b').required=between;$(id+'-between').hidden=!between;$(id+'-unit').hidden=!active;});
 const controls=[...$('dialog').querySelectorAll('input:not(:disabled)')];let error='';
 for(const row of $('dialog').querySelectorAll('[data-range]')){const id=row.dataset.range;if($(id+'-op').value==='between'&&$(id+'-a').value!==''&&$(id+'-b').value!==''&&Number($(id+'-b').value)<Number($(id+'-a').value))error='The upper value must not be smaller than the lower value.';}
 if($('rule-extensions').value.split(/[,;\s]+/).filter(Boolean).some(value=>!value.replace(/^\./,'')||/[\\/*?]/.test(value)))error='Enter extensions such as mp3, wav or tar.gz.';
 const valid=!error&&controls.every(input=>input.checkValidity()),value=valid?draft():null;
 $('save-rule').disabled=!valid||!(value.title||value.size||value.count||value.files);$('rule-validation').textContent=error;
 };
 $('dialog').querySelectorAll('input,select').forEach(input=>input.oninput=validate);validate();$('rule-title-text').focus();$('cancel-dialog').onclick=openSettings;
 $('save-rule').onclick=()=>{const value=draft();previewRules([...state.rules.filter(r=>r.key!==value.key),value],ruleText(value));};
}
function previewRules(rules,description){
 const before=excludedCount(state.rules),after=excludedCount(rules);
 showDialog('Apply rule changes?',`<p>${escape(description)}</p><div class="setting-row"><span>Excluded now</span><strong>${before.toLocaleString()} torrents</strong></div><div class="setting-row"><span>Excluded after this change</span><strong>${after.toLocaleString()} torrents</strong></div><div class="setting-row"><span>Eligible for indexing again</span><strong>${Math.max(0,before-after).toLocaleString()} torrents</strong></div>`, action('Apply','Apply the reviewed rule changes','id="apply-rules" data-primary'));
 $('cancel-dialog').onclick=openSettings;$('apply-rules').onclick=()=>{state.rules=rules;state.nextRule=Math.max(state.nextRule,...rules.map(rule=>rule.key+1));render();openSettings();};
}
function reviewRemoval(clear){
 const retained=torrents.filter((t,i)=>isRetained(i));
 const affected=clear?retained:retained.filter(t=>matchingRules(torrents.indexOf(t)).length);
 showDialog(clear?'Delete torrent catalogue?':'Review retained torrents',`${clear?'<p>Delete saved torrent metadata and its searchable file list. Indexing will be turned off; downloaded files are kept.</p>':''}<p>${affected.length} torrents · ${affected.reduce((n,t)=>n+t.files.length,0)} files</p>${affected.map(t=>`<div class="setting-row"><span>${escape(t.title)}</span><small>${clear?'Clear catalogue':matchingRules(torrents.indexOf(t)).map(ruleText).map(escape).join('<br>')}</small></div>`).join('')}<p><small>${affected.length?Math.round(affected.length*2.8):0} MiB of catalogue data reclaimable</small></p>`,action(clear?'Delete':'Remove','Remove the reviewed torrents from the catalogue',`id="confirm-removal" data-primary ${affected.length?'':'disabled'}`));
 $('confirm-removal').onclick=()=>{$('dialog').close();affected.forEach(t=>{const index=torrents.indexOf(t);state.removed.add(index);if(!clear)state.rejections.set(index,matchingRules(index).map(ruleKey));});if(clear){state.scenario='empty';state.indexing=false;}render();toast('Catalogue updated');};
}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,5500);}
function openMenu(name,anchor){
 const groups=resultGroups(),files=selectedFileSources(),current=groups.find(group=>group.key===state.current),source=current?.files.length?bestSource(current.files).key:state.current;
 const download=`<button role="menuitem" data-action="selected" ${files.length?'':'disabled'}>${icon('Download')} Download selected files</button>`;
 const items=name==='View'?`<button role="menuitemcheckbox" aria-checked="${state.filters}" data-action="filters">${icon('Filter')} Filters</button><button role="menuitemcheckbox" aria-checked="${state.inspector}" data-action="inspector">${icon('Inspect')} Inspector</button>`:name==='File'?`${download}<hr><button role="menuitem" data-action="settings">${icon('Settings')} Settings…</button>`:name==='Search'?`${download}<button role="menuitem" data-action="whole" ${groups.length?'':'disabled'}>${icon('Download')} Download torrent…</button><hr><button role="menuitem" data-action="settings">${icon('Settings')} Exclusion rules…</button>`:'<small>Throwaway Search prototype</small>';
 $('menu').innerHTML=items;const bounds=anchor.getBoundingClientRect();$('menu').style.left=bounds.left+'px';$('menu').style.top=bounds.bottom+'px';$('menu').showPopover();
 $('menu').querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{const action=button.dataset.action;$('menu').hidePopover();if(action==='settings')openSettings();else if(action==='selected')downloadFiles(files);else if(action==='whole')downloadTorrent(source);else{state[action]=!state[action];render();}});
}
$('query').oninput=e=>{state.query=e.target.value;render();};
$('theme').onclick=()=>{const dark=document.body.classList.toggle('dark');$('theme').innerHTML=icon(dark?'Light':'Dark');$('theme').title=dark?'Switch to light theme':'Switch to dark theme';$('theme').setAttribute('aria-label',$('theme').title);};$('scenario').onchange=e=>{state.scenario=e.target.value;if(state.scenario==='capacity')state.storageUsed=Math.round(state.budget*1.2);render();};$('cancel-work').onclick=()=>{state.scenario='partial';render();$('scenario').focus();toast('Rebuild cancelled');};$('reset').onclick=()=>location.reload();$('page-switch').onclick=()=>toast('In the app, this returns to Torrents. Search keeps its query and selection.');
document.querySelectorAll('[data-menu]').forEach(button=>button.onclick=()=>openMenu(button.dataset.menu,button));
document.addEventListener('keydown',e=>{if($('dialog').open||$('menu').matches(':popover-open')||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.ctrlKey&&e.key==='3'){e.preventDefault();$('query').focus();}});
render();
</script>
</body>
</html>
