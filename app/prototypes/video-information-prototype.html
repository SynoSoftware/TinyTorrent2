<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video information — flow prototype</title>
<!-- Throwaway: compare ways to turn on video information and pick its source.
     ?surface=library|settings picks the page; ?library=A-D and ?settings=A-D
     pick each page's variant. No variant asks for confirmation. Sample data
     only; nothing reaches the app or the network. -->
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--page:#202020;--card:#2b2b2b;--inner:#ffffff08;--control:#ffffff0f;--line:#ffffff1a;--text:#fff;--muted:#c5c5c5;--dim:#9a9a9a;--accent:#60cdff;--onaccent:#000;--hover:#ffffff12;--error:#ff99a4;--select:#ffffff0f}
body.light{color-scheme:light;--page:#f3f3f3;--card:#fbfbfb;--inner:#00000006;--control:#ffffffb3;--line:#0000001a;--text:#1b1b1b;--muted:#5f5f5f;--dim:#8a8a8a;--accent:#005fb8;--onaccent:#fff;--hover:#0000000a;--error:#c42b1c;--select:#0000000a}
body{margin:0;background:var(--page);color:var(--text);font:14px/20px 'Segoe UI Variable Text','Segoe UI',sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled,select:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:28px;line-height:36px;font-weight:600;margin:0}
h2{font-size:14px;line-height:20px;font-weight:600;margin:0}
p{margin:0}

.titlebar{height:48px;display:flex;align-items:center;gap:20px;padding:0 16px;color:var(--muted)}
.titlebar .search{margin:0 auto;width:320px;height:32px;background:var(--control);border-bottom:1px solid var(--dim);border-radius:4px;padding:6px 12px}
.titlebar .system{display:flex;gap:28px}

.btn{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;background:var(--control);border:1px solid var(--line);border-radius:4px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.accent{background:var(--accent);color:var(--onaccent);border-color:transparent}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;background:none;border:1px solid transparent;border-radius:4px;color:var(--muted)}
.icon-btn:hover:not(:disabled){background:var(--hover);color:var(--text)}
select.combo{height:32px;min-width:200px;padding:0 10px;background:var(--control);border:1px solid var(--line);border-radius:4px}
select.combo option{background:var(--card);color:var(--text)}
.split{display:inline-flex}
.split .btn:first-child{border-radius:4px 0 0 4px}
.split .btn:last-child{border-radius:0 4px 4px 0;border-left-width:0;padding:0 8px}

.toggle{display:inline-flex;align-items:center;gap:12px;background:none;border:0;padding:0;min-height:32px}
.toggle .state{min-width:24px;text-align:right}
.track{width:40px;height:20px;border-radius:10px;border:1px solid var(--muted);position:relative;transition:background .1s}
.track::after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:var(--muted);top:3px;left:4px;transition:left .1s}
.toggle[aria-checked=true] .track{background:var(--accent);border-color:var(--accent)}
.toggle[aria-checked=true] .track::after{left:22px;background:var(--onaccent)}

.menu{min-width:240px;padding:4px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px #0006;margin:0;position:fixed;inset:auto}
.menu button{display:grid;grid-template-columns:16px 1fr auto;gap:12px;align-items:center;width:100%;min-height:36px;padding:0 12px;background:none;border:0;border-radius:4px;text-align:left}
.menu button:hover:not(:disabled){background:var(--hover)}
.menu small{color:var(--muted);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.flyout{width:min(400px,calc(100vw - 24px));padding:16px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px #0006;margin:0;position:fixed;inset:auto}
.flyout h2{margin-bottom:12px}
.flyout p{margin-bottom:12px}
.flyout a{display:block;color:var(--accent);text-decoration:none;padding:6px 0}
.flyout a:hover{text-decoration:underline}

/* Settings */
.settings{max-width:1000px;margin:12px auto 160px;padding:0 32px}
.heading{margin-bottom:16px}
.categories{display:flex;gap:24px;margin-bottom:20px;overflow-x:auto;color:var(--muted)}
.categories span{padding:6px 0 10px;position:relative;white-space:nowrap}
.categories .current{color:var(--text)}
.categories .current::after{content:'';position:absolute;left:30%;right:30%;bottom:0;height:3px;border-radius:2px;background:var(--accent)}
.section{background:var(--card);border-radius:6px;padding:16px 24px;margin-bottom:16px}
.section-head{display:flex;align-items:center;gap:12px;padding-bottom:8px}
.section-head svg{color:var(--accent);width:20px;height:20px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;min-height:48px;padding:8px 0}
.row .label{min-width:0}
.row .label small{display:block;color:var(--muted);font-size:12px;line-height:16px}
.row .control{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.sources{background:var(--inner);border-radius:6px;padding:4px;margin-bottom:8px}
.choices{display:flex;flex-direction:column;gap:4px}
.choice{display:grid;grid-template-columns:20px 1fr auto auto;gap:12px;align-items:center;padding:4px 4px 4px 10px;min-height:40px;border-radius:4px;cursor:pointer}
.choice:hover{background:var(--hover)}
.choice input{margin:0;width:18px;height:18px;accent-color:var(--accent)}
.choice small{color:var(--muted);font-size:12px}
.choice.unavailable{opacity:.5;cursor:default}
.provider-list{margin-top:8px;padding:4px 12px}
.provider-choice{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;align-items:center;gap:16px;min-height:44px}
.provider-choice label{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.provider-choice input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.provider-choice label span,.provider-choice .coverage{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.provider-choice .coverage{color:var(--muted)}
.provider-choice label:has(input:disabled){opacity:.45;cursor:default}
.provider-choice .icon-btn svg{width:20px;height:20px}
.provider-error{color:var(--error);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){.provider-choice{grid-template-columns:minmax(0,1fr) 32px;gap:8px}.provider-choice .coverage{display:none}.provider-choice .icon-btn{grid-column:2}.provider-card .row{gap:8px}.provider-card select.combo{min-width:0;width:160px}.provider-card{padding:16px}}
.expander-head{cursor:pointer}
.chevron-up svg{transform:rotate(180deg)}

/* Library */
.library{display:flex;flex-direction:column;height:calc(100vh - 48px - 32px);padding:0 12px}
.library .tablecard,.library .details{background:var(--card);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.library .tablecard{flex:1;min-height:200px}
.library .details{flex:none;height:320px}
.grip{height:12px;display:flex;align-items:center;justify-content:center}
.grip::after{content:'';width:32px;height:4px;border-radius:2px;background:var(--dim)}
.card-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:6px 12px;border-bottom:1px solid var(--line)}
.card-head .file{display:flex;align-items:center;gap:10px;min-width:0}
.card-head .file .meta{white-space:nowrap;flex:none}
.card-head .file strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.card-head .file svg{color:var(--accent);width:20px;height:20px}
.card-head .selector{display:flex;gap:4px}
.card-head .selector span{padding:8px 12px;position:relative;color:var(--muted)}
.card-head .selector .current{color:var(--text)}
.card-head .selector .current::after{content:'';position:absolute;left:35%;right:35%;bottom:0;height:3px;border-radius:2px;background:var(--accent)}
.card-head .actions{display:flex;justify-content:flex-end;gap:4px}
.info{padding:12px 16px 16px;overflow:auto;flex:1}
.info-title{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.info-title strong{font-size:20px;line-height:28px;font-weight:600}
.columns{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:32px}
.columns>.secondary{border-left:1px solid var(--line);padding-left:24px;display:flex;flex-direction:column;gap:4px}
.primary{display:flex;flex-direction:column;gap:20px;min-width:0}
.section-label{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:8px}
.section-label svg,.field svg{width:18px;height:18px;color:var(--muted)}
.cast{display:flex;flex-wrap:wrap;gap:4px 12px}
.field{display:grid;grid-template-columns:18px 120px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:32px}
.field .name{color:var(--muted)}
.field .value{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filter-link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.menu-plain button{grid-template-columns:16px 1fr}
.pivot{display:flex;align-items:center;gap:20px;padding:12px 16px 4px}
.pivot span{padding-bottom:8px;position:relative;color:var(--muted)}
.pivot .current{color:var(--text)}
.pivot .current::after{content:'';position:absolute;left:25%;right:25%;bottom:0;height:3px;border-radius:2px;background:var(--accent)}
.pivot .command{margin-left:auto;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:400;color:var(--muted);text-align:left;height:36px;padding:0 12px;border-bottom:1px solid var(--line)}
td{height:40px;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
tbody tr{cursor:default}
tbody tr:hover{background:var(--hover)}
tbody tr.selected{background:var(--select);box-shadow:inset 3px 0 var(--accent)}
td.dim{color:var(--dim)}
.details-head{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.details-head strong{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.details-body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px;flex:1;overflow:auto}
.details-body .title{font-size:20px;line-height:28px;font-weight:600}
.meta{color:var(--muted)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:24px}
.empty>svg{width:32px;height:32px;color:var(--dim)}
.pair{display:flex;gap:8px}
.tiles{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px}
.tile{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;min-height:48px;padding:8px 14px;background:var(--control);border:1px solid var(--line);border-radius:6px;text-align:left;color:var(--text)}
.tile:hover:not(:disabled){background:var(--hover);border-color:var(--accent)}
.tile small{color:var(--muted);font-size:12px}
.problem{color:var(--error)}
.bar{height:3px;background:var(--select);border-radius:2px;overflow:hidden;width:160px}
.bar::after{content:'';display:block;height:100%;width:40%;background:var(--accent);animation:slide 1s ease-in-out infinite alternate}
@keyframes slide{to{transform:translateX(150%)}}
.statusbar{height:32px;display:flex;align-items:center;gap:6px;padding:0 16px;color:var(--muted);font-size:12px}

/* Prototype controls */
.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;max-width:calc(100vw - 24px);padding:10px 14px;background:#161c24;color:#f5f6f8;border:1px solid #46515f;border-radius:12px;box-shadow:0 8px 32px #0006;z-index:5}
.switcher .btn,.switcher select{background:#ffffff0d;border:1px solid #ffffff26;color:inherit;height:30px;border-radius:4px}
.switcher select option{background:#161c24}
.switcher .readout{width:100%;text-align:center;font-size:11px;color:#aebdcc}
@media(max-width:900px){.library{height:auto}.library .details{height:auto}.columns{grid-template-columns:1fr;gap:12px}.columns>.secondary{border-left:0;padding-left:0}.settings{padding:0 16px}.titlebar .search{display:none}}
@media(prefers-reduced-motion:reduce){.bar::after{animation:none}.track,.track::after{transition:none}}
</style>
</head>
<body>
<div class="titlebar"><button class="icon-btn" data-action="back" aria-label="Back" title="Back">←</button><span>File</span><span>View</span><span>Help</span><span class="search">Search TinyTorrent</span><span class="system"><span>−</span><span>□</span><span>×</span></span></div>
<main id="page"></main>
<div id="flyout" class="flyout" popover="auto"></div>
<div id="menu" class="menu" popover="auto" role="menu"></div>
<aside class="switcher" aria-label="Prototype controls">
  <button class="btn" data-action="previous" aria-label="Previous variant">←</button>
  <select id="surface" aria-label="Page"><option value="library">Library</option><option value="settings">Settings</option></select>
  <select id="libraryVariant" aria-label="Library variant"></select>
  <select id="settingsVariant" aria-label="Settings variant"></select>
  <button class="btn" data-action="next" aria-label="Next variant">→</button>
  <select id="scenario" aria-label="Network"><option value="normal">Network: direct</option><option value="proxy">Network: proxy on</option></select>
  <button class="btn" data-action="reset">Reset</button>
  <button class="btn" data-action="theme">Light / dark</button>
  <span class="readout" id="readout"></span>
</aside>
<script>
const paths={
  film:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/>',
  chevron:'<path d="m6 9 6 6 6-6"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  synopsis:'<path d="M15 12H3M17 18H3M21 6H3"/>',
  settings:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  star:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>',
  calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  tag:'<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5"/>',
  scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/>',
  cloudOff:'<path d="m2 2 20 20"/><path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07"/>',
  play:'<path d="m6 3 14 9-14 9V3z"/>',
  locate:'<path d="M2 12h3M19 12h3M12 2v3M12 19v3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/>',
  more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  folder:'<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
  pencil:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>',
  eraser:'<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7M5 11l9 9"/>',
};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const libraryVariants={
  A:'Split button',
  B:'Source buttons',
  C:'Menu and Turn on',
  D:'Page command',
  E:'Go to Settings',
};
const settingsVariants={
  A:'Provider list',
  B:'Compact choice',
  C:'Switch and provider',
  D:'Expander',
};
const sources={
  tmdb:{name:'TMDB',covers:'Movies and series',web:false,privacy:'https://www.themoviedb.org/privacy-policy',terms:'https://www.themoviedb.org/api-terms-of-use'},
  imdb:{name:'IMDb',covers:'Movies only',web:true,privacy:'https://www.imdb.com/privacy',terms:'https://www.imdb.com/conditions'},
  rt:{name:'Rotten Tomatoes',covers:'Movies only',web:true,privacy:'https://www.fandango.com/policies/privacy-policy',terms:'https://www.rottentomatoes.com/policies/terms-and-policies'},
};
// The disclosure lives in each source's information flyout, as the subtitle
// supplier's does, so nothing asks for confirmation.
function disclosure(id){
  return sources[id].web
    ? `Looks up the movie you select on ${sources[id].name}, using your installed Edge or Chrome browser. ${sources[id].name} receives the movie title, year and your network address. Never sends file paths or file contents.`
    : 'Looks up every video on TMDB with its release title, year and episode numbers. Uses your network settings. Never sends file paths or file contents.';
}
const videos=[
  {file:'Dune.Part.Two.2024.2160p.WEB-DL.mkv',guess:'Dune Part Two',kind:'Movie',title:'Dune: Part Two',year:'2024',rating:'8.5',genres:'Science fiction · Adventure',synopsis:'Paul Atreides joins the Fremen and moves toward a war he has already seen in visions.',size:'17.0 GiB',cast:['Timothée Chalamet','Zendaya','Rebecca Ferguson','Javier Bardem','Austin Butler','Florence Pugh']},
  {file:'Severance.S02E03.1080p.WEB.mkv',guess:'Severance S2 E3',kind:'TV episode',title:'Severance · Season 2, Episode 3',year:'2025',rating:'8.7',genres:'Drama · Mystery',synopsis:'Office workers whose memories are split between work and home keep looking for answers.',size:'2.0 GiB',cast:['Adam Scott','Britt Lower','Zach Cherry','Tramell Tillman','John Turturro']},
  {file:'The.Holdovers.2023.1080p.BluRay.mkv',guess:'The Holdovers',kind:'Movie',title:'The Holdovers',year:'2023',rating:'7.9',genres:'Comedy · Drama',synopsis:'A teacher, a student and a cook spend the winter break together at an empty boarding school.',size:'8.8 GiB',cast:['Paul Giamatti','Da’Vine Joy Randolph','Dominic Sessa','Carrie Preston']},
  {file:'Perfect.Days.2023.720p.mkv',guess:'Perfect Days',kind:'Movie',title:'Perfect Days',year:'2023',rating:'7.9',genres:'Drama',synopsis:'A Tokyo toilet cleaner finds quiet meaning in the routine of his days.',size:'2.8 GiB',cast:['Kōji Yakusho','Tokio Emoto','Arisa Nakano','Aoi Yamada']},
];

const params=new URLSearchParams(location.search);
const state={
  surface:['library','settings'].includes(params.get('surface'))?params.get('surface'):'library',
  library:libraryVariants[params.get('library')]?params.get('library'):'E',
  settings:settingsVariants[params.get('settings')]?params.get('settings'):'C',
  // Set when Library opened Settings, so title-bar Back returns there.
  returnTo:null,
};
function reset(){
  Object.assign(state,{scenario:'normal',on:false,source:'tmdb',selected:0,known:new Set(),fetching:null,expanded:false});
}
reset();
let timer;

const available=id=>!(sources[id].web&&state.scenario==='proxy');
const canIdentify=index=>!(sources[state.source].web&&videos[index].kind!=='Movie');
const unavailableText=id=>`${sources[id].name} can't run with a proxy`;

// TMDB works through every video; a website looks up the selected movie after
// a short pause.
function schedule(){
  clearTimeout(timer);
  state.fetching=null;
  if(!state.on||!available(state.source))return;
  if(!sources[state.source].web){
    const pending=videos.map((_,i)=>i).filter(i=>!state.known.has(i));
    if(!pending.length)return;
    state.fetching='all';
    timer=setTimeout(()=>{pending.forEach(i=>state.known.add(i));state.fetching=null;render()},1400);
    return;
  }
  const index=state.selected;
  if(state.known.has(index)||!canIdentify(index))return;
  state.fetching=index;
  timer=setTimeout(()=>{state.known.add(index);state.fetching=null;render()},1400);
}
function refresh(index){
  if(!available(state.source)||!canIdentify(index))return;
  clearTimeout(timer);
  state.fetching=index;
  render();
  timer=setTimeout(()=>{state.known.add(index);state.fetching=null;render()},1000);
}
// 'off' turns lookups off and keeps the source; a source id turns them on with it.
function choose(value){
  if(value==='off'){state.on=false}
  else{
    if(value!==state.source)state.known.clear();
    state.source=value;state.on=true;
  }
  schedule();render();
}

/* ---------- Shared controls ---------- */
function toggle(action,on,label){
  return `<button class="toggle" role="switch" aria-checked="${on}" aria-label="${escape(label)}" data-action="${action}"><span class="state">${on?'On':'Off'}</span><span class="track"></span></button>`;
}
const infoButton=(id,disabled=false)=>`<button class="icon-btn" data-action="info" data-source="${id}" aria-label="${sources[id].name} information" title="${sources[id].name} information" ${disabled?'disabled':''}>${icon('info')}</button>`;
function sourceCombo(id,withOff){
  const value=withOff&&!state.on?'off':state.source;
  return `<select class="combo" id="${id}" aria-label="Get details from">${withOff?`<option value="off" ${value==='off'?'selected':''}>Off</option>`:''}${Object.entries(sources).map(([key,s])=>
    `<option value="${key}" ${value===key?'selected':''} ${available(key)?'':'disabled'}>${s.name}${available(key)?'':' (unavailable with a proxy)'}</option>`).join('')}</select>`;
}
function sourceList(){
  return `<div class="choices" role="radiogroup" aria-label="Get details from">${Object.entries(sources).map(([id,s])=>`
    <label class="choice ${available(id)?'':'unavailable'}" title="${available(id)?'':escape(unavailableText(id))}">
      <input type="radio" name="source" value="${id}" ${state.source===id?'checked':''} ${available(id)?'':'disabled'}>
      <span>${s.name}</span>
      <small>${available(id)?s.covers:'Unavailable with a proxy'}</small>
      ${infoButton(id)}
    </label>`).join('')}</div>`;
}
function providerList(){
  const current=state.on?state.source:'off';
  return `<div class="sources provider-list" role="radiogroup" aria-label="Video information">
    <div class="provider-choice"><label><input type="radio" name="information" value="off" ${current==='off'?'checked':''}><span>Off</span></label></div>
    ${Object.entries(sources).map(([id,s])=>`<div class="provider-choice">
      <label title="${available(id)?s.covers:escape(unavailableText(id))}"><input type="radio" name="information" value="${id}" ${current===id?'checked':''} ${available(id)?'':'disabled'}><span>${s.name}</span></label>
      <span class="coverage">${available(id)?s.covers:'Unavailable with a proxy'}</span>${infoButton(id)}
    </div>`).join('')}
  </div>`;
}
function menuItems(withOff){
  const current=withOff&&!state.on?'off':state.source;
  const item=(value,name,detail,disabled)=>`<button role="menuitemradio" aria-checked="${current===value}" data-action="pick" data-value="${value}" ${disabled?'disabled':''}>
    <span>${current===value?icon('check'):''}</span><span>${name}</span><small>${detail}</small></button>`;
  return (withOff?item('off','Off','',false)+'<hr>':'')+
    Object.entries(sources).map(([id,s])=>item(id,s.name,available(id)?s.covers:'Unavailable with a proxy',!available(id))).join('');
}
function place(popup,anchor){
  const rect=anchor.getBoundingClientRect();
  popup.style.left=Math.max(12,Math.min(innerWidth-popup.offsetWidth-12,rect.left))+'px';
  popup.style.top=(rect.bottom+popup.offsetHeight+8<innerHeight?rect.bottom+4:rect.top-popup.offsetHeight-4)+'px';
}

/* ---------- Library ---------- */
const shown=index=>state.on&&state.known.has(index);
function libraryPage(){
  const rows=videos.map((v,i)=>{
    const known=shown(i);
    const type=known?v.kind:state.fetching===i||state.fetching==='all'?'Fetching…':state.on?'Not identified':'Video';
    return `<tr class="${i===state.selected?'selected':''}" data-row="${i}">
      <td>${escape(known?v.title:v.guess)}</td><td>${known?v.year:''}</td>
      <td class="${known?'':'dim'}">${type}</td><td>${known?v.rating:'<span class="dim">—</span>'}</td><td>${v.size}</td></tr>`;
  }).join('');
  let status=`${videos.length} videos`;
  if(!state.on)status+=' · Video information off';
  else if(!available(state.source))status+=` · Waiting for ${sources[state.source].name}`;
  else if(state.fetching!==null)status+=' · Fetching video information…';
  // Variant D puts one command for video information on the Videos page itself.
  const command=state.library==='D'
    ? `<button class="btn command" data-action="open-menu" data-off="true" aria-haspopup="menu">${icon('film')}Video information: ${state.on?sources[state.source].name:'Off'}${icon('chevron')}</button>`
    : '';
  return `<div class="library">
    <section class="tablecard"><div class="pivot"><span class="current">Videos</span><span>Music</span><span>Files</span>${command}</div>
      <div style="overflow:auto"><table><thead><tr><th>Title</th><th>Year</th><th>Type</th><th>Rating</th><th>Size</th></tr></thead><tbody>${rows}</tbody></table></div></section>
    <div class="grip" aria-hidden="true"></div>
    <section class="details">${detailsCard()}</section>
  </div>
  <div class="statusbar">${status}</div>`;
}
function turnOnControl(){
  switch(state.library){
    case 'A':
      return `<div class="split"><button class="btn" data-action="pick" data-value="${state.source}">Get details from ${sources[state.source].name}</button><button class="btn" data-action="open-menu" aria-label="Choose where details come from" aria-haspopup="menu">${icon('chevron')}</button></div>`;
    case 'B':
      return `<span>Get details from</span><div class="tiles">${Object.entries(sources).map(([id,s])=>
        `<button class="tile" data-action="pick" data-value="${id}" ${available(id)?'':'disabled'}><span>${s.name}</span><small>${available(id)?s.covers:'Unavailable with a proxy'}</small></button>`).join('')}</div>`;
    case 'C':
      return `<div class="pair">${sourceCombo('librarySource',false)}<button class="btn accent" data-action="pick" data-value="${state.source}">Turn on</button></div>`;
    case 'E':
      return `<button class="btn" data-action="go-settings" title="Turn on video information and choose where details come from" aria-label="Settings">${icon('settings')}Settings</button>`;
    default:
      return '';
  }
}
function field(glyph,name,value,action=''){
  return `<div class="field">${icon(glyph)}<span class="name">${escape(name)}</span><span class="value" title="${escape(value.replace(/<[^>]+>/g,''))}">${value}</span>${action}</div>`;
}
const link=text=>`<span class="filter-link">${escape(text)}</span>`;
// The real card: title row with Info and File in the middle and the commands on
// the right; Info shows sections on the left and facts on the right.
function detailsCard(){
  const i=state.selected,v=videos[i],known=shown(i);
  const head=`<div class="card-head">
      <div class="file">${icon('film')}<strong title="${escape(v.file)}">${escape(v.file)}</strong><span class="meta">${v.size}</span></div>
      <div class="selector"><span class="current">Info</span><span>File</span></div>
      <div class="actions">
        <button class="icon-btn" title="Play" aria-label="Play">${icon('play')}</button>
        <button class="icon-btn" title="Show in Torrents" aria-label="Show in Torrents">${icon('locate')}</button>
        <button class="icon-btn" data-action="more" title="More actions" aria-label="More actions" aria-haspopup="menu">${icon('more')}</button>
      </div>
    </div>`;
  let primary,secondary;
  if(known){
    primary=`<div><div class="section-label">${icon('synopsis')}Synopsis</div><p>${escape(v.synopsis)}</p></div>
      <div><div class="section-label">${icon('users')}Cast</div><div class="cast">${v.cast.map(escape).map(n=>`<span>${n}</span>`).join('')}</div></div>`;
    secondary=field('star',sources[state.source].name,`${v.rating} / 10`)+field('calendar','Year',link(v.year))+
      field('tag','Genres',v.genres.split(' · ').map(link).join(', '));
  }else{
    // Without information the Info page keeps the existing Metadata field; its
    // value states why, and its action is the variant's way to turn on.
    let status,glyph='scan',action='';
    if(state.fetching===i||state.fetching==='all')status='Fetching…';
    else if(!state.on){status='Video information off';action=turnOnControl()}
    else if(!available(state.source)){status='Provider unavailable';glyph='cloudOff'}
    else status='Not identified';
    primary=field(glyph,'Metadata',escape(status),action);
    secondary='';
  }
  return `${head}<div class="info">
      <div class="info-title"><strong>${escape(known?v.title:v.guess)}</strong><span class="meta">${known?v.kind:'Video'}</span></div>
      <div class="columns"><div class="primary">${primary}</div><div class="secondary">${secondary}</div></div>
    </div>`;
}
// More holds Refresh only for a website source, the one source that looks up
// on request; TMDB keeps its details current by itself.
function moreItems(){
  const v=videos[state.selected];
  const items=[['folder','Open folder',''],['pencil','Edit metadata',''],['eraser','Erase metadata','']];
  if(state.on&&sources[state.source].web&&v.kind==='Movie')items.push(['refresh',shown(state.selected)?'Refresh details':'Fetch details','refresh']);
  return items.map(([glyph,label,action])=>`<button role="menuitem" ${action?`data-action="${action}"`:''}>${icon(glyph)}<span>${label}</span></button>`).join('');
}

/* ---------- Settings ---------- */
function row(label,control,value=''){
  return `<div class="row"><div class="label">${escape(label)}${value?`<small>${escape(value)}</small>`:''}</div><div class="control">${control}</div></div>`;
}
function libraryCard(){
  const main=toggle('switch',state.on,'Video information');
  const problem=state.on&&!available(state.source)
    ? `<div class="provider-error" role="status" title="${escape(unavailableText(state.source))}">${escape(unavailableText(state.source))}</div>`
    : '';
  switch(state.settings){
    case 'A':
      return `<div class="label">Video information</div>${providerList()}${problem}`;
    case 'B':
      return row('Video information',sourceCombo('settingsLevel',true)+infoButton(state.source))+problem;
    case 'C':
      return row('Video information',main)+
        row('Provider',sourceCombo('settingsSource',false)+infoButton(state.source))+problem;
    default:
      return `<div class="row expander-head" data-action="expand">
          <div class="label">Video information<small>${sources[state.source].name}</small></div>
          <div class="control">${main}<button class="icon-btn ${state.expanded?'chevron-up':''}" aria-expanded="${state.expanded}" aria-label="Get details from" data-action="expand">${icon('chevron')}</button></div>
        </div>${state.expanded?`<div class="sources">${sourceList()}</div>`:''}${problem}`;
  }
}
function settingsPage(){
  const categories=['General','Transfers','Speed limits','Appearance','Network','Schedule','Subtitles','Advanced'];
  return `<div class="settings">
    <div class="heading"><h1>Settings</h1></div>
    <div class="categories">${categories.map((c,i)=>`<span class="${i===0?'current':''}">${c}</span>`).join('')}</div>
    <section class="section"><div class="section-head">${icon('refresh')}<h2>Updates</h2></div>${row('Check for updates',toggle('noop',true,'Check for updates'))}</section>
    <section class="section provider-card"><div class="section-head">${icon('film')}<h2>Library</h2></div>${libraryCard()}</section>
  </div>`;
}

/* ---------- Wiring ---------- */
function fill(id,variants,value){
  document.getElementById(id).innerHTML=Object.entries(variants).map(([key,name])=>
    `<option value="${key}" ${key===value?'selected':''}>${id==='libraryVariant'?'Library':'Settings'} ${key} · ${name}</option>`).join('');
}
function setUrl(){
  const url=new URL(location.href);
  url.searchParams.set('surface',state.surface);url.searchParams.set('library',state.library);url.searchParams.set('settings',state.settings);
  history.replaceState(null,'',url);
}
function render(){
  const active=document.activeElement;
  const focus=active?.matches('#page input[type=radio]')
    ? `input[name="${active.name}"][value="${active.value}"]`
    : active?.matches('#page select')?`#${active.id}`
    : active?.matches('#page .toggle')?`.toggle[data-action="${active.dataset.action}"]`:null;
  document.getElementById('page').innerHTML=state.surface==='library'?libraryPage():settingsPage();
  if(state.surface==='settings'&&state.settings==='C')document.getElementById('settingsSource').disabled=!state.on;
  if(focus)document.querySelector(`#page ${focus}`)?.focus({preventScroll:true});
  fill('libraryVariant',libraryVariants,state.library);
  fill('settingsVariant',settingsVariants,state.settings);
  document.getElementById('surface').value=state.surface;
  document.getElementById('scenario').value=state.scenario;
  document.getElementById('readout').textContent=
    `Video information: ${state.on?'on':'off'} · Source: ${sources[state.source].name} · Identified: ${state.known.size} of ${videos.length} · ← / → change the variant of the page you see`;
}
function cycle(delta){
  const key=state.surface,variants=key==='library'?libraryVariants:settingsVariants,keys=Object.keys(variants);
  state[key]=keys[(keys.indexOf(state[key])+delta+keys.length)%keys.length];
  setUrl();render();
}
document.addEventListener('click',event=>{
  const row=event.target.closest('[data-row]');
  if(row){state.selected=+row.dataset.row;schedule();render();return}
  const button=event.target.closest('[data-action]');
  if(!button||button.disabled)return;
  switch(button.dataset.action){
    case 'previous':cycle(-1);break;
    case 'next':cycle(1);break;
    case 'theme':document.body.classList.toggle('light');break;
    case 'reset':clearTimeout(timer);reset();render();break;
    case 'switch':choose(state.on?'off':state.source);break;
    case 'refresh':document.getElementById('menu').hidePopover();refresh(state.selected);break;
    case 'more':{
      const menu=document.getElementById('menu');
      menu.innerHTML=moreItems();menu.classList.add('menu-plain');
      menu.showPopover();
      const rect=button.getBoundingClientRect();
      menu.style.left=Math.max(12,rect.right-menu.offsetWidth)+'px';
      menu.style.top=(rect.bottom+menu.offsetHeight+8<innerHeight?rect.bottom+4:rect.top-menu.offsetHeight-4)+'px';
      break;
    }
    case 'go-settings':{
      // The same reveal as title-bar search: open General, bring the Library
      // card into view and focus its first control.
      state.returnTo='library';state.surface='settings';setUrl();render();
      const card=document.querySelector('.provider-card');
      card.scrollIntoView({block:'center'});
      card.querySelector('.toggle,select,input:checked,input')?.focus({preventScroll:true});
      break;
    }
    case 'back':
      if(state.surface==='settings'&&state.returnTo){state.surface=state.returnTo;state.returnTo=null;setUrl();render()}
      break;
    case 'expand':
      if(event.target.closest('.toggle'))break;
      state.expanded=!state.expanded;render();break;
    case 'pick':
      document.getElementById('menu').hidePopover();
      choose(button.dataset.value);
      break;
    case 'open-menu':{
      const menu=document.getElementById('menu');
      menu.innerHTML=menuItems(button.dataset.off==='true');menu.classList.remove('menu-plain');
      menu.showPopover();
      place(menu,button.closest('.split')||button);
      menu.querySelector('[aria-checked=true]')?.focus();
      break;
    }
    case 'info':{
      // The button can sit inside a source's label; keep the click from selecting it.
      event.preventDefault();
      const s=sources[button.dataset.source],flyout=document.getElementById('flyout');
      flyout.innerHTML=`<h2>${s.name}</h2><p>${escape(disclosure(button.dataset.source))}</p>
        <a href="${s.privacy}" target="_blank" rel="noopener noreferrer">Privacy policy</a><a href="${s.terms}" target="_blank" rel="noopener noreferrer">Terms</a>`;
      flyout.showPopover();
      place(flyout,button);
      break;
    }
  }
});
document.addEventListener('change',event=>{
  const target=event.target;
  if(target.name==='information'){choose(target.value);return}
  if(target.name==='source'){
    if(target.value!==state.source)state.known.clear();
    state.source=target.value;schedule();render();return;
  }
  switch(target.id){
    case 'surface':state.surface=target.value;state.returnTo=null;setUrl();render();break;
    case 'libraryVariant':state.library=target.value;state.surface='library';setUrl();render();break;
    case 'settingsVariant':state.settings=target.value;state.surface='settings';setUrl();render();break;
    case 'scenario':state.scenario=target.value;schedule();render();break;
    // The Library pair waits for Turn on; Settings applies the choice at once.
    case 'librarySource':state.source=target.value;render();break;
    case 'settingsSource':
      if(target.value!==state.source)state.known.clear();
      state.source=target.value;schedule();render();break;
    case 'settingsLevel':choose(target.value);break;
  }
});
document.addEventListener('keydown',event=>{
  if(event.target.closest('input,select,textarea,[contenteditable],[role=menu]'))return;
  if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1)}
});
render();
</script>
</body>
</html>
