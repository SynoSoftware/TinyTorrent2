menu.addEventListener('toggle',event=>{for(const button of app.querySelectorAll('[data-action=app-menu],[data-action=actions]'))button.setAttribute('aria-expanded',String(event.newState==='open'&&button.dataset.action===menu.dataset.invoker));});
menu.addEventListener('keydown',event=>{
  if(!['ArrowUp','ArrowDown','Home','End','Escape'].includes(event.key))return;
  event.preventDefault();event.stopPropagation();
  if(event.key==='Escape'){closeMenu();return;}
  const buttons=[...menu.querySelectorAll('button:not(:disabled)')];
  const index=buttons.indexOf(document.activeElement);
  buttons[event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(event.key==='ArrowUp'?-1:1)+buttons.length)%buttons.length].focus();
});
document.addEventListener('keydown',event=>{
  if(event.isComposing)return;
  if(event.ctrlKey&&event.key.toLowerCase()==='k'){
    event.preventDefault();if(dialog.open)return;
    app.querySelector('#global-search').focus();return showSearch();
  }
  if(event.target.id==='global-search'){
    if(event.key==='Escape'){event.preventDefault();searchMenu.hidePopover();return;}
    if(['ArrowDown','ArrowUp'].includes(event.key)){
      event.preventDefault();if(!searchMenu.matches(':popover-open'))showSearch();
      const available=searchMatches.map((entry,index)=>entry.disabled?-1:index).filter(index=>index>=0);
      if(available.length)setSearchActive(available[(available.indexOf(searchActive)+(event.key==='ArrowDown'?1:-1)+available.length)%available.length]);
    }
    if(event.key==='Enter'){event.preventDefault();if(searchActive>=0)chooseSearch(searchActive);}
    return;
  }
  if(event.target.closest('input,textarea,select,[contenteditable=true]')) return;
  if(dialog.open || menu.matches(':popover-open')) return;
  const key=event.key.toLowerCase();
  const filter=event.target.closest('[data-filter]');
  if(event.target.closest('.filter-pane')&&event.key==='Escape'){event.preventDefault();return handle('filters');}
  if(filter && ['ArrowUp','ArrowDown','Home','End'].includes(event.key)){
    event.preventDefault();const index=filters.findIndex(([value])=>value===filter.dataset.filter);
    return filterTorrents(filters[event.key==='Home'?0:event.key==='End'?filters.length-1:Math.max(0,Math.min(filters.length-1,index+(event.key==='ArrowUp'?-1:1)))][0]);
  }
  const detailRow=event.target.closest('[data-detail-row]');
  if(detailRow&&(['ArrowUp','ArrowDown','Home','End'].includes(event.key)||event.ctrlKey&&key==='a')){
    event.preventDefault();const view=detailRow.dataset.detailView,rows=[...app.querySelectorAll('[data-detail-row]')],index=rows.indexOf(detailRow);
    if(event.ctrlKey&&key==='a')return selectDetailRows(view,rows.map(row=>row.dataset.detailRow));
    const next=rows[event.key==='Home'?0:event.key==='End'?rows.length-1:Math.max(0,Math.min(rows.length-1,index+(event.key==='ArrowUp'?-1:1)))];
    selectDetailRows(view,[next.dataset.detailRow]);next.focus();return;
  }
  const group=event.target.closest('[data-group]');
  if(group && ['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) {
    event.preventDefault(); const names=settingsCategories.map(([name])=>name); const index=names.indexOf(state.settingsCategory);
    return settings(names[event.key==='Home'?0:event.key==='End'?names.length-1:(index+(event.key==='ArrowLeft'?-1:1)+names.length)%names.length]);
  }
  if(state.page!=='torrents' && event.key==='Escape'){event.preventDefault();return handle('torrents');}
  const tab=event.target.closest('[data-tab]');
  const row=event.target.closest('[data-torrent]');
  const splitter=event.target.closest('.split');
  if(event.target.id==='piece-map'&&map){
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key)){event.preventDefault();showPiece(event.key==='Home'?0:event.key==='End'?map.cells.length-1:map.index+({ArrowLeft:-1,ArrowRight:1,ArrowUp:-map.columns,ArrowDown:map.columns}[event.key]));return;}
    if(event.ctrlKey&&key==='c'){event.preventDefault();navigator.clipboard.writeText(map.canvas.getAttribute('aria-label'));return;}
  }
  if(splitter && ['ArrowUp','ArrowDown'].includes(event.key)){
    event.preventDefault(); const panel=splitter.closest('.inspector'); const height=Math.max(155,Math.min(500,panel.offsetHeight+(event.key==='ArrowUp'?20:-20))); state.split[state.variant]=height;panel.style.height=`${height}px`;splitter.setAttribute('aria-valuenow',String(panel.offsetHeight));showState();return;
  }
  if(tab && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key)){
    event.preventDefault();const index=tabs.indexOf(state.tab);state.tab=event.key==='Home'?tabs[0]:event.key==='End'?tabs.at(-1):tabs[(index+(['ArrowLeft','ArrowUp'].includes(event.key)?-1:1)+tabs.length)%tabs.length];render();app.querySelector(`[data-tab="${state.tab}"]`).focus();return;
  }
  if(row && ['ArrowUp','ArrowDown','Enter'].includes(event.key)){
    event.preventDefault();if(event.key==='Enter'){const id=Number(row.dataset.torrent);if(!state.selection.includes(id))selectTorrents([id]);handle('properties');app.querySelector('[role=tab][aria-selected=true]')?.focus();return;}
    const visible=rows();const index=visible.findIndex(torrent=>torrent.torrentId===Number(row.dataset.torrent));const torrent=visible[Math.max(0,Math.min(visible.length-1,index+(event.key==='ArrowUp'?-1:1)))];state.selection=[torrent.torrentId];render();app.querySelector(`[data-torrent="${torrent.torrentId}"]`)?.focus();return;
  }
  if(!event.ctrlKey&&!event.altKey && ['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();return switchVariant(event.key==='ArrowLeft'?-1:1);}
  if(event.ctrlKey && ['f','e'].includes(key)){event.preventDefault();app.querySelector('#global-search').focus();return showSearch();}
  if(event.ctrlKey && key==='o'){event.preventDefault();return handle(event.shiftKey?'magnet':'add');}
  if(event.altKey && key==='o'){event.preventDefault();return settings();}
  if(event.ctrlKey && key==='q'){event.preventDefault();return handle('exit');}
  if(row && event.ctrlKey && key==='a'){event.preventDefault();selectTorrents(rows().map(torrent=>torrent.torrentId));return;}
  if(state.page==='torrents' && event.ctrlKey && ['p','s','m','r'].includes(key)){
    event.preventDefault();if(!selected().length && !(event.shiftKey && ['p','s'].includes(key)))return;return handle({p:event.shiftKey?'pause-all':'pause',s:event.shiftKey?'resume-all':'resume',m:'force',r:'verify'}[key]);
  }
  if(row && event.key==='Delete'){event.preventDefault();return remove(event.shiftKey);}
  if(row && event.shiftKey && event.key==='F10'){event.preventDefault();return actions('context');}
});
app.addEventListener('contextmenu',event=>{
  const row=event.target.closest('[data-torrent]');
  if(!row)return;
  event.preventDefault();
  const torrentId=Number(row.dataset.torrent);
  if(!state.selection.includes(torrentId))selectTorrents([torrentId]);
  app.querySelector(`[data-torrent="${torrentId}"]`).focus();
  actions('context',{x:event.clientX,y:event.clientY});
});
app.addEventListener('dragover',event=>{event.preventDefault();});
app.addEventListener('pointermove',event=>{if(event.target.id==='piece-map'&&map){const bounds=map.canvas.getBoundingClientRect();const cell=map.cells.findIndex(cell=>event.clientX-bounds.left>=cell.x&&event.clientX-bounds.left<cell.x+10&&event.clientY-bounds.top>=cell.y&&event.clientY-bounds.top<cell.y+10);if(cell>=0)showPiece(cell);}});
app.addEventListener('pointerout',event=>{if(event.target.id==='piece-map')document.getElementById('piece-tip')?.setAttribute('hidden','');});
app.addEventListener('drop',event=>{event.preventDefault();if(connected()){add();announce('Drop received. The prototype uses sample metadata only.');}});
app.addEventListener('pointerdown',event=>{
  const split=event.target.closest('.split');if(!split)return;
  const panel=split.closest('.inspector');const top=event.clientY;const height=panel.offsetHeight;split.setPointerCapture(event.pointerId);
  const move=event=>{const value=Math.max(155,Math.min(500,height+top-event.clientY));state.split[state.variant]=value;panel.style.height=`${value}px`;split.setAttribute('aria-valuenow',String(panel.offsetHeight));showState();};
  split.addEventListener('pointermove',move);split.addEventListener('pointerup',()=>split.removeEventListener('pointermove',move),{once:true});
});
render();
</script>
</body>
</html>
