<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings layout prototype</title>
<!-- PROTOTYPE, throw away. Settings layout B2 (section cards, one row per setting, no separator lines; sub-groups
     sit on borderless inner cards) with status bar S2 (the items of MainWindow.xaml, caps beside the rates, one line, hover tooltips).
     Open this file directly; all values are sample data in memory. Edits apply as they happen, with no Save.
     Network tab: encryption sits in the Connections card; the Proxy server card has three editing variants (?variant=1..3,
     arrows in the bottom bar or the ←/→ keys). Variant B saves the proxy from a dialog, as Windows Settings does for its own proxy.
     Transfers and Schedule are left out: their current design is speed-prototype.html. -->
<style>
* { box-sizing: border-box; }
:root { color-scheme:light; --page:#f3f3f3; --card:#fbfbfb; --ctl:#fdfdfd; --ctl2:#f5f5f5; --ctlBorder:#e5e5e5; --ctlLine:#868686;
  --text:#1a1a1a; --muted:#5f5f5f; --accent:#005fb8; --accentText:#003e92; --onAccent:#fff; --hover:rgb(0 0 0 / .03);
  --caution:#9d5d00; --cautionBg:rgb(157 93 0 / .16); --critical:#c42b1c; --success:#0f7b0f; --grid:#ececec; --gridLine:#dcdcdc; --inner:rgb(0 0 0 / .035);
  --tint:rgb(0 95 184 / .16); --tip:#f9f9f9; --tipBorder:rgb(0 0 0 / .06); }
body.dark { color-scheme:dark; --page:#273036; --card:#2f3538; --ctl:#3c4144; --ctl2:#454a4d; --ctlBorder:rgb(255 255 255 / .07); --ctlLine:#a1a3a5;
  --text:#ffffff; --muted:#c5c5c5; --accent:#4cc2ff; --accentText:#99ebff; --onAccent:#000; --hover:rgb(255 255 255 / .04);
  --caution:#fce100; --cautionBg:rgb(252 225 0 / .16); --critical:#ff99a4; --success:#6ccb5f; --grid:#404548; --gridLine:#4d5255; --inner:rgb(255 255 255 / .045);
  --tint:rgb(76 194 255 / .2); --tip:#2c2c2c; --tipBorder:rgb(0 0 0 / .2); }
body { margin:0; background:#111; font:14px/20px 'Segoe UI Variable Text','Segoe UI',sans-serif; color:var(--text); }
.window { margin:12px auto 0; background:var(--page); border:1px solid #444; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
svg.i { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.chrome { height:48px; display:flex; align-items:center; gap:28px; padding:0 18px; flex:none; }
.chrome .menu { color:var(--muted); } .chrome .menu b { color:var(--text); font-weight:400; }
.chrome .search { margin:0 auto; width:320px; height:32px; border-radius:4px; background:var(--ctl); border-bottom:1px solid var(--ctlLine); padding:6px 10px; color:var(--muted); }
.backrow { height:48px; padding:8px 16px; flex:none; }
.btn { display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 11px; border-radius:4px; background:var(--ctl); border:1px solid var(--ctlBorder); color:var(--text); font:inherit; white-space:nowrap; cursor:default; }
.scroll { flex:1; min-height:0; overflow-y:auto; }
.column { max-width:832px; margin:0 auto; padding:0 16px 32px; }
h1 { font:600 28px/36px 'Segoe UI Variable Display','Segoe UI',sans-serif; margin:20px 0 24px; }
.selector { display:flex; margin:0 0 8px; } .selector .item { position:relative; display:flex; align-items:center; gap:8px; padding:8px 12px 12px; cursor:default; }
.selector .item.on::after { content:''; position:absolute; left:calc(50% - 8px); bottom:2px; width:16px; height:3px; border-radius:2px; background:var(--accent); }
.selector .item:not(.on) { color:var(--muted); }
.lbl { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.err { color:var(--critical); } .sub { color:var(--muted); }
.link { color:var(--accentText); cursor:default; }
/* controls */
.tg { display:inline-flex; align-items:center; gap:12px; height:32px; cursor:default; user-select:none; }
.track { width:40px; height:20px; border-radius:10px; border:1px solid var(--muted); position:relative; flex:none; }
.track::after { content:''; position:absolute; top:3px; left:4px; width:12px; height:12px; border-radius:6px; background:var(--muted); transition:left .1s; }
.tg.on .track { background:var(--accent); border-color:var(--accent); } .tg.on .track::after { left:22px; background:var(--onAccent); }
input.num, input.text, input.path, select.combo, .picker select { height:32px; border-radius:4px; background:var(--ctl); border:1px solid var(--ctlBorder); border-bottom-color:var(--ctlLine); color:var(--text); font:inherit; padding:0 10px; }
input.num { width:160px; } input.path { width:100%; } input::placeholder { color:var(--muted); }
input.bad { border-bottom:2px solid var(--critical); }
select.combo { width:240px; appearance:none; padding-right:30px; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 14px,calc(100% - 12px) 14px; background-size:5px 5px; background-repeat:no-repeat; }
.pathline { display:grid; grid-template-columns:1fr auto; gap:12px; }
.cb { display:inline-flex; gap:8px; align-items:center; cursor:default; user-select:none; }
.cb .box { width:20px; height:20px; border-radius:4px; border:1px solid var(--muted); display:grid; place-items:center; flex:none; }
.cb.on .box { background:var(--accent); border-color:var(--accent); color:var(--onAccent); } .cb:not(.on) .box svg { visibility:hidden; }
.cb .box svg { width:14px; height:14px; stroke-width:3; }
.radio { display:inline-flex; gap:8px; align-items:center; cursor:default; user-select:none; } .radio .dot { width:20px; height:20px; border-radius:10px; border:1px solid var(--muted); flex:none; }
.radio.on .dot { border:6px solid var(--accent); background:var(--onAccent); }
.group { display:flex; gap:20px; align-items:center; }
.picker { display:inline-grid; grid-template-columns:repeat(3,1fr); width:242px; }
.picker select { appearance:none; border-radius:0; text-align:center; text-align-last:center; padding:0; background:var(--ctl2); }
.picker select:first-child { border-radius:4px 0 0 4px; } .picker select:last-child { border-radius:0 4px 4px 0; }
.picker select + select { border-left:1px solid var(--page); }
/* section cards: one row per setting, label left, control flush right */
.card { background:var(--card); border-radius:4px; padding:16px 24px 8px; margin-bottom:16px; }
.head { display:flex; align-items:center; gap:16px; font-weight:600; height:40px; }
.head svg { width:20px; height:20px; color:var(--accentText); }
.row { display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:16px; align-items:center; min-height:56px; padding:8px 0; }
.row.child { margin-left:36px; }
.row > .ctl { justify-self:end; display:flex; gap:12px; align-items:center; }
.row .detail { grid-column:1 / -1; margin-top:8px; }
.two-line { display:flex; flex-direction:column; min-width:0; }
.inner { background:var(--inner); border-radius:4px; padding:0 16px; }
.inner + .inner { margin-top:4px; }
.row.press { cursor:default; } .row.press:hover { background:var(--hover); margin:0 -16px; padding:8px 16px; border-radius:4px; }
.chev { transition:transform .15s; } .open > .ctl .chev { transform:rotate(180deg); }
.nested { margin-left:24px; }
/* limits table (B2) */
.limits { display:grid; grid-template-columns:minmax(0,1fr) 160px 160px; column-gap:16px; align-items:center; }
.limits > * { min-height:56px; display:flex; align-items:center; }
.limits > .colhead { min-height:40px; }
.inuse { color:var(--accentText); }
/* schedule */
.week { position:relative; padding-top:8px; }
.ruler { position:relative; height:24px; margin-left:56px; }
.ruler span { position:absolute; top:0; transform:translateX(-50%); } .ruler span:first-child { transform:none; } .ruler span:last-child { transform:translateX(-100%); }
.day { display:flex; align-items:center; height:40px; } .day + .day { margin-top:6px; } .day .name { width:56px; flex:none; }
.lane { flex:1; height:40px; position:relative; background:var(--grid); border-radius:2px; overflow:hidden; }
.lane i { position:absolute; top:0; bottom:0; width:1px; background:var(--gridLine); }
.block { position:absolute; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center; padding:0 6px; line-height:16px; font-size:12px; overflow:hidden; white-space:nowrap; border-radius:2px; cursor:default; }
.block.alt { background:var(--tint); border:1px solid var(--accent); }
.block.pause { background:var(--cautionBg); border:1px solid var(--caution); }
.block.sel { outline:2px solid var(--text); outline-offset:-2px; }
.legend { display:flex; gap:24px; align-items:center; min-height:56px; }
.legend .btn { margin-left:auto; }
.swatch { display:inline-block; width:16px; height:16px; border-radius:3px; vertical-align:-3px; margin-right:8px; }
/* status bar (S2): transfer state left, view and environment right, one line; labels shorten to icons by priority */
.sb { flex:none; display:flex; align-items:center; min-height:32px; padding:8px 16px 12px; white-space:nowrap; overflow:hidden; }
.sb .grp { display:flex; align-items:center; min-width:0; }
.sb .grp + .grp { margin-left:auto; padding-left:24px; }
.si { display:inline-flex; align-items:center; gap:6px; flex:none; cursor:default; }
.si + .si { margin-left:20px; }
.si.icon .t { display:none; }
/* Fixed width holds the longest text a rate can show, so live rates and cap changes never move the items after it. */
.si.rate { width:148px; font-variant-numeric:tabular-nums; }
/* tooltip, after WinUI ToolTip */
.tip { position:fixed; z-index:20; max-width:320px; padding:6px 8px 8px; border-radius:4px; background:var(--tip); border:1px solid var(--tipBorder);
  box-shadow:0 4px 8px rgb(0 0 0 / .26); font-size:12px; line-height:16px; color:var(--text); pointer-events:none; white-space:normal; }
/* prototype controls, not part of the design */
.proto { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:10px; align-items:center; padding:8px 12px; border-radius:999px; z-index:10;
  background:#111; color:#fff; font:12px/16px 'Segoe UI',sans-serif; box-shadow:0 8px 24px rgb(0 0 0 / .5); white-space:nowrap; border:1px solid #444; }
.proto button, .proto select { background:#2a2a2a; color:#fff; border:1px solid #444; border-radius:999px; padding:4px 10px; font:inherit; }
.proto input[type=range] { width:100px; vertical-align:middle; }
.proto .sep { width:1px; height:20px; background:#444; }
/* network tab: encryption and proxy variants */
input.text { width:240px; }
.row.off > .lbl, .row.off > .ctl { opacity:.45; }
.btn.accent { background:var(--accent); border-color:var(--accent); color:var(--onAccent); }
.btn.off { opacity:.45; }
.summary { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.scrim { position:fixed; inset:0; background:rgb(0 0 0 / .45); display:grid; place-items:center; z-index:15; }
.dlg { width:560px; max-width:calc(100vw - 32px); background:var(--card); border:1px solid var(--ctlBorder); border-radius:8px; box-shadow:0 16px 48px rgb(0 0 0 / .4); overflow:hidden; }
.dlg { width:548px; }
.dlg .body { padding:24px; display:flex; flex-direction:column; gap:12px; }
.dlg h2 { display:flex; align-items:center; gap:12px; font:600 20px/28px 'Segoe UI Variable Display','Segoe UI',sans-serif; margin:0 0 4px; }
.dlg h2 svg { width:20px; height:20px; color:var(--accentText); }
.dlg .fld { display:flex; flex-direction:column; gap:8px; min-width:0; } .dlg .fld.off { opacity:.45; }
.dlg .fld input, .dlg .fld select { width:100%; }
.dlg .foot { display:flex; align-items:center; gap:8px; padding:24px; background:var(--page); }
.dlg .foot .status { flex:1; margin-right:24px; }
.dlg .foot .btn { min-width:120px; justify-content:center; }
/* proxy check: WinUI InfoBar and ProgressRing */
.status { display:inline-flex; align-items:center; gap:8px; min-width:0; white-space:nowrap; }
.status .badge { width:16px; height:16px; border-radius:8px; display:grid; place-items:center; flex:none; color:var(--card); }
.status.ok .badge { background:var(--success); } .status.bad .badge { background:var(--critical); }
.status .badge svg { width:10px; height:10px; stroke-width:3.5; }
.ring { width:16px; height:16px; border-radius:50%; border:2px solid var(--ctlBorder); border-top-color:var(--accent); animation:spin .8s linear infinite; flex:none; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ring { animation-duration:2.4s; } }
.actions { display:flex; gap:8px; justify-content:flex-end; padding:8px 0 16px; }
</style>
</head>
<body class="dark">
<div class="window" id="window"></div>
<div class="tip" id="tip" hidden></div>
<div class="proto">

  <select id="state"></select>
  <span class="sep"></span>
  <label><input type="checkbox" id="errors"> Errors</label>
  <label>Width <input id="width" type="range" min="560" max="1600"></label>
  <button id="theme">Theme</button>
</div>

  const count = item('files', s.selected ? `12 torrents · ${s.selected} selected` : '12 torrents', [s.selected ? `12 torrents, ${s.selected} selected` : '12 torrents'], '', 6);
  const filter = s.filter ? item('funnel', 'Downloading · 3', ['Filter: Downloading'], '', 2) : '';
  const update = s.update ? item('update', 'Update available', ['A newer version is available. Choose Help > Update to open its download page.'], '', 1) : '';
  const net = s.net === 'iface' ? ['unplug', 'Adapter missing', 'The selected network adapter NordLynx is not available, so transfers are blocked.']
    : s.net === 'none' ? ['network', 'Port not confirmed', 'No peer has connected to TinyTorrent yet, so its listening port is not confirmed open. Downloads still work.']
    : proxyInUse() ? ['route', 'Proxy in use', `Connections to peers and trackers go through the ${S.proxyType} proxy at ${S.proxyHost}:${S.proxyPort}. Peers cannot connect to you.`]
    : ['network', 'Port open', 'Peers can connect to TinyTorrent through its listening port.'];
  const incoming = item(net[0], net[1], [net[2]], '', 3);
  return `<div class="sb"><span class="grp">${rate(0, 'down', 'Download')}${rate(1, 'up', 'Upload')}${altItem}${paused}</span>
    <span class="grp">${count}${filter}${incoming}${update}</span></div>`;
}
/* Keeps one line: shortens the least important labels to their icons until the bar fits. The tooltip still names each item. */
function fitStatus() {
  const sb = document.querySelector('.sb');
  const items = [...sb.querySelectorAll('.si:not(.icon)')].filter(e => +e.dataset.pri < 9).sort((a, b) => a.dataset.pri - b.dataset.pri);
  while (sb.scrollWidth > sb.clientWidth && items.length) items.shift().classList.add('icon');
}

const tipEl = document.getElementById('tip');
let tipFor = null, tipTimer;
function hideTip() { clearTimeout(tipTimer); tipEl.hidden = true; tipFor = null; }
document.addEventListener('mouseover', ev => {
  const t = ev.target.closest('[data-tip]');
  if (t === tipFor) return;
  hideTip();
  if (!t) return;
  tipFor = t;
  tipTimer = setTimeout(() => {
    tipEl.innerHTML = t.dataset.tip; tipEl.hidden = false;
    const r = t.getBoundingClientRect();
    tipEl.style.left = Math.max(8, Math.min(r.left, innerWidth - tipEl.offsetWidth - 8)) + 'px';
    tipEl.style.top = (r.top - tipEl.offsetHeight - 8) + 'px';
  }, 400);
});

function render() {
  hideTip();
  if (!draft) { clearTimeout(checkTimer); check = null; }
  const w = document.getElementById('window'), keep = w.querySelector('.scroll')?.scrollTop ?? 0;
  const width = Math.min(+document.getElementById('width').value, innerWidth - 24);
  w.style.width = width + 'px';
  w.style.height = (innerHeight - 76) + 'px';
  w.innerHTML = `<div class="chrome"><b style="color:var(--accent)">◆</b><span class="menu"><b>File</b>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Torrent&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;View&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b>Help</b></span>
      <span class="search">Search TinyTorrent</span><span style="width:120px"></span></div>
    <div class="backrow"><span class="btn">${ic('back')}Back</span></div>
    <div class="scroll"><div class="column">${page()}</div></div>${statusbar()}${dialog()}`;
  document.getElementById('variant').textContent = `${variant + 1}/${VARIANTS.length} ${VARIANTS[variant]}`;
  fitStatus();
  w.querySelector('.scroll').scrollTop = keep;
}

const period = id => periods.find(p => p.id === +id);
document.addEventListener('click', ev => {
  if (ev.target.closest('.proto')) return;
  const hit = sel => ev.target.closest(sel);
  let e;
  if ((e = hit('[data-remove]'))) { periods = periods.filter(p => p.id !== +e.dataset.remove); open = null; }
  else if (hit('[data-add]')) { const p = { id:nextId++, days:[1,1,1,1,1,0,0], from:540, to:1020, paused:false }; periods.push(p); open = p.id; }
  else if (hit('select') || hit('input') || hit('.row.off')) return;
  else if (hit('[data-check]')) {
    if (check === 'busy' || draft.proxyType === 'None') return;
    if (!complete(draft)) PROXY.forEach(k => touched.add(k));
    else { check = 'busy'; checkTimer = setTimeout(() => { check = document.getElementById('checkResult').value; render(); }, 1200); }
  }
  else if (hit('[data-edit]')) { draft = Object.fromEntries(PROXY.map(k => [k, S[k]])); touched.clear(); }
  else if (hit('[data-cancel]')) draft = null;
  else if (hit('[data-save]')) { if (draft.proxyType !== 'None' && !complete(draft)) PROXY.forEach(k => touched.add(k)); else { Object.assign(S, draft); draft = null; } }
  else if (hit('.scrim')) return;
  else if (hit('[data-proxy]')) proxyOpen = !proxyOpen;
  else if ((e = hit('.tg[data-k]'))) S[e.dataset.k] = !S[e.dataset.k];
  else if ((e = hit('[data-day]'))) { const p = period(e.dataset.p); p.days[e.dataset.day] ^= 1; }
  else if ((e = hit('[data-mode]'))) period(e.dataset.p).paused = e.dataset.mode === 'true';
  else if ((e = hit('[data-open]'))) open = open === +e.dataset.open ? null : +e.dataset.open;
  else if ((e = hit('[data-tab],[data-goto]'))) { tab = e.dataset.tab || e.dataset.goto; remember('tab', tab); }
  else return;
  render();
});
document.addEventListener('change', ev => {
  if (ev.target.closest('.proto')) return;
  const pk = ev.target.closest('.picker');
  if (pk) {
    const [h, m, a] = [...pk.querySelectorAll('select')].map(s => s.value);
    period(pk.dataset.p)[pk.dataset.f] = ((+h % 12) + (a === 'PM' ? 12 : 0)) * 60 + +m;
  } else if (ev.target.dataset?.d) {
    draft[ev.target.dataset.d] = ev.target.value; touched.add(ev.target.dataset.d);
    clearTimeout(checkTimer); check = null;
  } else {
    const k = ev.target.dataset?.k; if (!k || DEF[k]?.err) return;
    S[k] = ev.target.value; touched.add(k);
  }
  render();
});
function remember(key, value) { params.set(key, value); try { history.replaceState(null, '', '?' + params); } catch { } }
const statePick = document.getElementById('state');
statePick.innerHTML = Object.keys(STATES).map(n => `<option>${n}</option>`).join('');
statePick.onchange = () => { state = statePick.value; render(); };
function setVariant(i) { variant = (i + VARIANTS.length) % VARIANTS.length; draft = null; remember('variant', variant + 1); render(); }
document.getElementById('prev').onclick = () => setVariant(variant - 1);
document.getElementById('next').onclick = () => setVariant(variant + 1);
document.getElementById('sampleProxy').onclick = () => {
  Object.assign(S, S.proxyType === 'None' ? { proxyType:'SOCKS5', proxyHost:'proxy.example.net', proxyPort:'1080', proxyUser:'marta', proxyPass:'secret' }
    : { proxyType:'None', proxyHost:'', proxyPort:'', proxyUser:'', proxyPass:'' });
  touched.clear(); draft = null; render();
};
document.addEventListener('keydown', ev => {
  if (draft && ev.key === 'Escape') { draft = null; render(); return; }
  if (ev.target.closest('input, select, textarea')) return;
  if (ev.key === 'ArrowLeft') setVariant(variant - 1);
  if (ev.key === 'ArrowRight') setVariant(variant + 1);
});
variant = Math.max(0, Math.min(VARIANTS.length - 1, (+params.get('variant') || 2) - 1));
const checkPick = document.getElementById('checkResult');
checkPick.innerHTML = Object.keys(CHECKS).map(n => `<option>${n}</option>`).join('');
document.getElementById('errors').onchange = ev => { S.errors = ev.target.checked; render(); };
document.getElementById('theme').onclick = () => { document.body.classList.toggle('dark'); render(); };
document.getElementById('width').value = Math.max(560, Math.min(1303, innerWidth - 24));
document.getElementById('width').oninput = render;
addEventListener('resize', render);
render();
</script>
</body>
