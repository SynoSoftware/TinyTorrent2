<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remove torrents prototype</title>
<!-- PROTOTYPE, throw away. The question: how should the Remove torrents dialog offer the two deletions?
     Variant A is the dialog as it ships: one "Also move ... to the Recycle Bin" check box per line. Variants B-E put both
     check boxes on one line and add a result line under them that says what Remove will do. ?variant= picks the layout,
     ?copy= picks the wording of the result line; the left and right arrow keys cycle the layout.
     Delete sends ticked files to the Recycle Bin; Shift+Delete deletes them permanently. The dialog never asks which.
     Sizes follow the real dialog: 560 px content, 24 px padding, 16 px button-row padding, 120 px button minimum. -->
<style>
* { box-sizing: border-box; }
:root { color-scheme:light; --base:#f3f3f3; --dialog:#ffffff; --footer:#f3f3f3; --line:#e5e5e5; --text:#1a1a1a; --muted:#5f5f5f;
  --accent:#005fb8; --on-accent:#ffffff; --control:#fbfbfb; --control-line:#e5e5e5; --stroke:#8a8a8a; --subtle:rgb(0 0 0 / .04);
  --smoke:rgb(0 0 0 / .3); --caution:#9d5d00; }
body.dark { color-scheme:dark; --base:#1c1f24; --dialog:#2b2b2b; --footer:#202020; --line:#3a3a3a; --text:#ffffff; --muted:#c8c8c8;
  --accent:#60cdff; --on-accent:#000000; --control:#2d2d2d; --control-line:#3a3a3a; --stroke:#9a9a9a; --subtle:rgb(255 255 255 / .05);
  --smoke:rgb(0 0 0 / .45); --caution:#fce100; }
body { margin:0; background:var(--base); color:var(--text); font:14px/20px 'Segoe UI Variable Text','Segoe UI',sans-serif; }
.muted { color:var(--muted); } .num { font-variant-numeric:tabular-nums; }
.trim { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
svg.i { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* mocked main window behind the dialog */
.app { position:fixed; inset:0 0 72px 0; padding:16px; display:flex; flex-direction:column; gap:2px; overflow:hidden; }
.app .row { display:grid; grid-template-columns:1fr 100px 120px 120px; gap:16px; height:36px; align-items:center; padding:0 12px; border-radius:4px; }
.app .row.sel { background:var(--subtle); box-shadow:inset 3px 0 0 var(--accent); }
.smoke { position:fixed; inset:0; background:var(--smoke); }

/* ContentDialog: 560 px content, 24 px padding, Subtitle title, button row with 16 px padding */
.dialog { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:608px; max-width:calc(100vw - 32px); background:var(--dialog);
  border:1px solid var(--line); border-radius:8px; box-shadow:0 32px 64px rgb(0 0 0 / .37); display:flex; flex-direction:column;
  max-height:calc(100vh - 160px); overflow:hidden; }
.content { padding:24px; display:flex; flex-direction:column; gap:12px; min-height:0; }
.title { display:flex; align-items:center; gap:12px; font-family:'Segoe UI Variable Display','Segoe UI',sans-serif; font-size:20px; line-height:28px;
  font-weight:600; flex:none; min-width:0; }
.title svg.i { width:24px; height:24px; }
.footer { flex:none; background:var(--footer); border-top:1px solid var(--line); padding:16px 24px; display:flex; align-items:center; gap:8px; }
.footer .left { flex:1; min-width:0; display:flex; align-items:center; margin-right:16px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:32px; min-width:120px; padding:0 11px; border-radius:4px;
  border:1px solid var(--control-line); background:var(--control); color:var(--text); font:inherit; cursor:default; white-space:nowrap; }
.btn.accent { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

/* the approved body: folders that scroll, then the deletion choice */
.groups { display:flex; flex-direction:column; gap:12px; max-height:224px; overflow:auto; }
.group .head { display:grid; grid-template-columns:16px minmax(0,1fr); column-gap:8px; align-items:center; font-weight:600; min-height:24px; }
.group .line { display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:16px; padding-left:24px; min-height:32px; align-items:center; }
.group .line .name { font-weight:600; }
.choice { border-top:1px solid var(--line); padding-top:12px; margin-top:4px; display:flex; flex-direction:column; }

/* one line holding both check boxes; wraps only when a language needs it */
.inline { display:flex; flex-wrap:wrap; align-items:center; column-gap:24px; row-gap:0; }
.inline .lead { font-weight:600; margin-right:-8px; }
.inline .where { margin-left:auto; }
.header { font-weight:600; min-height:20px; margin-bottom:4px; }
/* what Remove will do, under the check boxes */
.result { display:flex; align-items:flex-start; gap:8px; margin-top:8px; color:var(--muted); }
.result svg.i { margin-top:2px; }
.result.caution { color:var(--text); }
.result.caution svg.i { color:var(--caution); }

/* Fluent check box */
.check { display:flex; align-items:center; gap:8px; min-height:32px; cursor:default; user-select:none; }
.check .box { width:20px; height:20px; border-radius:4px; border:1px solid var(--stroke); flex:none; display:grid; place-items:center; }
.check.on .box { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.check .box svg.i { width:12px; height:12px; stroke-width:3; }

/* prototype controls, not part of the design */
.proto { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:10px; align-items:center; padding:8px 12px; border-radius:999px;
  background:#111; color:#fff; font:12px/16px 'Segoe UI',sans-serif; box-shadow:0 8px 24px rgb(0 0 0 / .4); white-space:nowrap; z-index:9; }
.proto button,.proto select { background:#2a2a2a; color:#fff; border:1px solid #444; border-radius:999px; padding:4px 10px; font:inherit; }
.proto .variant { min-width:220px; text-align:center; font-weight:600; }
.state { position:fixed; left:16px; top:16px; max-width:min(360px, calc(100vw - 32px)); padding:8px 12px; border-radius:8px; background:#111; color:#fff;
  font:12px/16px Consolas,monospace; z-index:9; white-space:pre-wrap; }
</style>
</head>
<body class="dark">
<div class="app" id="app"></div>
<div class="smoke"></div>
<div id="dialog"></div>
<div class="state" id="state"></div>
<div class="proto">
  <button id="prev" title="Previous layout (←)">←</button><span class="variant" id="variantName"></span><button id="next" title="Next layout (→)">→</button>
  <select id="copy" title="Wording of the result line"></select>
  <select id="key"><option value="delete">Opened by Delete</option><option value="shift">Opened by Shift+Delete</option></select>
  <select id="scenario">
    <option value="file">From a .torrent file</option><option value="magnet">From a magnet link</option>
    <option value="mixed">Three: files and a magnet</option><option value="many">40 torrents</option><option value="long">Long name and folder</option>
    <option value="shared">Files shared with another torrent</option>
  </select>
  <button id="theme">Theme</button>
</div>
<script>
const ICON = {
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>',
  listx:'<svg class="i" viewBox="0 0 24 24"><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="m19 10-4 4"/><path d="m15 10 4 4"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  folder:'<svg class="i" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>',
  check:'<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  info:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>',
  warn:'<svg class="i" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
};
const DL = 'C:\\Users\\user\\Downloads';
// source: the .torrent file the torrent was added from, when it still exists; magnets have none.
const T = {
  ride:  { name:'The Longest Ride (2015) [2160p] [4K] [WEB] [5.1] [YTS.BZ]', size:6.12e9, folder:DL, source:DL + '\\The Longest Ride.torrent', sourceSize:30413 },
  mint:  { name:'linuxmint-22-cinnamon-64bit.iso', size:2.9e9, folder:DL, source:null },
  bunny: { name:'Big Buck Bunny (2008) 1080p', size:2.86e9, folder:'D:\\Media\\Films', source:DL + '\\Big Buck Bunny.torrent', sourceSize:21400 },
  archive:{ name:'The Complete Archive of Public Domain Radio Dramas, Volumes 1–48, Remastered FLAC with Scans and Liner Notes', size:184.2e9,
           folder:'\\\\nas\\archive\\Audio\\Radio Dramas\\Public Domain', source:DL + '\\radio-dramas.torrent', sourceSize:1.9e6 },
};
const many = Array.from({ length:40 }, (_, i) => ({
  name:`Lecture ${String(i + 1).padStart(2, '0')} - Distributed Systems (Fall 2025).mp4`, size:(0.4 + (i * 37 % 11) / 10) * 1e9,
  folder:i < 24 ? 'E:\\Courses\\Distributed Systems' : DL, source:i % 3 ? DL + `\\lecture-${i + 1}.torrent` : null, sourceSize:18000 + i * 300 }));
const SCENARIOS = { file:[T.ride], magnet:[T.mint], mixed:[T.ride, T.bunny, T.mint], many, long:[T.archive],
  shared:[{ ...T.ride, shared:true }] };

const VARIANTS = {
  A:'A · Now: one check box per line',
  B:'B · "Delete:" line, mode on the right',
  C:'C · "Also delete" header above',
  D:'D · Mode as the line label',
  E:'E · Verbs on the check boxes',
};
const KEYS = Object.keys(VARIANTS);

const bytes = n => { const u = ['B','KiB','MiB','GiB','TiB']; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return i ? n.toFixed(1) + ' ' + u[i] : n + ' B'; };
const esc = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const trim = (v, cls = '') => `<span class="trim ${cls}" title="${esc(v)}">${esc(v)}</span>`;
const folders = () => { const g = {}; for (const t of s) (g[t.folder] ??= []).push(t); return Object.entries(g); };
const withSource = () => s.filter(t => t.source);
const filesSize = () => bytes(s.reduce((a, t) => a + t.size, 0));
const sourceSize = () => bytes(withSource().reduce((a, t) => a + t.sourceSize, 0));
// "2 of 3" when only some torrents still have their .torrent file
const someOf = () => withSource().length === s.length ? '' : `${withSource().length} of ${s.length}, `;
const check = (on, name, text, tip = '') =>
  `<span class="check ${on ? 'on' : ''}" data-toggle="${name}" title="${esc(tip)}"><span class="box">${on ? ICON.check : ''}</span>${text}</span>`;
const button = (glyph, word, tip, accent, act) =>
  `<button class="btn ${accent ? 'accent' : ''}" title="${esc(tip)}" data-act="${act}">${glyph}${word}</button>`;
const recycle = () => key === 'delete';

// Each copy set words the result line for the five outcomes. one = a single torrent.
const COPY = {
  does:{ name:'Copy 1 · Says what Remove does', text(o, one) {
    const it = one ? 'the torrent' : `${s.length} torrents`, its = one ? 'its' : 'their';
    const tf = one ? 'torrent file' : 'torrent files';
    return {
      none:`Removes ${it} from the list. The files stay on the drive.`,
      files:`Removes ${it} and moves ${its} files to the Recycle Bin.`,
      source:`Removes ${it} and moves ${its} ${tf} to the Recycle Bin. The downloaded files stay.`,
      both:`Removes ${it} and moves ${its} files and ${tf} to the Recycle Bin.`,
      gone:`Removes ${it} and permanently deletes the ticked files. You can't undo this.`,
    }[o]; } },
  ends:{ name:'Copy 2 · Says where the files end up', text(o, one) {
    const tf = one ? 'The torrent file goes' : 'The torrent files go';
    return {
      none:'The files stay on the drive.',
      files:'The files go to the Recycle Bin.',
      source:`${tf} to the Recycle Bin. The downloaded files stay on the drive.`,
      both:`The files and the ${one ? 'torrent file' : 'torrent files'} go to the Recycle Bin.`,
      gone:"The ticked files are deleted permanently. You can't undo this.",
    }[o]; } },
  short:{ name:'Copy 3 · Shortest', text(o) {
    return {
      none:'No files are deleted.',
      files:`${filesSize()} goes to the Recycle Bin.`,
      source:'Only the torrent file goes to the Recycle Bin.',
      both:'Everything ticked goes to the Recycle Bin.',
      gone:"Deleted permanently. You can't undo this.",
    }[o]; } },
  // With nothing ticked, the line says what Remove does, because people read Remove as deleting files and miss that
  // it clears the list. A ticked box already says the torrent goes, so the line then names only the deletion.
  list:{ name:'Copy 4 · List first, then the drive', text(o, one) {
    const tf = one ? 'the torrent file' : 'the torrent files';
    // The engine keeps files another torrent uses, so the size would overstate what goes.
    if (downloaded && s.some(t => t.shared) && o !== 'none')
      return recycle() ? 'Moves the files to the Recycle Bin, except files other torrents use.'
        : 'Permanently deletes the files, except files other torrents use.';
    return {
      none:`No files are deleted. Removes only the ${one ? 'entry' : 'entries'} from TinyTorrent.`,
      files:`Moves ${filesSize()} to the Recycle Bin.`,
      source:`Moves ${tf} to the Recycle Bin.`,
      both:`Moves ${filesSize()} to the Recycle Bin.`,
      gone:`Permanently deletes ${tickedSize()}.`,
    }[o]; } },
};
const tickedSize = () => bytes((downloaded ? s.reduce((a, t) => a + t.size, 0) : 0) + (torrentFiles ? withSource().reduce((a, t) => a + t.sourceSize, 0) : 0));

let s = SCENARIOS.file, key = 'delete', downloaded = false, torrentFiles = false, optOut = false;
let variant = 'E', copy = 'list';
// What Remove saved last time; Cancel saves nothing, as with Don't show this dialog again.
const saved = { downloaded:false, torrentFiles:false };

function outcome() {
  const source = torrentFiles && withSource().length > 0;
  if (!downloaded && !source) return 'none';
  if (!recycle()) return 'gone';
  return downloaded && source ? 'both' : downloaded ? 'files' : 'source';
}
function resultLine(trashWhenDeleting) {
  const o = outcome();
  const glyph = o === 'gone' ? ICON.warn : trashWhenDeleting && o !== 'none' ? ICON.trash : ICON.info;
  return `<div class="result ${o === 'gone' ? 'caution' : ''}">${glyph}<span>${COPY[copy].text(o, s.length === 1)}</span></div>`;
}

// A: the shipped labels from en.json, one check box per line
function choiceA() {
  const n = withSource().length, one = n === 1;
  const fileLabel = recycle() ? `Also move the files to the Recycle Bin (${filesSize()})` : `Also permanently delete the files (${filesSize()})`;
  const srcLabel = n === s.length
    ? (recycle() ? `Also move the torrent ${one ? 'file' : 'files'} to the Recycle Bin (${sourceSize()})` : `Also permanently delete the torrent ${one ? 'file' : 'files'} (${sourceSize()})`)
    : (recycle() ? `Also move ${n} of ${s.length} torrent files to the Recycle Bin (${sourceSize()})` : `Also permanently delete ${n} of ${s.length} torrent files (${sourceSize()})`);
  return check(downloaded, 'downloaded', fileLabel) + (n ? check(torrentFiles, 'torrentFiles', srcLabel) : '');
}
// B: the owner's sketch. Delete: [ ] Files (5.7 GiB) [ ] .torrent (29.7 KiB) ........ to Recycle Bin
function choiceB() {
  return `<div class="inline"><span class="lead">Delete:</span>
      ${check(downloaded, 'downloaded', `Files <span class="muted num">(${filesSize()})</span>`, 'The files these torrents downloaded')}
      ${withSource().length ? check(torrentFiles, 'torrentFiles', `.torrent <span class="muted num">(${someOf()}${sourceSize()})</span>`, 'The .torrent files these torrents were added from') : ''}
      <span class="where muted">${recycle() ? 'to Recycle Bin' : 'permanently'}</span></div>${resultLine(false)}`;
}
// C: a Fluent group header above the check boxes; the result line alone says where the files go
function choiceC() {
  return `<div class="header">Also delete</div><div class="inline">
      ${check(downloaded, 'downloaded', `Downloaded files <span class="muted num">${filesSize()}</span>`, 'The files these torrents downloaded')}
      ${withSource().length ? check(torrentFiles, 'torrentFiles', `Torrent ${withSource().length === 1 ? 'file' : 'files'} <span class="muted num">${someOf()}${sourceSize()}</span>`, 'The .torrent files these torrents were added from') : ''}
      </div>${resultLine(false)}`;
}
// D: the line label names the mode the key chose
function choiceD() {
  return `<div class="inline"><span class="lead">${recycle() ? 'Move to Recycle Bin:' : 'Delete permanently:'}</span>
      ${check(downloaded, 'downloaded', `Files <span class="muted num">(${filesSize()})</span>`, 'The files these torrents downloaded')}
      ${withSource().length ? check(torrentFiles, 'torrentFiles', `Torrent ${withSource().length === 1 ? 'file' : 'files'} <span class="muted num">(${someOf()}${sourceSize()})</span>`, 'The .torrent files these torrents were added from') : ''}
      </div>${resultLine(false)}`;
}
// E: verbs on the check boxes, no line label; the result line's icon turns to a bin when something will be deleted
function choiceE() {
  return `<div class="inline">
      ${check(downloaded, 'downloaded', `Delete files <span class="muted num">(${filesSize()})</span>`, 'The files these torrents downloaded')}
      ${withSource().length ? check(torrentFiles, 'torrentFiles', `Delete torrent ${withSource().length === 1 ? 'file' : 'files'} <span class="muted num">(${someOf()}${sourceSize()})</span>`, 'The .torrent files these torrents were added from') : ''}
      </div>${resultLine(true)}`;
}
const CHOICE = { A:choiceA, B:choiceB, C:choiceC, D:choiceD, E:choiceE };

function dialog() {
  const deleting = outcome() !== 'none';
  const body = `<div class="groups">${folders().map(([f, list]) =>
      `<div class="group"><div class="head">${ICON.folder}${trim(f)}</div>${list.map(t =>
        `<div class="line">${trim(t.name, 'name')}<span class="muted num">${bytes(t.size)}</span></div>`).join('')}</div>`).join('')}</div>
    <div class="choice">${CHOICE[variant]()}</div>`;
  // The title says Remove and the body says what happens to the files, so the button stays Remove.
  const act = button(ICON.listx, 'Remove', deleting
    ? `Remove the torrents from the list and ${recycle() ? 'move the ticked files to the Recycle Bin' : 'permanently delete the ticked files'}`
    : 'Remove the torrents from the list. Downloaded files stay on disk.', true, 'remove');
  return `<div class="dialog"><div class="content"><div class="title">${ICON.trash}<span class="trim">${s.length === 1 ? 'Remove torrent?' : `Remove ${s.length} torrents?`}</span></div>${body}</div>
    <div class="footer"><div class="left">${check(optOut, 'optOut', "Don't show this dialog again")}</div>${act}${button(ICON.x, 'Cancel', '', false, 'cancel')}</div></div>`;
}

function render() {
  const rows = ['The Longest Ride (2015) [2160p] [4K] [WEB] [5.1] [YTS.BZ]','Big Buck Bunny (2008) 1080p','linuxmint-22-cinnamon-64bit.iso','Debian 12 DVD set','Sintel (2010) 4K','Fedora-Workstation-Live-41.iso','Tears of Steel (2012)','archlinux-2026.10.01-x86_64.iso','Cosmos Laundromat (2015)','openSUSE-Tumbleweed-DVD.iso'];
  const chosen = new Set(s.map(t => t.name));
  document.getElementById('app').innerHTML = rows.map((n, i) => `<div class="row ${chosen.has(n) ? 'sel' : ''}"><span class="trim">${n}</span><span class="muted">${(i * 1.7 % 9 + 1).toFixed(1)} GiB</span><span class="muted">Seeding</span><span class="muted">${(i * 0.37 % 3).toFixed(2)}</span></div>`).join('');
  document.getElementById('dialog').innerHTML = dialog();
  document.getElementById('variantName').textContent = VARIANTS[variant];
  const one = s.length === 1, words = COPY[copy];
  document.getElementById('state').textContent =
    `layout ${VARIANTS[variant]}\nresult line: ${variant === 'A' ? 'none in A' : words.name}\n` +
    `opened by: ${recycle() ? 'Delete (files go to the Recycle Bin)' : 'Shift+Delete (files are deleted permanently)'}\n` +
    `torrents with a .torrent file: ${withSource().length} of ${s.length}\n` +
    `ticked: files ${downloaded}, torrent file ${withSource().length ? torrentFiles : 'not offered'}; outcome: ${outcome()}\n\n` +
    `${words.name}, every outcome for this selection:\n` +
    ['none','files','source','both','gone'].map(o => `  ${o.padEnd(6)} ${words.text(o, one)}`).join('\n') +
    `\n\n(Remove and Cancel reopen the dialog)`;
  const url = new URL(location.href);
  url.searchParams.set('variant', variant);
  url.searchParams.set('copy', copy);
  history.replaceState(null, '', url);
}
// Each opening starts from what the last Remove saved.
function reopen() { downloaded = saved.downloaded; torrentFiles = saved.torrentFiles; optOut = false; render(); }
function step(by) { variant = KEYS[(KEYS.indexOf(variant) + by + KEYS.length) % KEYS.length]; render(); }

document.getElementById('dialog').addEventListener('click', ev => {
  const toggle = ev.target.closest('[data-toggle]'), act = ev.target.closest('[data-act]');
  if (act) {
    if (act.dataset.act === 'remove') Object.assign(saved, { downloaded, torrentFiles });
    reopen();
    return;
  }
  if (!toggle) return;
  if (toggle.dataset.toggle === 'downloaded') downloaded = !downloaded;
  if (toggle.dataset.toggle === 'torrentFiles') torrentFiles = !torrentFiles;
  if (toggle.dataset.toggle === 'optOut') optOut = !optOut;
  render();
});
const copySelect = document.getElementById('copy');
copySelect.innerHTML = Object.entries(COPY).map(([k, c]) => `<option value="${k}">${c.name}</option>`).join('');
copySelect.onchange = ev => { copy = ev.target.value; render(); };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', ev => {
  if (ev.target.closest('select,input,textarea,[contenteditable]')) return;
  if (ev.key === 'ArrowLeft') step(-1);
  if (ev.key === 'ArrowRight') step(1);
});
document.getElementById('key').onchange = ev => { key = ev.target.value; render(); };
document.getElementById('scenario').onchange = ev => { s = SCENARIOS[ev.target.value]; render(); };
document.getElementById('theme').onclick = () => document.body.classList.toggle('dark');

const params = new URLSearchParams(location.search);
if (VARIANTS[params.get('variant')]) variant = params.get('variant');
if (COPY[params.get('copy')]) copy = params.get('copy');
copySelect.value = copy;
reopen();
</script>
</body>
</html>
