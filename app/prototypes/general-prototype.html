<style>
/* Colours follow the app: --line is DividerStrokeColorDefaultBrush and a paused bar uses --muted
   (TextFillColorSecondaryBrush). Dark --base and --card were sampled from the running app over desktop acrylic,
   so they vary with the wallpaper. --accent is the default Windows accent; the app uses the system accent. */
* { box-sizing: border-box; }
:root { color-scheme:light; --base:#f3f3f3; --card:#fbfbfb; --line:rgb(0 0 0 / .059); --text:#1a1a1a; --muted:#5f5f5f; --accent:#005fb8;
  --subtle2:rgb(0 0 0 / .06); --track:rgb(0 0 0 / .45); --critical:#c42b1c; }
body.dark { color-scheme:dark; --base:#273035; --card:#323b40; --line:rgb(255 255 255 / .082); --text:#ffffff; --muted:#c8c8c8; --accent:#60cdff;
  --subtle2:rgb(255 255 255 / .08); --track:rgb(255 255 255 / .55); --critical:#ff99a4; }
body { margin:0; background:var(--base); color:var(--text); font:14px/20px 'Segoe UI Variable Text','Segoe UI',sans-serif; }
.window { width:calc(100vw - 32px); height:340px; margin:16px auto 96px; border:1px solid var(--line); border-radius:8px; background:var(--card); overflow:hidden; display:flex; flex-direction:column; }
.tabs { display:flex; align-items:center; gap:24px; padding:10px 16px; border-bottom:1px solid var(--line); flex:none; }
.tabs .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; } .tabs .size { color:var(--muted); margin-right:auto; white-space:nowrap; }
.tabs .tab { position:relative; white-space:nowrap; } .tabs .tab.on::after { content:''; position:absolute; left:calc(50% - 8px); bottom:-10px; width:16px; height:3px; border-radius:2px; background:var(--accent); }
.body { flex:1; min-height:0; overflow:auto; padding:8px 16px 12px; container-type:inline-size; }
.num { font-variant-numeric:tabular-nums; }
.mono { font-family:'Cascadia Mono',Consolas,monospace; font-size:13px; color:var(--muted); }
.trim { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
svg.i { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; }
.btn { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; margin-left:-8px; border-radius:4px; border:0; background:transparent; color:var(--text); flex:none; cursor:default; }
.btn:hover { background:var(--subtle2); }
.progress { height:3px; border-radius:2px; position:relative; margin:8px 0; background:linear-gradient(var(--track),var(--track)) 0 50%/100% 1px no-repeat; }
.progress > i { position:absolute; left:0; top:0; height:3px; border-radius:2px; background:var(--accent); }
.progress.error > i { background:var(--critical); } .progress.paused > i { background:var(--muted); }
.progress.indeterminate { overflow:hidden; } .progress.indeterminate > i { width:30%; animation:slide 2s linear infinite; }
@keyframes slide { from { left:-30%; } to { left:100%; } }

/* H: two groups on the pane's own surface. Each opens with a 20px accent icon and a BodyStrong title, as the
   app's Settings and Add groups do. Statistics are Caption labels over BodyLarge values in one row, or two rows
   of three when narrow; their columns fit their content and share the free width. Detail labels are Body. One
   divider separates the groups; space, not a line, separates the speeds from the statistics. */
.view { display:flex; flex-direction:column; gap:16px; padding-top:4px; }
.title { display:flex; align-items:center; gap:8px; margin:0 0 12px; font-size:14px; line-height:20px; font-weight:600; }
.title svg.i { width:20px; height:20px; color:var(--accent); }
.properties .title { margin-bottom:6px; }
.head { display:flex; align-items:center; gap:16px; }
.head .state, .head .pct { font-family:'Segoe UI Variable Display','Segoe UI',sans-serif; font-size:20px; line-height:28px; font-weight:600; }
.head .state { flex:1; }
.meta { display:flex; align-items:center; gap:24px; }
.meta .trim { flex:1; } .meta .trim.error { color:var(--critical); }
.rate { display:inline-flex; align-items:center; justify-content:flex-end; gap:4px; min-width:112px; }
.divider { border:0; margin:8px 0; }
.strip { display:grid; grid-template-columns:repeat(3,minmax(0,max-content)); justify-content:space-between; gap:12px 32px; }
.stat { display:grid; grid-template-columns:20px minmax(0,1fr); column-gap:12px; align-items:center; min-width:0; }
.stat > svg.i { grid-row:1 / span 2; width:20px; height:20px; color:var(--muted); }
.stat .k { font-size:12px; line-height:16px; color:var(--muted); }
.stat .v { font-size:18px; line-height:24px; }
.details { display:grid; grid-template-columns:minmax(0,1fr); column-gap:48px; align-items:start; }
@container (min-width:760px) { .strip { grid-template-columns:repeat(6,minmax(0,max-content)); } .details { grid-template-columns:minmax(0,3fr) minmax(0,2fr); } }
.row { display:flex; align-items:center; gap:12px; min-height:32px; min-width:0; }
.row > .k { display:inline-flex; align-items:center; gap:8px; width:140px; flex:none; color:var(--muted); }
.row > .trim { flex:0 1 auto; }

.properties { border-top:1px solid var(--line); padding-top:16px; }

/* prototype controls, not part of the design */
.proto { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:10px; align-items:center; padding:8px 12px; border-radius:999px;
  background:#111; color:#fff; font:12px/16px 'Segoe UI',sans-serif; box-shadow:0 8px 24px rgb(0 0 0 / .4); white-space:nowrap; z-index:9; }
.proto button,.proto select { background:#2a2a2a; color:#fff; border:1px solid #444; border-radius:999px; padding:4px 10px; font:inherit; }
.proto strong { min-width:220px; text-align:center; } .proto input { width:90px; vertical-align:middle; }

document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', ev => { if (ev.target.closest('input,select,textarea')) return; if (ev.key === 'ArrowLeft') step(-1); if (ev.key === 'ArrowRight') step(1); });
document.getElementById('scenario').onchange = ev => { t = SCENARIOS[ev.target.value]; render(); };
document.getElementById('theme').onclick = () => document.body.classList.toggle('dark');
const size = () => { const w = document.getElementById('window'); w.style.width = document.getElementById('width').value + 'px'; w.style.height = document.getElementById('height').value + 'px'; };
document.getElementById('width').oninput = size; document.getElementById('height').oninput = size;
size();
render();
</script>
</body>
</html>
